- name: action.fox_pass_door
  family: action
  formals: {}
  body:
    value:
      schema: c0.value.v1
      bindings: []
      guard:
        all:
        - call:
            ref: transport.unboarded
            args:
              seats: {ref: scene.balloon_seats}
              person: {ref: actor.name}
        - call:
            ref: movement.ordinary_floor_passable
            args:
              floors: {ref: scene.floors}
              stairs: {ref: scene.stair_paths}
              unclimbable_stairs: {ref: scene.unclimbable_stairs}
              start: {ref: actor.site}
              destination: {ref: payload.destination}
        - all:
          - actor.name == payload.actor and actor.vital.life == 'alive' and actor.cold_state != 'frozen'
          - actor.site == door.front or actor.site == door.back
          - call: {ref: movement.has_declared_site, args: {sites: {ref: scene.sites}, site: {ref: door.front}}}
          - call: {ref: movement.has_declared_site, args: {sites: {ref: scene.sites}, site: {ref: door.back}}}
        - door.opened and not door.frozen and actor.current_movement_speed > 0
        - (actor.site == door.front and payload.destination == door.back) or (actor.site == door.back
          and payload.destination == door.front)
        - payload.base_move_cost == door.base_move_cost
      outputs:
        action: {ref: occurrence}
        last_action_ref: {ref: occurrence}
        site: {ref: payload.destination}
        known_sites:
          call:
            ref: movement.remember_site
            args:
              known_sites: {ref: actor.known_sites}
              destination: {ref: payload.destination}
