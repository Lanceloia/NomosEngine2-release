# Adapted from Thawed Through the Everflame (CC BY-SA 4.0).
# Declarations preserve each participants authority and exact evidence.
lawdefs:
  - name: action.bar_inspect_drink
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings: []
        guard:
          require:
            - identity: actor.name == payload.actor
            - awake: actor.awake
            - custody: drink.holder == actor.name
        outputs:
          action: {ref: occurrence}
          last_action_ref: {ref: occurrence}
          drink_sighting:
            record:
              type: DrinkSighting
              fields: {container: {ref: payload.drink}, holder: {ref: actor.name}, site: {ref: actor.site}, frozen: {ref: drink.frozen}, portions: {ref: drink.portions}, capacity: {ref: drink.capacity}, change_ref: {ref: drink.change_ref}, observation: {ref: occurrence}}
  - name: action.set_door
    family: action
    formals: {opened: bool}
    body:
      value:
        schema: c0.value.v1
        bindings: []
        guard:
          all:
            - {all: [actor.name == payload.actor and actor.vital.life == 'alive' and actor.cold_state != 'frozen', actor.site == door.front or actor.site == door.back, {exactly_one: {collection: {ref: scene.sites}, as: declared, where: declared == door.front}}, {exactly_one: {collection: {ref: scene.sites}, as: declared, where: declared == door.back}}]}
            - not door.frozen
            - {not: {eq: [{ref: door.opened}, {arg: opened}]}}
        outputs: {action: {ref: occurrence}, last_action_ref: {ref: occurrence}, opened: {arg: opened}, change_ref: {ref: occurrence}}
  - name: action.offer_share
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings:
          - name: offer
            stage: effect
            let:
              record:
                type: DrinkShareOffer
                fields: {speaker: {ref: actor.name}, recipient: {ref: guardian.name}, site: {ref: actor.site}, container: {ref: payload.drink}, container_change_ref: {ref: drink.change_ref}, utterance: {ref: occurrence}}
        guard:
          require:
            - identity: actor.name == payload.actor and actor.awake and guardian.name == payload.guardian
            - seen: actor.guard_sighting is not None and actor.guard_sighting.name == guardian.name and actor.guard_sighting.site == actor.site and actor.guard_sighting.present
            - local: actor.site == guardian.site and guardian.awake and drink.holder == actor.name
            - inspected: actor.drink_sighting is not None and actor.drink_sighting.container == payload.drink and actor.drink_sighting.holder == actor.name and actor.drink_sighting.site == actor.site and actor.drink_sighting.change_ref == drink.change_ref
            - liquid: not actor.drink_sighting.frozen and actor.drink_sighting.portions > 0 and not drink.frozen and drink.portions > 0
            - new_offer: actor.share_offer is None or actor.share_withdrawn_ref is not None or actor.share_used_ref is not None or (actor.share_offer is not None and (actor.share_offer.container != payload.drink or actor.share_offer.container_change_ref != drink.change_ref))
        outputs: {action: {ref: occurrence}, last_action_ref: {ref: occurrence}, share_offer: {ref: offer}, drink_share_offer: {ref: offer}, share_used_ref: null, share_withdrawn_ref: null}
  - name: event.share_heard
    family: direct_actor_event
    formals: {}
    body:
      law:
        schema: c0.value.v1
        bindings: []
        guard: scene.drink_share_offer is not None and scene.drink_share_offer.utterance == trigger.occurrence and scene.drink_share_offer.recipient == actor.name and scene.drink_share_offer.site == actor.site and actor.awake and actor.attending
        outputs:
          heard_share: {ref: scene.drink_share_offer}
          share_hearing_ref: {ref: occurrence}
          visitor_sightings:
            append:
              - {collect_matching: {collection: {ref: actor.visitor_sightings}, as: old, where: old.name != scene.drink_share_offer.speaker, value: {ref: old}}}
              - record:
                  type: GuardSighting
                  fields: {name: {ref: scene.drink_share_offer.speaker}, site: {ref: actor.site}, present: true, observation: {ref: occurrence}}
  - name: action.withdraw_share
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings: []
        guard: actor.name == payload.actor and actor.awake and actor.share_offer is not None and actor.share_used_ref is None and actor.share_withdrawn_ref is None
        outputs:
          action: {ref: occurrence}
          last_action_ref: {ref: occurrence}
          share_withdrawn_ref: {ref: occurrence}
          drink_share_withdrawal:
            record:
              type: DrinkShareWithdrawal
              fields: {speaker: {ref: actor.name}, recipient: {ref: actor.share_offer.recipient}, site: {ref: actor.site}, offer: {ref: actor.share_offer.utterance}, utterance: {ref: occurrence}}
  - name: event.share_withdrawal_heard
    family: direct_actor_event
    formals: {}
    body:
      law:
        schema: c0.value.v1
        bindings: []
        guard: scene.drink_share_withdrawal is not None and scene.drink_share_withdrawal.utterance == trigger.occurrence and scene.drink_share_withdrawal.recipient == actor.name and scene.drink_share_withdrawal.site == actor.site and actor.awake and actor.attending
        outputs: {share_withdrawal: {ref: scene.drink_share_withdrawal}, share_withdrawal_hearing_ref: {ref: occurrence}}
  - name: action.guard_receive_share
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings: []
        guard:
          require:
            - identity: actor.name == payload.actor and actor.awake and giver.name == payload.giver and giver.awake
            - heard: actor.heard_share is not None and actor.share_hearing_ref is not None
            - addressed: actor.heard_share.recipient == actor.name and actor.heard_share.speaker == giver.name and actor.heard_share.container == payload.drink and actor.heard_share.utterance == payload.offer
            - unanswered: actor.share_decision is None or (actor.share_decision is not None and actor.share_decision.request != payload.offer)
            - actual_permission: giver.share_offer is not None and giver.share_offer.utterance == payload.offer and giver.share_offer.speaker == giver.name and giver.share_offer.recipient == actor.name and giver.share_offer.site == actor.heard_share.site and giver.share_offer.container == payload.drink and giver.share_offer.container_change_ref == actor.heard_share.container_change_ref and giver.share_used_ref is None and giver.share_withdrawn_ref is None
            - current: drink.holder == giver.name and drink.change_ref == actor.heard_share.container_change_ref
            - local: actor.site == giver.site and actor.site == actor.heard_share.site
            - stock: not drink.frozen and drink.portions > 0
        outputs:
          action: {ref: occurrence}
          last_action_ref: {ref: occurrence}
          new_holder: {ref: actor.name}
          transfer_ref: {ref: occurrence}
          giver_used_ref: {ref: occurrence}
          share_decision: {call: {ref: conversation.decision, args: {request: {ref: payload.offer}, accepted: true, action: {ref: occurrence}}}}
          share_receipt: {record: {type: DrinkShareReceipt, fields: {offer: {ref: payload.offer}, giver: {ref: giver.name}, container: {ref: payload.drink}, transfer: {ref: occurrence}}}}
  - name: action.guard_decline_share
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings: []
        guard: actor.name == payload.actor and actor.awake and actor.heard_share is not None and actor.share_hearing_ref is not None and (actor.share_decision is None or (actor.share_decision is not None and actor.share_decision.request != actor.heard_share.utterance))
        outputs:
          action: {ref: occurrence}
          last_action_ref: {ref: occurrence}
          share_decision: {call: {ref: conversation.decision, args: {request: {ref: actor.heard_share.utterance}, accepted: false, action: {ref: occurrence}}}}
  - name: action.finish_share
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings: []
        guard: actor.name == payload.actor and actor.awake and actor.guest_task is not None and actor.guest_task.invitation.messenger != actor.name and actor.share_offer is not None and actor.share_offer.container == actor.guest_task.container and actor.share_used_ref is not None
        outputs:
          action: {ref: occurrence}
          last_action_ref: {ref: occurrence}
          finished_guest_request: {ref: actor.guest_task.invitation.utterance}
          finished_guest_ref: {ref: occurrence}
          guest_task: null
  - name: action.bar_drink
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings: []
        guard:
          require:
            - identity: actor.name == payload.actor
            - awake: actor.awake
            - custody: drink.holder == actor.name
            - observed: actor.drink_sighting is not None and actor.drink_sighting.container == payload.drink
            - current: actor.drink_sighting.holder == actor.name and actor.drink_sighting.site == actor.site and actor.drink_sighting.change_ref == drink.change_ref
            - liquid: not actor.drink_sighting.frozen and not drink.frozen
            - stock: actor.drink_sighting.portions > 0 and drink.portions > 0
        outputs:
          action: {ref: occurrence}
          last_action_ref: {ref: occurrence}
          last_drink_ref: {ref: occurrence}
          portions_drunk: {add: [{ref: actor.portions_drunk}, 1]}
          drink_portions: {sub: [{ref: drink.portions}, 1]}
          drink_change_ref: {ref: occurrence}
          drink_consumption:
            record:
              type: DrinkConsumption
              fields: {consumer: {ref: actor.name}, site: {ref: actor.site}, container: {ref: payload.drink}, action: {ref: occurrence}}
          drink_sighting:
            record:
              type: DrinkSighting
              fields: {container: {ref: payload.drink}, holder: {ref: actor.name}, site: {ref: actor.site}, frozen: false, portions: {sub: [{ref: drink.portions}, 1]}, capacity: {ref: drink.capacity}, change_ref: {ref: occurrence}, observation: {ref: occurrence}}
  - name: event.bar_drink_seen
    family: direct_actor_event
    formals: {}
    body:
      law:
        schema: c0.value.v1
        bindings: []
        guard:
          all:
            - scene.drink_consumption is not None and scene.drink_consumption.action == trigger.occurrence
            - actor.site == scene.drink_consumption.site and actor.vital.life == 'alive' and actor.cold_state != 'frozen'
            - {exists: {collection: {ref: actor.known_bar_bears}, as: known, where: known.name == scene.drink_consumption.consumer and known.site == actor.site}}
        outputs:
          known_bar_bears:
            collect_matching:
              collection: {ref: actor.known_bar_bears}
              as: known
              where: true
              value:
                if:
                  when: known.name == scene.drink_consumption.consumer and known.site == actor.site
                  then:
                    record:
                      type: BarBearer
                      fields: {name: {ref: known.name}, site: {ref: known.site}, observation: {ref: occurrence}, last_drink_action: {ref: trigger.occurrence}}
                  else: {ref: known}
  - name: action.request_pour
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings: []
        guard:
          require:
            - identity: actor.name == payload.actor and bear_one.name == payload.bear_one and bear_two.name == payload.bear_two
            - awake: actor.vital.life == 'alive' and actor.cold_state != 'frozen'
            - separate_containers: payload.origin != payload.destination
            - held_resources: origin.holder == bear_one.name and destination.holder == bear_two.name
            - local: actor.site == bear_one.site and actor.site == bear_two.site
            - known_bears: {eq: [2, {count_matching: {collection: {ref: actor.known_bar_bears}, as: bear, where: bear.site == actor.site and (bear.name == bear_one.name or bear.name == bear_two.name)}}]}
            - observed_origin: actor.drink_sighting is not None and actor.drink_sighting.container == payload.origin
            - current_sighting: actor.drink_sighting.holder == origin.holder and actor.drink_sighting.site == actor.site and actor.drink_sighting.change_ref == origin.change_ref
            - thawed_origin: not actor.drink_sighting.frozen and not origin.frozen
        outputs:
          action: {ref: occurrence}
          last_action_ref: {ref: occurrence}
          bar_replies: {collect_matching: {collection: {ref: actor.bar_replies}, as: old, where: false, value: {ref: old}}}
          pending_pour_request: {ref: occurrence}
          drink_request:
            record:
              type: DrinkRequest
              fields: {speaker: {ref: actor.name}, site: {ref: actor.site}, origin: {ref: payload.origin}, destination: {ref: payload.destination}, utterance: {ref: occurrence}}
  - name: event.drink_request_heard
    family: direct_actor_event
    formals: {}
    body:
      law:
        schema: c0.value.v1
        bindings: []
        guard: scene.drink_request is not None and scene.drink_request.utterance == trigger.occurrence and actor.site == scene.drink_request.site and actor.awake and actor.attending
        outputs: {heard_request: {ref: scene.drink_request}, hearing_ref: {ref: occurrence}}
  - name: action.bar_reply
    family: action
    formals: {accept: bool}
    body:
      value:
        schema: c0.value.v1
        bindings: []
        guard:
          require:
            - identity: actor.name == payload.actor and actor.awake
            - heard: actor.heard_request is not None and actor.hearing_ref is not None
            - local: actor.site == actor.heard_request.site
            - not_answered: actor.reply_request != actor.heard_request.utterance
        outputs:
          action: {ref: occurrence}
          last_action_ref: {ref: occurrence}
          reply_request: {ref: actor.heard_request.utterance}
          reply_accept: {arg: accept}
          reply_action: {ref: occurrence}
          permission_used_ref: null
          drink_reply:
            record:
              type: DrinkReply
              fields: {speaker: {ref: actor.name}, recipient: {ref: actor.heard_request.speaker}, site: {ref: actor.site}, request: {ref: actor.heard_request.utterance}, origin: {ref: actor.heard_request.origin}, destination: {ref: actor.heard_request.destination}, accepted: {arg: accept}, utterance: {ref: occurrence}, hearing: null}
  - name: event.drink_reply_heard
    family: direct_actor_event
    formals: {}
    body:
      law:
        schema: c0.value.v1
        bindings: []
        guard: scene.drink_reply is not None and scene.drink_reply.utterance == trigger.occurrence and scene.drink_reply.recipient == actor.name and scene.drink_reply.site == actor.site and actor.pending_pour_request == scene.drink_reply.request and actor.vital.life == 'alive' and actor.cold_state != 'frozen'
        outputs:
          bar_replies:
            append:
              - {collect_matching: {collection: {ref: actor.bar_replies}, as: previous, where: previous.speaker != scene.drink_reply.speaker and previous.request == scene.drink_reply.request, value: {ref: previous}}}
              - record:
                  type: DrinkReply
                  fields: {speaker: {ref: scene.drink_reply.speaker}, recipient: {ref: scene.drink_reply.recipient}, site: {ref: scene.drink_reply.site}, request: {ref: scene.drink_reply.request}, origin: {ref: scene.drink_reply.origin}, destination: {ref: scene.drink_reply.destination}, accepted: {ref: scene.drink_reply.accepted}, utterance: {ref: scene.drink_reply.utterance}, hearing: {ref: occurrence}}
  - name: action.pour_drink
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings: []
        guard:
          require:
            - identity: actor.name == payload.actor and bear_one.name == payload.bear_one and bear_two.name == payload.bear_two
            - awake: actor.vital.life == 'alive' and actor.cold_state != 'frozen' and bear_one.awake and bear_two.awake
            - separate_containers: payload.origin != payload.destination
            - held_resources: origin.holder == bear_one.name and destination.holder == bear_two.name
            - local: actor.site == bear_one.site and actor.site == bear_two.site
            - requested: scene.drink_request is not None and scene.drink_request.speaker == actor.name and scene.drink_request.site == actor.site
            - current_local_request: actor.pending_pour_request == scene.drink_request.utterance
            - requested_pair: scene.drink_request.origin == payload.origin and scene.drink_request.destination == payload.destination
            - first_permission: bear_one.heard_request is not None and bear_one.heard_request.utterance == scene.drink_request.utterance and bear_one.reply_request == scene.drink_request.utterance and bear_one.reply_accept is not None and bear_one.reply_accept and bear_one.reply_action is not None and bear_one.permission_used_ref is None
            - second_permission: bear_two.heard_request is not None and bear_two.heard_request.utterance == scene.drink_request.utterance and bear_two.reply_request == scene.drink_request.utterance and bear_two.reply_accept is not None and bear_two.reply_accept and bear_two.reply_action is not None and bear_two.permission_used_ref is None
            - heard_permissions: {eq: [2, {count_matching: {collection: {ref: actor.bar_replies}, as: reply, where: reply.request == scene.drink_request.utterance and reply.origin == payload.origin and reply.destination == payload.destination and reply.recipient == actor.name and reply.site == actor.site and reply.accepted and reply.hearing is not None and ((reply.speaker == bear_one.name and reply.utterance == bear_one.reply_action) or (reply.speaker == bear_two.name and reply.utterance == bear_two.reply_action))}}]}
            - liquid: not origin.frozen and not destination.frozen
            - stock: origin.portions > 0
            - space: destination.portions < destination.capacity
        outputs:
          action: {ref: occurrence}
          last_action_ref: {ref: occurrence}
          pending_pour_request: null
          drink_sighting:
            record:
              type: DrinkSighting
              fields: {container: {ref: payload.origin}, holder: {ref: origin.holder}, site: {ref: actor.site}, frozen: false, portions: {sub: [{ref: origin.portions}, 1]}, capacity: {ref: origin.capacity}, change_ref: {ref: occurrence}, observation: {ref: occurrence}}
          origin_portions: {sub: [{ref: origin.portions}, 1]}
          destination_portions: {add: [{ref: destination.portions}, 1]}
          origin_change_ref: {ref: occurrence}
          destination_change_ref: {ref: occurrence}
          first_permission_used: {ref: occurrence}
          second_permission_used: {ref: occurrence}
  - name: action.observe_bar
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings:
          - {name: previous_one, collection: actor.known_bar_bears, as: remembered, where: remembered.name == bear_one.name, required: false}
          - {name: previous_two, collection: actor.known_bar_bears, as: remembered, where: remembered.name == bear_two.name, required: false}
        guard: actor.name == payload.actor and actor.site == 'icebar_entry' and actor.vital.life == 'alive' and actor.cold_state != 'frozen'
        outputs:
          action: {ref: occurrence}
          last_action_ref: {ref: occurrence}
          known_bar_bears:
            collect_matching:
              collection:
                append:
                  - append:
                      - {collect_matching: {collection: {ref: actor.known_bar_bears}, as: previous, where: false, value: {ref: previous}}}
                      - record:
                          type: BarBearer
                          fields: {name: {ref: bear_one.name}, site: {ref: bear_one.site}, observation: {ref: occurrence}, last_drink_action: {if: {when: previous_one is not None, then: {ref: previous_one.last_drink_action}, else: null}}}
                  - record:
                      type: BarBearer
                      fields: {name: {ref: bear_two.name}, site: {ref: bear_two.site}, observation: {ref: occurrence}, last_drink_action: {if: {when: previous_two is not None, then: {ref: previous_two.last_drink_action}, else: null}}}
              as: nearby
              where: nearby.site == actor.site
              value: {ref: nearby}
  - name: action.observe_drink
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings: []
        guard:
          require:
            - identity: actor.name == payload.actor and holder.name == payload.holder
            - awake: actor.vital.life == 'alive' and actor.cold_state != 'frozen'
            - local: holder.site == actor.site and drink.holder == holder.name
            - known_holder: {exists: {collection: {ref: actor.known_bar_bears}, as: bear, where: bear.name == holder.name and bear.site == actor.site}}
        outputs:
          action: {ref: occurrence}
          last_action_ref: {ref: occurrence}
          drink_sighting:
            record:
              type: DrinkSighting
              fields: {container: {ref: payload.drink}, holder: {ref: holder.name}, site: {ref: holder.site}, frozen: {ref: drink.frozen}, portions: {ref: drink.portions}, capacity: {ref: drink.capacity}, change_ref: {ref: drink.change_ref}, observation: {ref: occurrence}}
  - name: action.bar_wait
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings: []
        guard: actor.name == payload.actor
        outputs: {action: {ref: occurrence}, last_action_ref: {ref: occurrence}}
