# Adapted from Thawed Through the Everflame (CC BY-SA 4.0).
opening_constructions:
  - kind: magic_item
    using: prepare_magic_item
    seed: magic_items
    bindings:
      - {name: choice, draw: {const: 4}}
      - name: form
        value:
          if:
            when: {eq: [{ref: choice}, {const: 1}]}
            then: {const: firelock}
            else:
              if:
                when: {eq: [{ref: choice}, {const: 2}]}
                then: {const: focusing_mirror}
                else:
                  if:
                    when: {eq: [{ref: choice}, {const: 3}]}
                    then: {const: branding_iron}
                    else: {const: skyhook}
    outputs:
      form: {ref: form}
      label:
        if:
          when: {eq: [{ref: choice}, {const: 1}]}
          then: {const: Firelock}
          else:
            if:
              when: {eq: [{ref: choice}, {const: 2}]}
              then: {const: Focusing mirror}
              else:
                if:
                  when: {eq: [{ref: choice}, {const: 3}]}
                  then: {const: Branding iron}
                  else: {const: Skyhook}
