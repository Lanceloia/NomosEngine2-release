    entries: {wait: guard_wait, observe_visitor: guard_observe_visitor, inspect_drink: guard_inspect_drink, accept: guard_accept_invitation, refuse: guard_decline_invitation, observe_routes: guard_observe_routes, move: guard_move, cross_ice: guard_cross_ice, pass_door: guard_pass_door, arrive_bar: guard_arrive_bar, return_post: guard_return_post, finish_visit: guard_finish_visit, receive_share: guard_receive_share, decline_share: guard_decline_share, inspect_held_drink: guard_inspect_held_drink, drink: guard_drink}
  - name: toward_exit_wall_resident
    seat: wall_resident
    fallback_entry: wait_wall_resident
    tie_order:
    - wait_wall_resident
    - observe_wall_wall_resident
    - move_wall_wall_resident
    - move_wall_resident
    - cross_ice_wall_resident
    - accept_torch_wall_resident
    - observe_person_wall_resident
    - thaw_person_wall_resident
    - bridge_slow_wall_resident
    - care_person_wall_resident
    - carry_move_wall_resident
    - carry_cross_ice_wall_resident
    - carry_bridge_slow_wall_resident
    - carry_pass_door_wall_resident
    - strike_person_wall_resident
    - bridge_rush_wall_resident
    - inspect_patient_wall_resident
    rules:
    - entry: care_person_wall_resident
      mode: score
      value: 10
    - entry: bridge_slow_wall_resident
      mode: score
      value:
        if:
          when:
            all:
            - not_none:
                ref: actor.escort_heard_ref
            - exactly_one:
                collection:
                  ref: actor.known_exit_steps
                as: step
                where:
                  all:
                  - step.start == actor.site
                  - step.end == payload.destination
          then: 3
          else: 0
    - entry: wait_wall_resident
      mode: default
    - entry: accept_torch_wall_resident
      mode: ignore
    - entry: observe_person_wall_resident
      mode: ignore
    - entry: thaw_person_wall_resident
      mode: ignore
    - entry: observe_wall_wall_resident
      mode: score
      value:
        if:
          when:
            not_none:
              ref: actor.escort_heard_ref
          then:
            const: 4
          else:
            const: 0
    - entry: move_wall_wall_resident
      mode: score
      value:
        if:
          when:
            all:
            - not_none:
                ref: actor.escort_heard_ref
            - eq:
              - ref: payload.destination
              - const: treasure_approach
          then:
            const: 3
          else:
            const: 0
    - entry: move_wall_resident
      mode: score
      value:
        if:
          when:
            all:
            - not_none:
                ref: actor.escort_heard_ref
            - exactly_one:
                collection:
                  ref: actor.known_exit_steps
                as: step
                where:
                  all:
                  - step.start == actor.site
                  - step.end == payload.destination
          then: 3
          else: 0
    - entry: cross_ice_wall_resident
      mode: score
      value:
        if:
          when:
            all:
            - not_none:
                ref: actor.escort_heard_ref
            - exactly_one:
                collection:
                  ref: actor.known_exit_steps
                as: step
                where:
                  all:
                  - step.start == actor.site
                  - exists:
                      collection:
                        ref: actor.known_crossings
                      as: crossing
                      where:
                        all:
                        - crossing.key == payload.crossing
                        - crossing.start == step.start
                        - crossing.intended == step.end
          then: 3
          else: 0
    - entry: carry_move_wall_resident
      mode: ignore
    - entry: carry_cross_ice_wall_resident
      mode: ignore
    - entry: carry_bridge_slow_wall_resident
      mode: ignore
    - entry: carry_pass_door_wall_resident
      mode: ignore
    - entry: strike_person_wall_resident
      mode: ignore
    - entry: bridge_rush_wall_resident
      mode: ignore
    - entry: inspect_patient_wall_resident
      mode: ignore
  - name: rescue_adventurer_ritual_resident
    seat: ritual_resident
    fallback_entry: wait_ritual_resident
    tie_order:
    - wait_ritual_resident
    - thaw_person_ritual_resident
    - observe_person_ritual_resident
    - accept_torch_ritual_resident
    - move_ritual_resident
    - cross_ice_ritual_resident
    - bridge_slow_ritual_resident
    - care_person_ritual_resident
    - carry_move_ritual_resident
    - carry_cross_ice_ritual_resident
    - carry_bridge_slow_ritual_resident
    - carry_pass_door_ritual_resident
    - strike_person_ritual_resident
    - bridge_rush_ritual_resident
    - inspect_patient_ritual_resident
    rules:
    - entry: care_person_ritual_resident
      mode: score
      value: 10
    - entry: bridge_slow_ritual_resident
      mode: ignore
    - entry: accept_torch_ritual_resident
      mode: score
      value:
        const: 8
    - entry: observe_person_ritual_resident
      mode: score
      value:
        const: 7
    - entry: thaw_person_ritual_resident
      mode: score
      value:
        const: 9
    - entry: move_ritual_resident
      mode: score
      value:
        if:
          when:
            all:
            - not_none:
                ref: actor.heard_torch_offer
            - not_none:
                ref: actor.torch_accept_ref
            - eq:
              - ref: payload.destination
              - ref: actor.heard_torch_offer.destination
          then:
            const: 5
          else:
            const: 0
    - entry: cross_ice_ritual_resident
      mode: score
      value:
        if:
          when:
            all:
            - not_none:
                ref: actor.heard_torch_offer
            - not_none:
                ref: actor.torch_accept_ref
            - exactly_one:
                collection:
                  ref: actor.known_crossings
                as: crossing
                where:
                  all:
                  - eq:
                    - ref: crossing.key
                    - ref: payload.crossing
                  - eq:
                    - ref: crossing.intended
                    - ref: actor.heard_torch_offer.destination
          then:
            const: 5
          else:
            const: 0
    - entry: wait_ritual_resident
      mode: default
    - entry: carry_move_ritual_resident
      mode: ignore
    - entry: carry_cross_ice_ritual_resident
      mode: ignore
    - entry: carry_bridge_slow_ritual_resident
      mode: ignore
    - entry: carry_pass_door_ritual_resident
      mode: ignore
    - entry: strike_person_ritual_resident
      mode: ignore
    - entry: bridge_rush_ritual_resident
      mode: ignore
    - entry: inspect_patient_ritual_resident
      mode: ignore
