        adventurer.conversations.prison.questions: Questions I actually asked
        adventurer.conversations.prison.answers: Prison replies I actually heard (claims, not certified truth)
        adventurer.conversations.prison.charge_receipt: Original charge I actually received
        adventurer.conversations.prison.charge_receipt.packet: Identity of the received original charge
        adventurer.conversations.prison.charge_load_ref: My actual charge loading action
        adventurer.prison_access.line: null
        adventurer.prison_access.bars: null
        adventurer.prison_access.bars.individual: Observed cell bars
        adventurer.prison_access.bars.label: Cell bars observed
        adventurer.prison_access.bars.site: Cell observation position
        adventurer.prison_access.bars.outside: Outside of the cell
