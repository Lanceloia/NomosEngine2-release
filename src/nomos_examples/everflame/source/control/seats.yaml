    presentation:
      title: Thawed Through the Everflame
      opening: Interrupt the ritual, give residents a chance to leave, and reach the outside shore.
        Actions advance cold and rituals. Spending light can shrink protection; people can freeze
        again outside its reach. Inspect icy routes. Thawing is not rescue; invite residents and
        observe them again when you meet. They choose for themselves. Leaving ends your journey,
        not everyone else's danger.
      terms:
        palace_exit: Outside shore beyond the bridge
        halls_ballroom_door: Halls beside the ballroom
        halls_bridge_door: Halls beside the bridge stair
        halls_collision_wall: Halls wall (collision point)
        bridge_palace_landing: Palace bridgehead above the abyss
        bridge_midspan: Narrow bridge above the abyss
        ballroom_icebar_door: Ballroom ice-bar door
        icebar_entry: Ice bar
        ritual_lower_door: Ritual lower stair
        lower_corridor_entry: Lower passage
        lower_corridor_wall: Lower passage wall (collision point)
        stables_approach: Before the frozen stable door
        stables_entry: Beyond the frozen stable door
        stables_collision_wall: Stable wall after a slide
        prison_outer: Outside the prison guard line
        prison_holding: Prison holding area
        prison_deep: Deeper in the prison
        captive_cell: Inside the barred cell
        ballroom_entrance: Ballroom entrance
        ritual_passage_entry: Ritual passage
        ritual_threshold: Ritual threshold
        ritual_ring: Ritual circle
        ballroom_chandelier_reach: Beneath the chandelier
        ballroom_opposite_wall: Ballroom far wall (collision point)
        ballroom_chandelier_far_wall: Wall beyond the chandelier (collision point)
        ballroom_bar_side_wall: Ice-bar-side wall (collision point)
        ritual_side_wall: Ritual passage wall (collision point)
        protected: Within the Everflame's reach
        exposed: Exposed to the cold
        unknown: Unknown from my available knowledge; not a safety verdict
        unavailable: No charge to spend
        mobile: Able to move
        immune: Unaffected by palace cold
        frozen: Frozen
        gathering: A chant is gathering toward completion
        critical: The chant is near completion; delay risks losing the resident
        disrupted: The chant was interrupted here
        erupted: The ritual has completed here
        alive: Alive
        dead: Dead
        incapacitated: Unable to act; needs care
        ritual_resident: Resident at the ritual
        wall_resident: Resident trapped in ice
        hall_bokold_one: First person in the hall
        hall_bokold_two: Second person in the hall
        hall_bokold_three: Third person in the hall
        hall_bokold_four: Fourth person in the hall
        hall_bokold_five: Fifth person in the hall
        huddled_one: First resident by the chandelier
        huddled_two: Second resident by the chandelier
        treasure_approach: Treasure corridor
        treasure_release: Release side of the ice wall
        treasure_side: Beyond the treasure wall
        treasure_ice: Inside the ice wall
        endless_abyss: Abyss below the palace bridge
      # Structured projection is consumed by the player bridge, not dumped by CLI.
      projection_columns: {}
      projection_focus: {}
      preview_fields:
        cross_ice_adventurer:
          self_if_success: My protection if this crossing succeeds
        move_adventurer:
          self_after_move: My protection if this passage succeeds
        thaw_ritual_resident:
          status: Protection at the known target area now
          after_spend_one: Protection there after spending one charge, using known coverage
      finish_on_action:
        bridge_rush_adventurer:
          outcome: adventurer_dead
          text: Your bridge attempt ends with your life lost. The location and life shown above are
            your final state. Earlier resident observations are memories, not proof of their present safety.
        leave_palace_adventurer:
          outcome: departed_palace
          text: You have left the frozen palace. This journey ends here. The records above preserve
            people you actually encountered; they are not updates on unseen people or proof of
            their current safety. Leaving does not establish the fate of anyone still inside.
      finish_fields:
        leave_palace_adventurer:
        - adventurer.person_sighting.subject
        - adventurer.person_sighting.site
        - adventurer.person_sighting.life
        - adventurer.person_sighting.cold_state
      published_fields:
        cross_ice_adventurer: [adventurer.site, adventurer.last_cross_roll]
        carry_from_ritual_adventurer: [adventurer.site, adventurer.ritual_notice]
        thaw_ritual_resident: [adventurer.last_thawed, adventurer.known_everflame_charges, adventurer.ritual_notice]
        observe_floor_adventurer: [adventurer.floor_sighting.site, adventurer.floor_sighting.frozen]
        observe_resident_adventurer: [adventurer.person_sighting.subject, adventurer.person_sighting.site, adventurer.person_sighting.life, adventurer.person_sighting.cold_state]
        inspect_patient_adventurer: [adventurer.person_sighting.subject, adventurer.person_sighting.site, adventurer.person_sighting.life, adventurer.person_sighting.cold_state]
        bridge_slow_adventurer: [adventurer.site]
        bridge_rush_adventurer: [adventurer.site, adventurer.last_cross_roll, adventurer.vital.life]
        thaw_person_adventurer: [adventurer.last_thawed, adventurer.known_everflame_charges]
        detach_reservoir_adventurer: [adventurer.known_reservoir_charges]
        reload_everflame_adventurer: [adventurer.known_everflame_charges, adventurer.known_reservoir_charges]
        wait_adventurer: [adventurer.cold_state, adventurer.current_movement_speed, adventurer.vital.life]
        leave_palace_adventurer: [adventurer.site, adventurer.vital.life]
      published_actions:
        bridge_slow_adventurer: You carefully crossed this bridge segment without a balance roll.
          Time still passes; cold can still affect people outside the light.
        bridge_rush_adventurer: Your risky bridge attempt resolved. Below are your actual landing
          place, balance roll and life. This choice costs as much as careful crossing.
        detach_reservoir_adventurer: You detached and took the reservoir. Its charge is now carried
          separately; taking it does not yet refill the Everflame.
        reload_everflame_adventurer: You transferred one charge from the carried reservoir into
          the Everflame. The remaining charges below are your records of this transfer.
        leave_palace_adventurer: You left from the outside shore. Your journey is over;
          this action does not certify what happened to people you cannot see.
        carry_from_ritual_adventurer: You carried the frozen resident away from the ritual and interrupted it.
          Carrying is not thawing or rescuing; check the local record below and observe the resident nearby.
        offer_escort_adventurer: You called an invitation to leave. No acceptance is implied; residents decide
          for themselves. Observe them again when you meet.
        cross_ice_adventurer: The location below is your actual landing, not a promise of reaching
          the selected destination. A wall collision point means you stopped short; inspect the
          floor or find a recovery route. A retained balance roll is not a new roll on every movement.
        offer_torch_adventurer: You offered the carried Everflame and named the threshold.
          This utterance is not a handover or a promise of acceptance; the resident decides what to do.
        wait_adventurer: You waited. Check the control time and your current condition below; this does not
          report what happened to people elsewhere.
        observe_resident_adventurer: You observed the nearby resident. Their life, condition and location below
          record this encounter, not a remote update.
        observe_routes_adventurer: You looked for routes from here. Check the current choices below;
          knowing a passage does not guarantee that it is now passable.
        observe_hall_adventurer: You looked for people in this hall. Check the current choices;
          finding someone does not establish their private wishes or promise help.
        observe_floor_adventurer: You inspected the reachable floor. The ice observation below describes
          this encounter; a later change can make a passage unsafe again.
        observe_wall_adventurer: You inspected the reachable ice wall. Check the choices below;
          opening it spends one charge, while passing through is a separate action.
        open_wall_adventurer: You spent one charge opening the ice wall. Check the remaining Everflame
          charge and current light coverage; opening a wall is not a rescue.
        open_plain_wall_adventurer: You spent one charge opening the ice wall. Check the remaining
          light before deciding whether to continue or replenish it.
        ask_prison_adventurer: You asked your question. Only replies recorded as actually heard below
          establish that you received an answer; asking alone does not promise one.
        thaw_person_adventurer: You spent one charge thawing the person. This is not yet a rescue;
          invite them and observe them again when you meet on the way out. Protection forecasts use
          your available knowledge; unknown does not mean safe or unsafe.
        thaw_ritual_resident: You spent one charge thawing the person at the ritual and interrupted
          the chant. They still have to leave by their own actions; meet and observe them again.
      rejected_actions:
        bridge_slow_adventurer: This crossing did not happen. Careful crossing still cannot pass a
          frozen bridge segment. Inspect reachable ground and your condition; these are possible
          limits, not a report of a hidden cause.
        bridge_rush_adventurer: This attempt could not start. Check reachable ground and your
          condition. Refusal is not a failed balance roll or a fall.
        inspect_patient_adventurer: This inspection did not happen. The menu uses a past sighting;
          it does not prove that the person is still here or reachable. Check your current nearby
          observation choices or continue along a known route. No new observation was acquired.
        thaw_ritual_resident: This thaw did not happen. Check your charge and seek a fresh nearby
          observation before trying again; the person may no longer be reachable or eligible.
          These are possible limits, not a report of their hidden current state.
        move_adventurer: This direct passage attempt did not happen. Ice, a blocked stair or your
          current condition can prevent it; inspect the reachable floor and check other choices.
          This is a list of possible limits, not a report of a hidden cause.
        cross_ice_adventurer: This crossing could not start. Check your current position, condition
          and reachable crossing choices. Refusal is not a failed balance roll or a collision.
        thaw_person_adventurer: This thaw did not happen. Check your current charge and observe the
          person again when actually nearby; a past sighting does not establish current eligibility.
      fields:
        adventurer.conversations.tower: My actual tower question and conditional offer heard (not delivered)
        adventurer.conversations.tower.offer: The conditional offer I actually heard
        adventurer.conversations.tower.offer.site: Where the offer was spoken
        adventurer.conversations.tower.offer.utterance: The offer utterance source
        adventurer.conversations.tower.hearing: My hearing source
        adventurer.conversations.tower.acceptance: My acceptance utterance (not proof Alpha heard or fulfilled)
        adventurer.conversations.tower.acceptance.offer: null
