# Adapted from Thawed Through the Everflame (CC BY-SA 4.0).
seats:
  - name: emma
    actor: emma
    entries:
    - queen_verify_survivors_emma
    - queen_pay_reward_emma
    - queen_wait_emma
    - balloon_control_emma
    - queen_observe_routes_emma
    - queen_move_emma
    - queen_cross_ice_emma
    - queen_bridge_slow_emma
    - queen_pass_door_emma
    read:
    - emma.reward_account
    - emma.reward_account.verified
    - emma.guide_consumption
    - emma.guide_consumption.step
    - emma.guide_consumption.action
    - emma.guide_consumption.settlement
    - emma.guide_step
    - emma.guide_step.motion
    - emma.guide_step.motion.start
    - emma.guide_step.motion.end
    - emma.guide_step.motion.name
    - emma.guide_step.motion.action
    - emma.guide_step.observation
    - emma.guide_step.invitation
    - emma.guide_step.hearing
    - emma.route_observation
    - emma.route_observation.site
    - emma.route_observation.action
    - emma.name
    - emma.attending
    - emma.heard_balloon_explanation
    - emma.heard_balloon_explanation.speech
    - emma.heard_balloon_explanation.speech.site
    - emma.heard_balloon_explanation.speech.balloon
    - emma.heard_balloon_explanation.speech.destination
    - emma.heard_balloon_explanation.speech.utterance
    - emma.heard_balloon_explanation.hearing
    - emma.site
    - emma.cold_state
    - emma.vital.life
    - emma.current_movement_speed
    - emma.last_action_ref
    - emma.known_sites
    - emma.known_paths
    - emma.known_crossings
    - emma.known_bridge_paths
    - emma.balance_bonus
    - emma.last_cross_roll
    - emma.last_cross_ref
    - emma.rescue_state
    - emma.rescue_ref
    - emma.escort_heard_ref
    - emma.escort_utterance_ref
    - emma.escort_speaker
    - emma.escort_destination
    - emma.max_movement_speed
    offers:
    - entry: queen_verify_survivors_emma
      fixed_participants: true
      label: Verify newly arrived survivors at the palace exit
      when:
        all:
          - {eq: [{ref: actor.site}, {const: palace_exit}]}
          - {eq: [{ref: actor.rescue_state}, {const: safe}]}
          - {eq: [{ref: actor.vital.life}, {const: alive}]}
          - {not: {eq: [{ref: actor.cold_state}, {const: frozen}]}}
      availability:
        ref: queen_new_survivors
        when:
          any_participant:
            group: reward_survivors
            as: survivor
            where:
              call:
                ref: reward.new_survivor
                args:
                  known: {ref: actor.reward_account.verified}
                  observer_site: {ref: actor.site}
                  name: {ref: survivor.name}
                  site: {ref: survivor.site}
                  life: {ref: survivor.vital.life}
                  rescue: {ref: survivor.rescue_state}
                  has_rescue: {not_none: {ref: survivor.rescue_ref}}
      payload: {}
    - entry: queen_pay_reward_emma
      for_each_participants:
        ritual: {fixed_actor: ritual_resident, private: true}
        first: {fixed_actor: huddled_one, private: true}
        second: {fixed_actor: huddled_two, private: true}
        wall: {fixed_actor: wall_resident, private: true}
        prison_one: {fixed_actor: prison_resident_one, private: true}
        prison_two: {fixed_actor: prison_resident_two, private: true}
        recipient: {fixed_actor: adventurer, private: true}
        box: {kind: reward_box, read: [box.holder]}
      label: [{const: 'Pay the verified survivors reward (200 gold each)'}]
      visible_when: box.holder == actor.name
      availability:
        ref: queen_unpaid_survivors
        when:
          all:
            - {eq: [{ref: recipient.site}, {ref: actor.site}]}
            - {eq: [{ref: recipient.vital.life}, {const: alive}]}
            - {not: {eq: [{ref: recipient.cold_state}, {const: frozen}]}}
            - {ref: box.locked}
            - any_participant:
                group: reward_survivors
                as: survivor
                where:
                  call:
                    ref: reward.unpaid_survivor
                    args:
                      known: {ref: actor.reward_account.verified}
                      observer_site: {ref: actor.site}
                      name: {ref: survivor.name}
                      site: {ref: survivor.site}
                      life: {ref: survivor.vital.life}
                      rescue: {ref: survivor.rescue_state}
                      has_rescue: {not_none: {ref: survivor.rescue_ref}}
      when:
        all:
          - {eq: [{ref: actor.site}, {const: palace_exit}]}
          - {eq: [{ref: actor.rescue_state}, {const: safe}]}
          - {eq: [{ref: actor.vital.life}, {const: alive}]}
          - {not: {eq: [{ref: actor.cold_state}, {const: frozen}]}}
          - exists: {collection: {ref: actor.reward_account.verified}, as: person, where: {is_none: {ref: person.payment}}}
      payload: {box: {ref: box_ref}}
    - entry: balloon_control_emma
      label:
      - const: Board the balloon basket
      when: actor.cold_state != 'frozen' and actor.current_movement_speed > 0 and actor.vital.life == 'alive'
      for_each_participants: &balloon_control_participants
        balloon:
          kind: balloon
          read:
          - balloon.site
        bear_one:
          fixed_actor: tower_bear_one
          private: true
        bear_two:
          fixed_actor: tower_bear_two
          private: true
      visible_when: actor.site == balloon.site
      availability:
        ref: queen_balloon_control
        when:
          all:
          - balloon.inflated
          - none_matching:
              collection:
                ref: scene.balloon_seats
              as: seat
              where: seat.passenger == actor.name
          - lt:
            - count_matching:
                collection:
                  ref: scene.balloon_seats
                as: seat
                where: true
            - 2
      payload:
        balloon:
          ref: balloon_ref
        operation:
          const: board
    - entry: balloon_control_emma
      label:
      - const: Leave the balloon basket
      when: actor.cold_state != 'frozen' and actor.current_movement_speed > 0 and actor.vital.life == 'alive'
      for_each_participants: *balloon_control_participants
      visible_when: actor.site == balloon.site
      availability:
        ref: queen_balloon_control
        when:
          exactly_one:
            collection:
              ref: scene.balloon_seats
            as: seat
            where: seat.passenger == actor.name and seat.vehicle == payload.balloon
      payload:
        balloon:
          ref: balloon_ref
        operation:
          const: leave
    - entry: queen_wait_emma
      label: Wait locally
      when:
        const: true
      payload: {}
    - entry: queen_observe_routes_emma
      label: Look for routes from here
      when: &queen_active
        all:
        - {eq: [{ref: actor.vital.life}, {const: alive}]}
        - {not: {eq: [{ref: actor.cold_state}, {const: frozen}]}}
        - {lt: [{const: 0}, {ref: actor.current_movement_speed}]}
      payload: {}
    - entry: queen_move_emma
      for_each:
        collection:
          ref: actor.known_paths
        as: path
      label:
        prefix: 'Move to '
        value:
          ref: path.end
      when:
        all:
        - *queen_active
        - {eq: [{ref: path.start}, {ref: actor.site}]}
      availability:
        ref: queen_local_ground
        when:
          all:
          - &queen_unboarded {call: {ref: transport.unboarded, args: {seats: {ref: scene.balloon_seats}, person: {ref: actor.name}}}}
          - call:
              ref: movement.ordinary_floor_passable
              args: {floors: {ref: scene.floors}, stairs: {ref: scene.stair_paths}, unclimbable_stairs: {ref: scene.unclimbable_stairs}, start: {ref: actor.site}, destination: {ref: payload.destination}}
      payload:
        destination:
          ref: path.end
        base_move_cost:
          ref: path.base_move_cost
    - entry: queen_cross_ice_emma
      for_each:
        collection:
          ref: actor.known_crossings
        as: crossing
      label:
        prefix: 'Cross ice toward '
        value:
          ref: crossing.intended
      when:
        all:
        - *queen_active
        - {eq: [{ref: crossing.start}, {ref: actor.site}]}
      availability: {ref: queen_cross_unboarded, when: *queen_unboarded}
      payload:
        crossing:
          ref: crossing.key
        base_move_cost:
          ref: crossing.base_move_cost
    - entry: queen_bridge_slow_emma
      for_each:
        collection:
          ref: actor.known_bridge_paths
        as: path
      label:
        prefix: 'Slowly cross the narrow bridge toward '
        value:
          ref: path.end
      when:
        all:
        - *queen_active
        - {eq: [{ref: path.start}, {ref: actor.site}]}
      availability:
        ref: queen_bridge_ground
        when:
          all:
          - *queen_unboarded
          - none_matching:
              collection: {ref: scene.floors}
              as: floor
              where:
                all:
                - {ref: floor.frozen}
                - exists:
                    collection: {ref: floor.sites}
                    as: site
                    where:
                      any:
                      - {eq: [{ref: site}, {ref: actor.site}]}
                      - {eq: [{ref: site}, {ref: payload.destination}]}
      payload:
        destination:
          ref: path.end
        base_move_cost:
          ref: path.base_move_cost
    - entry: queen_pass_door_emma
      availability: {ref: queen_door_unboarded, when: *queen_unboarded}
      for_each_participants:
        door:
          kind: passage_door
          read:
          - door.front
          - door.back
          - door.frozen
          - door.opened
          - door.base_move_cost
      label:
      - const: Pass through the stable doorway
      visible_when:
        any:
        - eq:
          - ref: actor.site
          - ref: door.front
        - eq:
          - ref: actor.site
          - ref: door.back
      when:
        all:
        - eq:
          - ref: actor.vital.life
          - const: alive
        - not:
            eq:
            - ref: actor.cold_state
            - const: frozen
        - ref: door.opened
        - not:
            ref: door.frozen
        - lt:
          - const: 0
          - ref: actor.current_movement_speed
      payload:
        door:
          ref: door_ref
        destination:
          if:
            when:
              eq:
              - ref: actor.site
              - ref: door.front
            then:
              ref: door.back
            else:
              ref: door.front
        base_move_cost:
          ref: door.base_move_cost
  - name: alpha
    actor: alpha
    entries: [tower_watch_alpha, propose_alpha, clear_balloon_alpha, deliver_alpha, withdraw_alpha, show_magic_alpha, withdraw_magic_alpha]
    read: [alpha.name, alpha.site, alpha.awake, alpha.vital.life, alpha.current_movement_speed, alpha.last_action_ref, alpha.heard_tower_request, alpha.heard_tower_request.speaker, alpha.heard_tower_request.recipient, alpha.heard_tower_request.site, alpha.heard_tower_request.utterance, alpha.tower_hearing_ref, alpha.tower_proposal, alpha.tower_proposal.request, alpha.tower_proposal.utterance, alpha.tower_proposal.item, alpha.heard_tower_acceptance, alpha.heard_tower_acceptance.offer, alpha.heard_tower_acceptance.site, alpha.acceptance_hearing_ref, alpha.clearance, alpha.heard_exit_report, alpha.heard_exit_report.offer, alpha.heard_exit_report.speaker, alpha.heard_exit_report.sighting, alpha.exit_report_hearing_ref, alpha.trade_decision]
    offers:
    - entry: show_magic_alpha
      for_each_participants: {item: {kind: magic_item, read: [item.holder]}}
      label: [{const: Voluntarily display my original magic item for research}]
      visible_when: item.holder == actor.name
      when: actor.awake and actor.vital.life == 'alive'
      availability: {ref: magic_alpha_show_window, when: "scene.magic_research is not None and scene.magic_research.selected is not None and scene.magic_research.selected.individual == payload.item and (scene.magic_display is None or (scene.magic_display is not None and scene.magic_display.window != scene.magic_research.basis))"}
      payload: {item: {ref: item_ref}, holder: {ref: actor.name}}
    - entry: withdraw_magic_alpha
      label: Withdraw my magic display
      when: {not_none: {ref: actor.last_action_ref}}
      availability: {ref: magic_alpha_withdraw_current, when: "scene.magic_display is not None and scene.magic_display.holder == actor.name"}
      payload: {}
    - entry: deliver_alpha
      for_each_participants: &alpha_trade_roles
        item: {kind: magic_item, read: [item.holder, item.label]}
        recipient: {fixed_actor: adventurer, private: true}
      label: [{const: 'Deliver the quoted original: '}, {ref: item.label}]
      visible_when: "actor.tower_proposal is not None and item_ref == actor.tower_proposal.item"
      when: &alpha_trade_undecided "actor.awake and actor.vital.life == 'alive' and actor.heard_exit_report is not None and actor.exit_report_hearing_ref is not None and actor.trade_decision is None"
      availability:
        ref: alpha_trade_recipient_here
        when: "actor.site == recipient.site and recipient.vital.life == 'alive' and recipient.cold_state != 'frozen' and item.holder == actor.name"
      payload: {item: {ref: item_ref}}
    - entry: withdraw_alpha
      for_each_participants: *alpha_trade_roles
      label: [{const: Withdraw the quoted trade without delivering the item}]
      visible_when: "actor.tower_proposal is not None and item_ref == actor.tower_proposal.item"
      when: *alpha_trade_undecided
      availability:
        ref: alpha_trade_recipient_here
        when: "actor.site == recipient.site and recipient.vital.life == 'alive' and recipient.cold_state != 'frozen'"
      payload: {item: {ref: item_ref}}
    - {entry: tower_watch_alpha, label: Guard the tower locally, when: {all: [{ref: actor.awake}, {eq: [{ref: actor.site}, {const: tower_base}]}]}, payload: {}}
    - {entry: clear_balloon_alpha, label: Tell the guards to clear the balloon operating position, when: {all: [{ref: actor.awake}, {eq: [{ref: actor.vital.life}, {const: alive}]}, {not_none: {ref: actor.heard_tower_acceptance}}, {not_none: {ref: actor.acceptance_hearing_ref}}, {not_none: {ref: actor.tower_proposal}}, {eq: [{ref: actor.heard_tower_acceptance.offer}, {ref: actor.tower_proposal.utterance}]}, {eq: [{ref: actor.heard_tower_acceptance.site}, {ref: actor.site}]}, {is_none: {ref: actor.clearance}}]}, payload: {}}
    - entry: propose_alpha
      for_each_participants: {item: {kind: magic_item, read: [item.holder, item.label]}, recipient: {fixed_actor: adventurer}}
      label: [{const: 'Offer '}, {ref: item.label}, {const: ' if Emma leaves alive (not a delivery)'}]
      visible_when: item.holder == actor.name
      when: actor.awake and actor.vital.life == 'alive' and actor.heard_tower_request is not None and actor.tower_hearing_ref is not None and actor.site == actor.heard_tower_request.site and (actor.tower_proposal is None or (actor.tower_proposal is not None and actor.tower_proposal.request != actor.heard_tower_request.utterance))
      payload: {item: {ref: item_ref}, recipient: {const: adventurer}}
      availability: {ref: alpha_recipient_here, when: "actor.site == recipient.site"}
  - seat_family: tower_guards
    names: {tower_bear_one: tower_bear_one, tower_bear_two: tower_bear_two}
    entries: [tower_watch, step_aside]
    read: [actor.name, actor.site, actor.awake, actor.vital.life, actor.current_movement_speed, actor.last_action_ref,
      actor.occupancy, actor.heard_clearance, actor.heard_clearance.site, actor.clearance_hearing_ref]
    offers:
    - label: Guard the tower locally
      when:
        all:
        - {ref: actor.awake}
        - eq:
          - {ref: actor.site}
          - {const: tower_base}
      payload: {}
      entry_family: tower_watch
    - label: Step aside from the balloon operating position
      when:
        all:
        - {ref: actor.awake}
        - eq:
          - {ref: actor.vital.life}
          - {const: alive}
        - lt:
          - {const: 0}
          - {ref: actor.current_movement_speed}
        - not_none: {ref: actor.heard_clearance}
        - not_none: {ref: actor.clearance_hearing_ref}
        - eq:
          - {ref: actor.heard_clearance.site}
          - {ref: actor.site}
        - eq:
          - {ref: actor.occupancy}
          - {const: blocking_balloon}
      payload: {}
      entry_family: step_aside
  - seat_family: hall_bokolds
    names: {hall_bokold_one: hall_bokold_one, hall_bokold_two: hall_bokold_two, hall_bokold_three: hall_bokold_three, hall_bokold_four: hall_bokold_four, hall_bokold_five: hall_bokold_five}
    entries: [hall_draw, hall_wait, show_magic, withdraw_magic, observe_magic, study_magic, observe_my_magic, study_my_magic, observe_ground_magic, study_ground_magic, observe_alpha_magic, study_alpha_magic]
    read: [actor.name, actor.site, actor.last_action_ref, actor.cold_state, actor.vital.life, actor.current_movement_speed, actor.resources.display, actor.resources.display.item, actor.resources.display.holder, actor.resources.display.site, actor.resources.display.window, actor.resources.display.action, actor.resources.display_notice_ref, actor.resources.study, actor.resources.study.item, actor.resources.study.form, actor.resources.study.window, actor.resources.study.display, actor.resources.study.observation, actor.resources.study.study, actor.known_residents, actor.resources.study.custody_basis]
    offers:
    - entry_family: show_magic
      for_each_participants: {item: {kind: magic_item, read: [item.holder]}}
      label: [{const: Voluntarily display my original magic item for research}]
      visible_when: item.holder == actor.name
      when: actor.vital.life == 'alive' and actor.cold_state != 'frozen'
      availability: {ref: magic_show_window, when: "scene.magic_research is not None and scene.magic_research.selected is not None and scene.magic_research.selected.individual == payload.item and (scene.magic_display is None or (scene.magic_display is not None and scene.magic_display.window != scene.magic_research.basis))"}
      payload: {item: {ref: item_ref}, holder: {ref: actor.name}}
    - entry_family: withdraw_magic
      label: Withdraw my magic display
      when: {all: [{not_none: {ref: actor.resources.display}}, {eq: [{ref: actor.resources.display.holder}, {ref: actor.name}]}]}
      availability: {ref: magic_withdraw_current, when: "scene.magic_display is not None and scene.magic_display.holder == actor.name"}
      payload: {}
    - entry_family: observe_magic
      for_each_participants: {item: {kind: magic_item, read: [item.holder]}, holder: {collection: {ref: actor.known_residents}, as: seen}}
      label: [{const: Observe the original magic item actually displayed here}]
      visible_when: actor.resources.display is not None and actor.resources.display.item == item_ref and actor.resources.display.site == actor.site and item.holder == actor.resources.display.holder and seen.name == actor.resources.display.holder and seen.name != actor.name and seen.name != 'alpha'
      when: actor.resources.study is None or (actor.resources.study is not None and actor.resources.study.window != actor.resources.display.window) or (actor.resources.study is not None and actor.resources.study.study is None and actor.resources.study.display != actor.resources.display.action)
      availability: {ref: magic_observe_current, when: "scene.magic_display is not None and scene.magic_research is not None and scene.magic_display.window == scene.magic_research.basis and scene.magic_display.item == payload.item and actor.resources.display is not None and actor.resources.display.action == scene.magic_display.action and item.holder == holder.name and holder.site == actor.site and holder.site == scene.magic_display.site and holder.vital.life == 'alive' and holder.cold_state != 'frozen' and item.taken_ref == scene.magic_display.custody_basis"}
      payload: {item: {ref: item_ref}, holder: {ref: seen.name}}
    - entry_family: study_magic
      for_each_participants: {item: {kind: magic_item, read: [item.holder]}, holder: {collection: {ref: actor.known_residents}, as: seen}}
      label: [{const: Study the original I personally observed}]
      visible_when: actor.resources.study is not None and actor.resources.study.item == item_ref and actor.resources.display is not None and actor.resources.display.item == item_ref and actor.resources.display.site == actor.site and item.holder == actor.resources.display.holder and seen.name == actor.resources.display.holder and seen.name != actor.name and seen.name != 'alpha'
      when: actor.resources.study.window == actor.resources.display.window and actor.resources.study.display == actor.resources.display.action and actor.resources.study.study is None
      availability: {ref: magic_study_current, when: "scene.magic_display is not None and scene.magic_research is not None and scene.magic_display.window == scene.magic_research.basis and scene.magic_display.item == payload.item and actor.resources.display is not None and actor.resources.display.action == scene.magic_display.action and item.holder == holder.name and holder.site == actor.site and holder.site == scene.magic_display.site and holder.vital.life == 'alive' and holder.cold_state != 'frozen' and item.taken_ref == scene.magic_display.custody_basis"}
      payload: {item: {ref: item_ref}, holder: {ref: seen.name}}
    - entry_family: observe_alpha_magic
      for_each_participants: {item: {kind: magic_item, read: [item.holder]}, holder: {collection: {ref: actor.known_residents}, as: seen}}
      label: [{const: Observe the original magic item actually displayed here}]
      visible_when: actor.resources.display is not None and actor.resources.display.item == item_ref and actor.resources.display.site == actor.site and item.holder == actor.resources.display.holder and seen.name == actor.resources.display.holder and seen.name == 'alpha'
      when: actor.resources.study is None or (actor.resources.study is not None and actor.resources.study.window != actor.resources.display.window) or (actor.resources.study is not None and actor.resources.study.study is None and actor.resources.study.display != actor.resources.display.action)
      availability: {ref: magic_observe_alpha_current, when: "scene.magic_display is not None and scene.magic_research is not None and scene.magic_display.window == scene.magic_research.basis and scene.magic_display.item == payload.item and actor.resources.display is not None and actor.resources.display.action == scene.magic_display.action and item.holder == holder.name and holder.site == actor.site and holder.site == scene.magic_display.site and holder.vital.life == 'alive' and holder.awake and item.taken_ref == scene.magic_display.custody_basis"}
      payload: {item: {ref: item_ref}, holder: {ref: seen.name}}
    - entry_family: study_alpha_magic
      for_each_participants: {item: {kind: magic_item, read: [item.holder]}, holder: {collection: {ref: actor.known_residents}, as: seen}}
      label: [{const: Study the original I personally observed}]
      visible_when: actor.resources.study is not None and actor.resources.study.item == item_ref and actor.resources.display is not None and actor.resources.display.item == item_ref and actor.resources.display.site == actor.site and item.holder == actor.resources.display.holder and seen.name == actor.resources.display.holder and seen.name == 'alpha'
      when: actor.resources.study.window == actor.resources.display.window and actor.resources.study.display == actor.resources.display.action and actor.resources.study.study is None
      availability: {ref: magic_study_alpha_current, when: "scene.magic_display is not None and scene.magic_research is not None and scene.magic_display.window == scene.magic_research.basis and scene.magic_display.item == payload.item and actor.resources.display is not None and actor.resources.display.action == scene.magic_display.action and item.holder == holder.name and holder.site == actor.site and holder.site == scene.magic_display.site and holder.vital.life == 'alive' and holder.awake and item.taken_ref == scene.magic_display.custody_basis"}
      payload: {item: {ref: item_ref}, holder: {ref: seen.name}}
    - entry_family: observe_my_magic
      for_each_participants: {item: {kind: magic_item, read: [item.holder]}}
      label: [{const: Observe the original magic item actually displayed here}]
      visible_when: actor.resources.display is not None and actor.resources.display.item == item_ref and actor.resources.display.site == actor.site and item.holder == actor.resources.display.holder and actor.resources.display.holder == actor.name
      when: actor.resources.study is None or (actor.resources.study is not None and actor.resources.study.window != actor.resources.display.window) or (actor.resources.study is not None and actor.resources.study.study is None and actor.resources.study.display != actor.resources.display.action)
      availability: {ref: magic_observe_self_current, when: "scene.magic_display is not None and scene.magic_research is not None and scene.magic_display.window == scene.magic_research.basis and scene.magic_display.item == payload.item and actor.resources.display is not None and actor.resources.display.action == scene.magic_display.action and item.holder == actor.name and actor.site == scene.magic_display.site and actor.vital.life == 'alive' and actor.cold_state != 'frozen' and item.taken_ref == scene.magic_display.custody_basis"}
