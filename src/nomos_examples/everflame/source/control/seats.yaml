            eq:
            - ref: known.individual
            - ref: individual
      when:
        all:
        - not:
            ref: target.closed
        - any:
          - eq:
            - ref: actor.site
            - ref: target.passage.start
          - eq:
            - ref: actor.site
            - ref: target.passage.end
      payload:
        target:
          ref: individual
        destination:
          if:
            when:
              eq:
              - ref: actor.site
              - ref: target.passage.start
            then:
              ref: target.passage.end
            else:
              ref: target.passage.start
