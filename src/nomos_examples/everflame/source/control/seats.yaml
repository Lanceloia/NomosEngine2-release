      when:
        all:
        - not_none: {ref: actor.escort_heard_ref}
        - eq:
          - {ref: actor.escort_speaker}
          - {const: adventurer}
        - eq:
          - {ref: actor.vital.life}
          - {const: alive}
        - not:
            eq:
            - {ref: actor.cold_state}
            - {const: frozen}
        - not:
            eq:
            - {ref: actor.rescue_state}
            - {const: safe}
      availability: {ref: guide_light_here, when: actor.site == guide.site and torch.holder == guide.name
          and torch.charges > 0}
      payload: {}
    - entry_family: observe_prison_line
      label: Observe the prison watch line from here
      when:
        all:
        - eq:
          - {ref: actor.vital.life}
          - {const: alive}
        - not:
            eq:
            - {ref: actor.cold_state}
            - {const: frozen}
        - any:
          - eq:
            - {ref: actor.site}
            - {const: prison_outer}
          - eq:
            - {ref: actor.site}
            - {const: prison_holding}
      payload:
        guardian: {const: prison_guard}
    - entry_family: pass_prison_line
      label: Cross the last observed clear watch line
      when:
        all:
        - not_none: {ref: actor.prison_access.line}
        - eq:
          - {ref: actor.prison_access.line.guardian.site}
          - {ref: actor.site}
        - not: {ref: actor.prison_access.line.guardian.present}
        - eq:
          - {ref: actor.vital.life}
          - {const: alive}
        - not:
            eq:
            - {ref: actor.cold_state}
            - {const: frozen}
        - lt:
          - {const: 0}
          - {ref: actor.current_movement_speed}
      payload:
        guardian: {ref: actor.prison_access.line.guardian.name}
        destination:
          if:
            when:
              eq:
              - {ref: actor.site}
              - {const: prison_outer}
            then: {const: prison_holding}
            else: {const: prison_outer}
        base_move_cost: {const: 10000}
    - entry_family: try_prison_line
      label: Observe and try the prison watch line; a returned guard may block me
      when:
        all:
        - not_none: {ref: actor.prison_access.line}
        - eq:
          - {ref: actor.prison_access.line.guardian.site}
          - {ref: actor.site}
        - not: {ref: actor.prison_access.line.guardian.present}
        - eq:
          - {ref: actor.vital.life}
          - {const: alive}
        - not:
            eq:
            - {ref: actor.cold_state}
            - {const: frozen}
        - lt:
          - {const: 0}
          - {ref: actor.current_movement_speed}
      availability:
        ref: prison_attempt_ground
        when:
          call:
            ref: movement.ordinary_floor_passable
            args:
              floors: {ref: scene.floors}
              stairs: {ref: scene.stair_paths}
              unclimbable_stairs: {ref: scene.unclimbable_stairs}
              start: {ref: actor.site}
              destination: {ref: payload.destination}
      payload:
        guardian: {ref: actor.prison_access.line.guardian.name}
        destination:
          if:
            when:
              eq:
              - {ref: actor.site}
              - {const: prison_outer}
            then: {const: prison_holding}
            else: {const: prison_outer}
        base_move_cost: {const: 10000}
    - entry_family: pass_door
      for_each_participants:
        door:
          kind: passage_door
          read: [door.front, door.back, door.frozen, door.opened, door.base_move_cost]
      visible_when:
        any:
        - eq:
          - {ref: actor.site}
          - {ref: door.front}
        - eq:
          - {ref: actor.site}
          - {ref: door.back}
      label:
      - {const: Pass the stable door toward the way out}
      when:
        all:
        - not: {ref: door.frozen}
        - {ref: door.opened}
        - lt:
          - {const: 0}
          - {ref: actor.current_movement_speed}
      payload:
        door: {ref: door_ref}
        destination:
          if:
            when:
              eq:
              - {ref: actor.site}
              - {ref: door.front}
            then: {ref: door.back}
            else: {ref: door.front}
        base_move_cost: {ref: door.base_move_cost}
