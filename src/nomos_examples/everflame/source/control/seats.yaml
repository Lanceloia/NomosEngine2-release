          as: person
      label:
      - const: 'Touch the observed person with '
      - ref: item.label
      visible_when: item.holder == actor.name and item.form == 'branding_iron'
      when: actor.vital.life == 'alive' and actor.cold_state != 'frozen' and actor.person_sighting is not None and
