        ref: view.current_site_information
        args: {}
    offer_previews:
    - template: cross_success_protection
      entry: cross_ice_adventurer
      law:
        ref: view.cross_success_protection
        args: {}
    - template: move_self_protection
      entry: move_adventurer
      law:
        ref: view.move_self_protection
        args: {}
    - template: thaw_protection
      entry: thaw_ritual_resident
      law:
        ref: view.known_site_protection
        args: {}
    offers:
    - entry: show_magic_adventurer
      for_each_participants: {item: {kind: magic_item, read: [item.holder]}}
      label: [{const: Voluntarily display my original magic item for research}]
      visible_when: item.holder == actor.name
      when: actor.vital.life == 'alive' and actor.cold_state != 'frozen'
      availability: {ref: magic_show_window, when: "scene.magic_research is not None and scene.magic_research.selected is not None and scene.magic_research.selected.individual == payload.item and (scene.magic_display is None or (scene.magic_display is not None and scene.magic_display.window != scene.magic_research.basis))"}
      payload: {item: {ref: item_ref}, holder: {ref: actor.name}}
    - entry: withdraw_magic_adventurer
      label: Withdraw my magic display
      when: {not_none: {ref: actor.last_action_ref}}
      availability: {ref: magic_withdraw_current, when: "scene.magic_display is not None and scene.magic_display.holder == actor.name"}
      payload: {}
    - entry: report_alpha_adventurer
      label: Report my sighting of Emma alive outside the palace
      fixed_participants: true
      when:
        all:
        - {eq: [{ref: actor.vital.life}, {const: alive}]}
        - {not: {eq: [{ref: actor.cold_state}, {const: frozen}]}}
        - {not_none: {ref: actor.conversations.tower}}
        - {not_none: {ref: actor.conversations.tower.offer}}
        - {not_none: {ref: actor.conversations.tower.acceptance}}
        - {not_none: {ref: actor.person_sighting}}
        - {eq: [{ref: actor.person_sighting.subject}, {const: emma}]}
        - {eq: [{ref: actor.person_sighting.site}, {const: palace_exit}]}
        - {eq: [{ref: actor.person_sighting.life}, {const: alive}]}
      availability: {ref: alpha_report_recipient_here, when: {eq: [{ref: actor.site}, {ref: recipient.site}]}}
      payload: {offer: {ref: actor.conversations.tower.acceptance.offer}, observation: {ref: actor.person_sighting.observation}}
    - entry: accept_alpha_adventurer
      label: Accept the heard offer to take Emma out alive (no item delivered yet)
      when:
        all:
        - {eq: [{ref: actor.vital.life}, {const: alive}]}
        - {not: {eq: [{ref: actor.cold_state}, {const: frozen}]}}
        - {not_none: {ref: actor.conversations.tower}}
        - {not_none: {ref: actor.conversations.tower.offer}}
        - {not_none: {ref: actor.conversations.tower.hearing}}
        - {is_none: {ref: actor.conversations.tower.acceptance}}
        - {eq: [{ref: actor.site}, {ref: actor.conversations.tower.offer.site}]}
      payload: {recipient: {const: alpha}, offer: {ref: actor.conversations.tower.offer.utterance}}
    - entry: observe_balloon_power_adventurer
      label: [{const: Inspect the balloon power housing}]
      when: "actor.vital.life == 'alive' and actor.cold_state != 'frozen'"
      for_each_participants: &balloon_power_roles
        balloon: {kind: balloon, read: [balloon.site]}
        bear_one: {fixed_actor: tower_bear_one, private: true}
        bear_two: {fixed_actor: tower_bear_two, private: true}
      visible_when: actor.site == balloon.site
      payload: {balloon: {ref: balloon_ref}}
    - entry: extract_balloon_power_adventurer
      label: [{const: Withdraw the original balloon power (balloon cannot fly without it)}]
      when: "actor.resources.balloon is not None and actor.resources.balloon.charges == 1 and actor.resources.power_origin is None"
      for_each_participants: *balloon_power_roles
      visible_when: actor.site == balloon.site
      payload: {balloon: {ref: balloon_ref}}
    - entry: transfer_balloon_power_adventurer
      label: [{const: Reload the balloon with the carried power}]
      when: "actor.resources.balloon is not None and actor.resources.balloon.charges == 0"
      for_each_participants: &balloon_power_transfer_roles
        balloon: {kind: balloon, read: [balloon.site]}
        power: {kind: balloon_power, read: [power.holder, power.origin]}
        bear_one: {fixed_actor: tower_bear_one, private: true}
        bear_two: {fixed_actor: tower_bear_two, private: true}
      visible_when: "actor.site == balloon.site and power.holder == actor.name and actor.resources.power_origin is not None and power.origin == actor.resources.power_origin"
      payload: {balloon: {ref: balloon_ref}, power: {ref: power_ref}, operation: {const: reload}}
    - entry: transfer_balloon_power_adventurer
      label: [{const: Withdraw balloon power into the same empty carrier}]
      when: "actor.resources.balloon is not None and actor.resources.balloon.charges == 1"
      for_each_participants: *balloon_power_transfer_roles
      visible_when: "actor.site == balloon.site and power.holder == actor.name and actor.resources.power_origin is not None and power.origin == actor.resources.power_origin"
      payload: {balloon: {ref: balloon_ref}, power: {ref: power_ref}, operation: {const: withdraw}}
    - entry: load_balloon_power_adventurer
      label: [{const: Load the carried balloon power into the Everflame}]
      when: true
      for_each_participants:
        power: {kind: balloon_power, read: [power.holder, power.origin]}
        torch: {fixed_kind: everflame, read: [torch.holder]}
      visible_when: "power.holder == actor.name and torch.holder == actor.name and actor.resources.power_origin is not None and power.origin == actor.resources.power_origin"
      payload: {power: {ref: power_ref}, torch: {ref: torch_ref}}
    - entry: balloon_control_adventurer
      label: [{const: Board the balloon basket}]
      when: "actor.cold_state != 'frozen' and actor.current_movement_speed > 0 and actor.vital.life == 'alive'"
      for_each_participants: *balloon_control_participants
      visible_when: "actor.site == balloon.site"
      payload: {balloon: {ref: balloon_ref}, operation: {const: board}}
    - entry: balloon_flight_adventurer
      label: [{const: Fly the balloon to the upper stop}]
      when: "actor.site == 'tower_base' and actor.cold_state != 'frozen' and actor.vital.life == 'alive'"
      for_each_participants: &balloon_flight_participants
        balloon: {kind: balloon, read: [balloon.site]}
        emma:
          fixed_actor: emma
          private: true
          when: {exactly_one: {collection: {ref: scene.balloon_seats}, as: seat, where: "seat.passenger == 'emma'"}}
      visible_when: "actor.site == balloon.site"
      payload: {balloon: {ref: balloon_ref}, destination: {const: tower_top}}
    - entry: balloon_flight_adventurer
      label: [{const: Fly the balloon to the lower stop}]
      when: "actor.site == 'tower_top' and actor.cold_state != 'frozen' and actor.vital.life == 'alive'"
      for_each_participants: *balloon_flight_participants
      visible_when: "actor.site == balloon.site"
      payload: {balloon: {ref: balloon_ref}, destination: {const: tower_base}}
    - entry: balloon_control_adventurer
      label: [{const: Leave the balloon basket}]
      when: "actor.cold_state != 'frozen' and actor.current_movement_speed > 0 and actor.vital.life == 'alive'"
      for_each_participants: *balloon_control_participants
      visible_when: "actor.site == balloon.site"
      payload: {balloon: {ref: balloon_ref}, operation: {const: leave}}
    - entry: balloon_control_adventurer
      label: [{const: Untie the balloon (does not start flight)}]
      when: "actor.cold_state != 'frozen' and actor.current_movement_speed > 0 and actor.vital.life == 'alive'"
      for_each_participants: *balloon_control_participants
      visible_when: "actor.site == balloon.site"
      payload: {balloon: {ref: balloon_ref}, operation: {const: untie}}
    - entry: balloon_control_adventurer
      label: [{const: Deflate the empty balloon (does not move it)}]
      when: "actor.cold_state != 'frozen' and actor.current_movement_speed > 0 and actor.vital.life == 'alive'"
      for_each_participants: *balloon_control_participants
      visible_when: "actor.site == balloon.site"
      payload: {balloon: {ref: balloon_ref}, operation: {const: deflate}}
    - entry: balloon_control_adventurer
      label: [{const: Inflate the empty balloon (does not start flight)}]
      when: "actor.cold_state != 'frozen' and actor.current_movement_speed > 0 and actor.vital.life == 'alive'"
      for_each_participants: *balloon_control_participants
      visible_when: "actor.site == balloon.site"
      payload: {balloon: {ref: balloon_ref}, operation: {const: inflate}}
    - entry: balloon_push_adventurer
      for_each: {collection: {ref: actor.known_paths}, as: path}
      for_each_participants: &balloon_push_roles
        balloon: {kind: balloon, read: [balloon.site, balloon.inflated, balloon.tied]}
        bear_one: {fixed_actor: tower_bear_one, private: true}
        bear_two: {fixed_actor: tower_bear_two, private: true}
      label: [{const: 'Push the empty balloon to '}, {ref: path.end}]
      visible_when: actor.site == balloon.site
      when: path.start == actor.site and not balloon.inflated and not balloon.tied and actor.current_movement_speed > 0 and actor.cold_state != 'frozen' and actor.vital.life == 'alive'
      payload: {balloon: {ref: balloon_ref}, destination: {ref: path.end}, base_move_cost: {ref: path.base_move_cost}}
    - entry: look_tower_top_adventurer
      fixed_participants: true
      label: Look around the tower top
      when:
        all:
        - {eq: [{ref: actor.site}, {const: tower_top}]}
        - {eq: [{ref: actor.vital.life}, {const: alive}]}
        - {not: {eq: [{ref: actor.cold_state}, {const: frozen}]}}
      payload: {}
    - entry: explain_balloon_adventurer
      for_each_participants:
        balloon: {kind: balloon, read: [balloon.site]}
      label: [{const: Explain the balloon journey down to Emma (no guaranteed consent)}]
      visible_when: actor.site == balloon.site
      when:
        all:
        - actor.site == 'tower_top' and actor.vital.life == 'alive' and actor.cold_state != 'frozen' and actor.vital.endurance > 0
        - exists: {collection: {ref: actor.known_residents}, as: known, where: known.name == 'emma' and known.site == actor.site}
      payload: {balloon: {ref: balloon_ref}}
    - entry: balloon_push_ice_adventurer
      for_each: {collection: {ref: actor.known_crossings}, as: crossing}
      for_each_participants: *balloon_push_roles
      label: [{const: 'Push the empty balloon across ice toward '}, {ref: crossing.intended}]
      visible_when: actor.site == balloon.site
      when: crossing.start == actor.site and not balloon.inflated and not balloon.tied and actor.current_movement_speed > 0 and actor.cold_state != 'frozen' and actor.vital.life == 'alive'
      payload: {balloon: {ref: balloon_ref}, crossing: {ref: crossing.key}, base_move_cost: {ref: crossing.base_move_cost}}
    - entry: balloon_push_bridge_adventurer
      for_each: {collection: {ref: actor.known_bridge_paths}, as: path}
      for_each_participants: *balloon_push_roles
      label: [{const: 'Slowly push the empty balloon along the bridge to '}, {ref: path.end}]
      visible_when: actor.site == balloon.site
      when: path.start == actor.site and not balloon.inflated and not balloon.tied and actor.current_movement_speed > 0 and actor.cold_state != 'frozen' and actor.vital.life == 'alive'
      payload: {balloon: {ref: balloon_ref}, destination: {ref: path.end}, base_move_cost: {ref: path.base_move_cost}}
    - entry: balloon_push_door_adventurer
      for_each_participants:
        balloon: {kind: balloon, read: [balloon.site, balloon.inflated, balloon.tied]}
        bear_one: {fixed_actor: tower_bear_one, private: true}
        bear_two: {fixed_actor: tower_bear_two, private: true}
        door: {kind: passage_door, read: [door.front, door.back, door.opened, door.frozen, door.base_move_cost]}
      label: [{const: Push the empty balloon through the open doorway}]
      visible_when: actor.site == balloon.site and (actor.site == door.front or actor.site == door.back)
      when: not balloon.inflated and not balloon.tied and door.opened and not door.frozen and actor.current_movement_speed > 0 and actor.cold_state != 'frozen' and actor.vital.life == 'alive'
      payload:
        balloon: {ref: balloon_ref}
        door: {ref: door_ref}
        destination: {if: {when: {eq: [{ref: actor.site}, {ref: door.front}]}, then: {ref: door.back}, else: {ref: door.front}}}
        base_move_cost: {ref: door.base_move_cost}
    - entry: ask_alpha_adventurer
      label: Ask Alpha about taking Emma out of the palace
      when:
        all:
        - {any: [{is_none: {ref: actor.conversations.tower}}, {all: [{not_none: {ref: actor.conversations.tower}}, {is_none: {ref: actor.conversations.tower.acceptance}}]}]}
        - {eq: [{ref: actor.vital.life}, {const: alive}]}
        - {not: {eq: [{ref: actor.cold_state}, {const: frozen}]}}
        - {exactly_one: {collection: {ref: actor.known_residents}, as: known, where: {all: [{eq: [{ref: known.name}, {const: alpha}]}, {eq: [{ref: known.site}, {ref: actor.site}]}]}}}
      payload: {recipient: {const: alpha}}
    - entry: observe_resident_tower_bear_adventurer
      label:
      - const: 'Observe the resident: '
      - ref: person.name
      when:
        eq:
        - ref: person.site
        - ref: actor.site
      payload:
