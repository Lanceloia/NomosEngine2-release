          all:
            - {ref: actor.awake}
            - {not_none: {ref: actor.heard_guest}}
            - {any: [{is_none: {ref: actor.guest_decision}}, {all: [{not_none: {ref: actor.guest_decision}}, {not: {eq: [{ref: actor.guest_decision.request}, {ref: actor.heard_guest.utterance}]}}]}, {not_none: {ref: actor.guest_task}}]}
        payload: {}
      - {entry_family: bear_observe_routes, label: Look for routes from here, when: {ref: actor.awake}, payload: {}}
      - entry_family: bear_move
        for_each: {collection: {ref: actor.known_paths}, as: path}
        label: {prefix: 'Move to ', value: {ref: path.end}}
        when: {all: [{ref: actor.awake}, {lt: [{const: 0}, {ref: actor.current_movement_speed}]}, {eq: [{ref: path.start}, {ref: actor.site}]}]}
        availability: {ref: bear_local_ground, when: *candidate_ground}
        payload: {destination: {ref: path.end}, base_move_cost: {ref: path.base_move_cost}}
      - entry_family: bear_cross_ice
        for_each: {collection: {ref: actor.known_crossings}, as: crossing}
        label: {prefix: 'Cross ice toward ', value: {ref: crossing.intended}}
        when: {all: [{ref: actor.awake}, {lt: [{const: 0}, {ref: actor.current_movement_speed}]}, {eq: [{ref: crossing.start}, {ref: actor.site}]}]}
        payload: {crossing: {ref: crossing.key}, base_move_cost: {ref: crossing.base_move_cost}}
      - entry_family: bear_pass_door
        for_each_participants: {door: {kind: passage_door, read: [door.front, door.back, door.frozen, door.opened, door.base_move_cost]}}
        label: [{const: Pass through the open stable door}]
        visible_when: actor.site == door.front or actor.site == door.back
        when: actor.awake and actor.current_movement_speed > 0 and not door.frozen and door.opened
        payload:
          door: {ref: door_ref}
          destination: {if: {when: {eq: [{ref: actor.site}, {ref: door.front}]}, then: {ref: door.back}, else: {ref: door.front}}}
          base_move_cost: {ref: door.base_move_cost}
      - entry_family: bar_inspect_drink
        for_each_participants: {drink: {kind: drink_container, read: [drink.holder, drink.change_ref]}}
        label: [{const: Inspect the container I am holding}]
        visible_when: drink.holder == actor.name
        when:
          all:
            - actor.awake
            - if:
                when: actor.drink_sighting is not None
                then: actor.drink_sighting.container != drink_ref or actor.drink_sighting.change_ref != drink.change_ref or actor.drink_sighting.site != actor.site
                else: true
        payload: {drink: {ref: drink_ref}}
      - entry_family: bar_drink
        for_each_participants: {drink: {kind: drink_container, read: [drink.holder, drink.change_ref]}}
        label: [{const: Drink one portion from my inspected container}]
        visible_when: drink.holder == actor.name
        when: actor.awake and actor.drink_sighting is not None and actor.drink_sighting.container == drink_ref and actor.drink_sighting.site == actor.site and actor.drink_sighting.change_ref == drink.change_ref and not actor.drink_sighting.frozen and actor.drink_sighting.portions > 0
        payload: {drink: {ref: drink_ref}}
      - entry_family: bar_accept
        label: Permit this pour using my container
        when: &pending_bar_request
          all:
            - {ref: actor.awake}
            - {not_none: {ref: actor.heard_request}}
            - {not_none: {ref: actor.hearing_ref}}
            - {eq: [{ref: actor.site}, {ref: actor.heard_request.site}]}
            - {not: {eq: [{ref: actor.reply_request}, {ref: actor.heard_request.utterance}]}}
        payload: {}
      - {entry_family: bar_refuse, label: Refuse this pour using my container, when: *pending_bar_request, payload: {}}
      - {entry_family: bar_wait, label: Wait by the ice bar, when: {const: true}, payload: {}}
