        - target.label
        - target.passage.start
        - target.passage.end
      label:
        prefix: 'Observe '
        value:
          ref: target.label
      visible_when:
        any:
        - eq:
          - ref: actor.site
          - ref: target.passage.start
        - eq:
          - ref: actor.site
          - ref: target.passage.end
      when:
        none_matching:
          collection:
            ref: actor.known_walls
          as: known
          where:
            eq:
            - ref: known.individual
            - ref: individual
      payload:
        target:
          ref: individual
    - entry: move_wall_wall_resident
