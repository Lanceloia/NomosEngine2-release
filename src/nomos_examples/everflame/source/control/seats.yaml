      entry_family: stable_observe_routes
    - for_each:
        collection: {ref: actor.known_paths}
        as: path
      label:
        prefix: 'Travel toward '
        value: {ref: path.end}
      when:
        eq:
        - {ref: path.start}
        - {ref: actor.site}
      payload:
        base_move_cost: {ref: path.base_move_cost}
        destination: {ref: path.end}
      entry_family: stable_move
    - for_each:
        collection: {ref: actor.known_crossings}
        as: path
      label:
        prefix: 'Travel toward '
        value: {ref: path.intended}
      when:
        eq:
        - {ref: path.start}
        - {ref: actor.site}
      payload:
        base_move_cost: {ref: path.base_move_cost}
        crossing: {ref: path.key}
      entry_family: stable_cross_ice
    - for_each_participants:
        door:
          kind: passage_door
          read: [door.front, door.back, door.base_move_cost, door.opened, door.frozen]
      label:
      - {const: Pass local open door}
      visible_when:
        any:
        - eq:
          - {ref: actor.site}
          - {ref: door.front}
        - eq:
          - {ref: actor.site}
          - {ref: door.back}
      when:
        all:
        - {ref: door.opened}
        - not: {ref: door.frozen}
      payload:
        door: {ref: door_ref}
        destination:
          if:
            when:
              eq:
              - {ref: actor.site}
              - {ref: door.front}
            then: {ref: door.back}
            else: {ref: door.front}
        base_move_cost: {ref: door.base_move_cost}
      entry_family: stable_pass_door
