      - const: 'Receive the charge offered by '
      - ref: contact.name
      visible_when:
        all:
        - eq:
          - ref: packet.holder
          - ref: contact.name
        - exactly_one:
            collection:
              ref: actor.conversations.prison.contacts
            as: seen
            where:
              all:
              - eq:
                - ref: seen.name
                - ref: contact.name
              - eq:
                - ref: seen.site
                - ref: actor.site
        - exactly_one:
            collection:
              ref: actor.conversations.prison.answers
            as: heard
            where:
              all:
              - eq:
                - ref: heard.answer.speaker
                - ref: contact.name
              - eq:
                - ref: heard.answer.site
                - ref: actor.site
              - eq:
                - ref: heard.answer.statement
