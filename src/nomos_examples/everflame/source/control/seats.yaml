            - const: frozen
      payload:
        victim:
          ref: actor.person_sighting.subject
    - entry: bridge_slow_wall_resident
      for_each:
        collection:
          ref: actor.known_bridge_paths
        as: path
      label:
        prefix: 'Slowly cross the narrow bridge toward '
        value:
          ref: path.end
      when:
        eq:
        - ref: path.start
        - ref: actor.site
      availability:
        ref: bridge_local_ground
        when: *person_bridge_available
      payload:
        destination:
          ref: path.end
        base_move_cost:
          ref: path.base_move_cost
    - entry: wait_wall_resident
      label: Wait
      when:
        const: true
      payload: {}
    - entry: accept_torch_wall_resident
      fixed_participants: true
      label: Accept the offered Everflame
      when:
        all:
        - not_none:
            ref: actor.heard_torch_offer
        - eq:
          - ref: actor.heard_torch_offer.recipient
          - ref: actor.name
        - eq:
          - ref: actor.heard_torch_offer.site
          - ref: actor.site
        - is_none:
            ref: actor.accepted_torch_offer_ref
      payload: {}
    - entry: observe_person_wall_resident
      label: Observe the person at the offered destination
      when:
        all:
        - not_none:
            ref: actor.torch_accept_ref
        - not_none:
            ref: actor.heard_torch_offer
        - eq:
          - ref: actor.site
          - ref: actor.heard_torch_offer.destination
        - is_none:
            ref: actor.person_sighting
      payload:
        victim:
          const: adventurer
    - entry: thaw_person_wall_resident
      fixed_participants: true
      label: Thaw the observed person
      when:
        all:
        - not_none:
            ref: actor.person_sighting
        - eq:
          - ref: actor.person_sighting.subject
          - const: adventurer
        - eq:
          - ref: actor.person_sighting.site
          - ref: actor.site
        - eq:
          - ref: actor.person_sighting.cold_state
          - const: frozen
        - not:
            eq:
            - ref: actor.person_sighting.life
            - const: dead
        - not_none:
            ref: actor.known_everflame_charges
        - lt:
          - const: 0
          - ref: actor.known_everflame_charges
      payload: {}
    - entry: observe_wall_wall_resident
      for_each_object:
