# Adapted from Thawed Through the Everflame (CC BY-SA 4.0).
# Attention is shared; addressed evidence, acceptance and custody remain explicit.
lawdefs:
  - name: action.ask_alpha
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings:
        - name: said
          stage: effect
          let: {record: {type: TowerRequest, fields: {speaker: {ref: actor.name}, recipient: {ref: recipient.name}, site: {ref: actor.site}, utterance: {ref: occurrence}}}}
        guard:
          require:
          - identity: actor.name == payload.actor and recipient.name == payload.recipient and recipient.name == 'alpha'
          - active: actor.vital.life == 'alive' and actor.cold_state != 'frozen'
          - local: actor.site == recipient.site
          - observed: {exactly_one: {collection: {ref: actor.known_residents}, as: known, where: known.name == recipient.name and known.site == actor.site}}
          - uncommitted: actor.conversations.tower is None or (actor.conversations.tower is not None and actor.conversations.tower.acceptance is None)
        outputs:
          action: {ref: occurrence}
          last_action_ref: {ref: occurrence}
          request: {ref: said}
          conversation:
            record:
              type: PersonConversations
              fields:
                visible_motions: {ref: actor.conversations.visible_motions}
                prison: {ref: actor.conversations.prison}
                tower: {record: {type: TowerConversation, fields: {request: {ref: said}, offer: null, hearing: null, acceptance: null}}}
  - name: event.alpha_request_heard
    family: direct_actor_event
    formals: {}
    body:
      law:
        schema: c0.value.v1
        bindings: []
        guard:
          all:
          - scene.tower_request is not None and scene.tower_request.utterance == trigger.occurrence and scene.tower_request.recipient == actor.name and scene.tower_request.site == actor.site
          - &tower_attentive actor.awake and actor.attending and actor.vital.life == 'alive'
        outputs: {request: {ref: scene.tower_request}, hearing: {ref: occurrence}}
  - name: action.report_alpha
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings: []
        guard:
          require:
          - identity: actor.name == payload.actor and recipient.name == payload.recipient
          - active: actor.vital.life == 'alive' and actor.cold_state != 'frozen'
          - local: actor.site == recipient.site
          - accepted: actor.conversations.tower is not None and actor.conversations.tower.offer is not None and actor.conversations.tower.acceptance is not None
          - exact_offer: actor.conversations.tower.acceptance.offer == payload.offer and actor.conversations.tower.offer.utterance == payload.offer and actor.conversations.tower.offer.speaker == recipient.name
          - actual_sighting: actor.person_sighting is not None and actor.person_sighting.subject == 'emma' and actor.person_sighting.site == 'palace_exit' and actor.person_sighting.life == 'alive'
          - exact_sighting: actor.person_sighting.observation == payload.observation
        outputs:
          action: {ref: occurrence}
          last_action_ref: {ref: occurrence}
          report:
            record:
              type: TowerExitReport
              fields: {speaker: {ref: actor.name}, recipient: {ref: recipient.name}, site: {ref: actor.site}, offer: {ref: payload.offer}, sighting: {ref: actor.person_sighting}, utterance: {ref: occurrence}}
  - name: event.alpha_exit_report_heard
    family: direct_actor_event
    formals: {}
    body:
      law:
        schema: c0.value.v1
        bindings: []
        guard:
          all:
          - *tower_attentive
          - scene.tower_exit_report is not None and actor.tower_proposal is not None and actor.heard_tower_acceptance is not None and actor.acceptance_hearing_ref is not None
          - scene.tower_exit_report.utterance == trigger.occurrence and scene.tower_exit_report.recipient == actor.name and scene.tower_exit_report.site == actor.site
          - scene.tower_exit_report.offer == actor.tower_proposal.utterance and actor.heard_tower_acceptance.offer == actor.tower_proposal.utterance and scene.tower_exit_report.speaker == actor.tower_proposal.recipient
          - actor.trade_decision is None
        outputs: {report: {ref: scene.tower_exit_report}, hearing: {ref: occurrence}}
  - name: action.resolve_alpha
    family: action
    formals: {deliver: bool}
    body:
      value:
        schema: c0.value.v1
        bindings: []
        guard:
          require:
          - identity: actor.name == payload.actor and recipient.name == payload.recipient
          - active: actor.awake and actor.vital.life == 'alive'
          - local: actor.site == recipient.site and recipient.vital.life == 'alive' and recipient.cold_state != 'frozen'
          - known: actor.tower_proposal is not None and actor.heard_exit_report is not None and actor.exit_report_hearing_ref is not None
          - original_offer: actor.heard_exit_report.offer == actor.tower_proposal.utterance and actor.heard_exit_report.speaker == recipient.name and actor.tower_proposal.recipient == recipient.name
          - actual_report: actor.heard_exit_report.sighting.subject == 'emma' and actor.heard_exit_report.sighting.site == 'palace_exit' and actor.heard_exit_report.sighting.life == 'alive'
          - original_item: actor.tower_proposal.item == payload.item
          - undecided: actor.trade_decision is None
          - custody:
              if: {when: {arg: deliver}, then: "item.holder == actor.name", else: true}
        outputs:
          action: {ref: occurrence}
          last_action_ref: {ref: occurrence}
          holder: {if: {when: {arg: deliver}, then: {ref: recipient.name}, else: {ref: item.holder}}}
          taken_ref: {if: {when: {arg: deliver}, then: {ref: occurrence}, else: {ref: item.taken_ref}}}
          decision:
            record:
              type: TowerTradeDecision
              fields:
                offer: {ref: actor.tower_proposal.utterance}
                report: {ref: actor.heard_exit_report.utterance}
                hearing: {ref: actor.exit_report_hearing_ref}
                item: {ref: payload.item}
                recipient: {ref: recipient.name}
                decision: {if: {when: {arg: deliver}, then: {const: delivered}, else: {const: withdrawn}}}
                action: {ref: occurrence}
  - name: action.propose_alpha
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings:
        - name: proposed
          stage: effect
          let:
            record:
              type: TowerOffer
              fields: {speaker: {ref: actor.name}, recipient: {ref: recipient.name}, site: {ref: actor.site}, request: {ref: actor.heard_tower_request.utterance}, item: {ref: payload.item}, condition: {const: emma_leaves_alive}, utterance: {ref: occurrence}}
        guard:
          require:
          - identity: actor.name == payload.actor and actor.name == 'alpha' and recipient.name == payload.recipient
          - active: actor.awake and actor.vital.life == 'alive'
          - heard: actor.heard_tower_request is not None and actor.tower_hearing_ref is not None
          - addressed: actor.heard_tower_request.recipient == actor.name and actor.heard_tower_request.speaker == recipient.name
          - local: actor.site == recipient.site and actor.site == actor.heard_tower_request.site
          - unused: actor.tower_proposal is None or (actor.tower_proposal is not None and actor.tower_proposal.request != actor.heard_tower_request.utterance)
          - owned: item.holder == actor.name
        outputs: {action: {ref: occurrence}, last_action_ref: {ref: occurrence}, offer: {ref: proposed}, scene_offer: {ref: proposed}}
  - name: event.alpha_offer_heard
    family: direct_actor_event
    formals: {}
    body:
      law:
        schema: c0.value.v1
        bindings: []
        guard:
          all:
          - scene.tower_offer is not None and actor.conversations.tower is not None
          - scene.tower_offer.utterance == trigger.occurrence and scene.tower_offer.recipient == actor.name and scene.tower_offer.site == actor.site
          - actor.vital.life == 'alive' and actor.cold_state != 'frozen'
          - scene.tower_offer.request == actor.conversations.tower.request.utterance and scene.tower_offer.speaker == actor.conversations.tower.request.recipient
        outputs:
          conversation:
            record:
              type: PersonConversations
              fields:
                visible_motions: {ref: actor.conversations.visible_motions}
                prison: {ref: actor.conversations.prison}
                tower: {record: {type: TowerConversation, fields: {request: {ref: actor.conversations.tower.request}, offer: {ref: scene.tower_offer}, hearing: {ref: occurrence}, acceptance: null}}}
  - name: action.accept_alpha
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings:
        - name: accepted
          stage: effect
          let: {record: {type: TowerAcceptance, fields: {speaker: {ref: actor.name}, recipient: {ref: recipient.name}, site: {ref: actor.site}, offer: {ref: payload.offer}, utterance: {ref: occurrence}}}}
        guard:
          require:
          - identity: actor.name == payload.actor and recipient.name == payload.recipient and recipient.name == 'alpha'
          - active: actor.vital.life == 'alive' and actor.cold_state != 'frozen'
          - local: actor.site == recipient.site
          - heard: actor.conversations.tower is not None and actor.conversations.tower.offer is not None and actor.conversations.tower.hearing is not None
          - exact: actor.conversations.tower.offer.utterance == payload.offer and actor.conversations.tower.offer.speaker == recipient.name and actor.conversations.tower.offer.recipient == actor.name
          - current: recipient.tower_proposal is not None and recipient.tower_proposal.utterance == payload.offer
          - unused: actor.conversations.tower.acceptance is None
        outputs:
          action: {ref: occurrence}
          last_action_ref: {ref: occurrence}
          acceptance: {ref: accepted}
          conversation:
            record:
              type: PersonConversations
              fields:
                visible_motions: {ref: actor.conversations.visible_motions}
                prison: {ref: actor.conversations.prison}
                tower: {record: {type: TowerConversation, fields: {request: {ref: actor.conversations.tower.request}, offer: {ref: actor.conversations.tower.offer}, hearing: {ref: actor.conversations.tower.hearing}, acceptance: {ref: accepted}}}}
  - name: event.alpha_acceptance_heard
    family: direct_actor_event
    formals: {}
    body:
      law:
        schema: c0.value.v1
        bindings: []
        guard:
          all:
          - scene.tower_acceptance is not None and actor.tower_proposal is not None
          - scene.tower_acceptance.utterance == trigger.occurrence and scene.tower_acceptance.recipient == actor.name and scene.tower_acceptance.site == actor.site
          - *tower_attentive
          - scene.tower_acceptance.offer == actor.tower_proposal.utterance and scene.tower_acceptance.speaker == actor.tower_proposal.recipient
        outputs: {acceptance: {ref: scene.tower_acceptance}, hearing: {ref: occurrence}}
  - name: action.clear_balloon
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings:
        - name: said
          stage: effect
          let: {record: {type: TowerClearance, fields: {speaker: {ref: actor.name}, site: {ref: actor.site}, acceptance: {ref: actor.heard_tower_acceptance.utterance}, offer: {ref: actor.tower_proposal.utterance}, utterance: {ref: occurrence}}}}
        guard:
          require:
          - identity: actor.name == payload.actor and actor.name == 'alpha'
          - active: actor.awake and actor.vital.life == 'alive'
          - heard: actor.heard_tower_acceptance is not None and actor.acceptance_hearing_ref is not None and actor.tower_proposal is not None
          - exact: actor.heard_tower_acceptance.offer == actor.tower_proposal.utterance and actor.heard_tower_acceptance.speaker == actor.tower_proposal.recipient and actor.heard_tower_acceptance.recipient == actor.name
          - local: actor.site == actor.heard_tower_acceptance.site and actor.site == 'tower_base'
          - unused: actor.clearance is None
        outputs: {action: {ref: occurrence}, last_action_ref: {ref: occurrence}, clearance: {ref: said}, public_clearance: {ref: said}}
  - name: event.guard_clearance_heard
    family: direct_actor_event
    formals: {}
    body:
      law:
        schema: c0.value.v1
        bindings: []
        guard:
          all:
          - scene.tower_clearance is not None and scene.tower_clearance.utterance == trigger.occurrence and scene.tower_clearance.speaker == 'alpha' and scene.tower_clearance.site == actor.site
          - *tower_attentive
        outputs: {clearance: {ref: scene.tower_clearance}, hearing: {ref: occurrence}}
  - name: action.step_aside
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings: []
        guard:
          require:
          - identity: actor.name == payload.actor and actor.name != 'alpha'
          - active: actor.awake and actor.vital.life == 'alive' and actor.current_movement_speed > 0
          - heard: actor.heard_clearance is not None and actor.clearance_hearing_ref is not None
          - local: actor.heard_clearance.speaker == 'alpha' and actor.heard_clearance.site == actor.site and actor.site == 'tower_base'
          - blocking: actor.occupancy == 'blocking_balloon'
        outputs: {action: {ref: occurrence}, last_action_ref: {ref: occurrence}, occupancy: {const: aside}}
