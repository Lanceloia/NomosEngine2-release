# Adapted from Thawed Through the Everflame (CC BY-SA 4.0).
# Carrying moves the selected patient; only the caregiver updates local knowledge.
lawdefs:
- name: action.carry_move
  family: action
  formals: {}
  body:
    value:
      schema: c0.value.v1
      bindings: []
      guard:
        all:
        - call: {ref: transport.unboarded, args: {seats: {ref: scene.balloon_seats}, person: {ref: actor.name}}}
        - call: {ref: transport.unboarded, args: {seats: {ref: scene.balloon_seats}, person: {ref: victim.name}}}
        - all:
          - call: {ref: movement.ordinary_floor_passable, args: {floors: {ref: scene.floors}, stairs: {ref: scene.stair_paths},
                unclimbable_stairs: {ref: scene.unclimbable_stairs}, start: {ref: actor.site}, destination: {ref: payload.destination}}}
          - actor.name == payload.actor
          - 0 < actor.current_movement_speed
          - call: {ref: movement.has_path, args: {paths: {ref: scene.paths},
              start: {ref: actor.site}, end: {ref: payload.destination}, cost: {ref: payload.base_move_cost}}}
          - call: {ref: movement.has_path, args: {paths: {ref: actor.known_paths},
              start: {ref: actor.site}, end: {ref: payload.destination}, cost: {ref: payload.base_move_cost}}}
        - actor.vital.life == 'alive' and actor.cold_state != 'frozen' and victim.name == payload.victim and actor.name
          != victim.name and victim.site == actor.site and victim.vital.life != 'dead' and (victim.cold_state ==
          'frozen' or victim.vital.endurance == 0) and actor.person_sighting is not None and actor.person_sighting.subject
          == victim.name and actor.person_sighting.site == actor.site and ritual.id == payload.ritual
      outputs:
        action: {ref: occurrence}
        site: {ref: payload.destination}
        known_sites:
          call: {ref: movement.remember_site, args: {known_sites: {ref: actor.known_sites}, destination: {ref: payload.destination}}}
        known_residents:
          call: {ref: perception.observe_named_person, args: {known: {ref: actor.known_residents}, observer_site: {
                ref: payload.destination}, subject_name: {ref: victim.name}, subject_site: {ref: payload.destination},
              basis: {ref: occurrence}}}
        sighting_ref:
          if:
            when: payload.destination == scene.notice_site
            then: {ref: occurrence}
            else: {ref: actor.sighting_ref}
        sighting_site:
          if:
            when: payload.destination == scene.notice_site
            then: {ref: payload.destination}
            else: {ref: actor.sighting_site}
        last_action_ref: {ref: occurrence}
        patient_site: {ref: payload.destination}
        ritual_status:
          if:
            when: ritual.status == 'active' and victim.name == ritual.target and victim.site == ritual.site
            then: {const: interrupted}
            else: {ref: ritual.status}
- name: action.carry_cross_ice
  family: action
  formals: {}
  body:
    value:
      schema: c0.value.v1
      bindings:
      - name: crossing
        collection: scene.crossings
        key: key
        value: {ref: payload.crossing}
        required: false
      - name: floor
        collection: scene.floors
        key: key
        value:
          if:
            when: {not_none: {ref: crossing}}
            then: {ref: crossing.floor_key}
            else: {const: null}
        required: false
      - name: success_followup
        collection: scene.crossings
        key: key
        value:
          if:
            when: {not_none: {ref: crossing}}
            then: {ref: crossing.success_followup}
            else: {const: null}
        required: false
      - name: failure_followup
        collection: scene.crossings
        key: key
        value:
          if:
            when: {not_none: {ref: crossing}}
            then: {ref: crossing.failure_followup}
            else: {const: null}
        required: false
      - name: movement
        stage: effect
        let:
          call: {ref: movement.resolve, args: {frozen: {ref: floor.frozen}, seed: {ref: scene.die_seed}, route: {
                ref: crossing}, balance_bonus: {ref: actor.balance_bonus}}}
      guard:
        all:
        - call: {ref: transport.unboarded, args: {seats: {ref: scene.balloon_seats}, person: {ref: actor.name}}}
        - call: {ref: transport.unboarded, args: {seats: {ref: scene.balloon_seats}, person: {ref: victim.name}}}
        - all:
          - actor.name == payload.actor
          - 0 < actor.current_movement_speed
          - {not_none: {ref: crossing}}
          - {not_none: {ref: floor}}
          - actor.site == crossing.start
          - payload.base_move_cost == crossing.base_move_cost
          - call: {ref: movement.knows_crossing, args: {known: {ref: actor.known_crossings},
              key: {ref: crossing.key}, start: {ref: crossing.start},
              intended: {ref: crossing.intended}, cost: {ref: crossing.base_move_cost}}}
        - actor.vital.life == 'alive' and actor.cold_state != 'frozen' and victim.name == payload.victim and actor.name
          != victim.name and victim.site == actor.site and victim.vital.life != 'dead' and (victim.cold_state ==
          'frozen' or victim.vital.endurance == 0) and actor.person_sighting is not None and actor.person_sighting.subject
          == victim.name and actor.person_sighting.site == actor.site and ritual.id == payload.ritual
      outputs:
        action: {ref: occurrence}
        roll: {ref: movement.roll}
        next_seed: {ref: movement.next_seed}
        site: {ref: movement.site}
        known_sites:
          call: {ref: movement.remember_site, args: {known_sites: {ref: actor.known_sites}, destination: {ref: movement.site}}}
        known_crossings:
          call:
            ref: movement.remember_crossing
            args:
              known: {ref: actor.known_crossings}
              followup:
                if:
                  when: {ref: movement.succeeded}
                  then: {ref: success_followup}
                  else: {ref: failure_followup}
        last_action_ref: {ref: occurrence}
        last_cross_ref: {ref: occurrence}
        patient_site: {ref: movement.site}
        ritual_status:
          if:
            when: ritual.status == 'active' and victim.name == ritual.target and victim.site == ritual.site
            then: {const: interrupted}
            else: {ref: ritual.status}
        known_residents:
          call: {ref: perception.observe_named_person, args: {known: {ref: actor.known_residents}, observer_site: {
                ref: movement.site}, subject_name: {ref: victim.name}, subject_site: {ref: movement.site}, basis: {
                ref: occurrence}}}
- name: action.carry_bridge_slow
  family: action
  formals: {}
  body:
    value:
      schema: c0.value.v1
      bindings: []
      guard:
        all:
        - call: {ref: transport.unboarded, args: {seats: {ref: scene.balloon_seats}, person: {ref: actor.name}}}
        - call: {ref: transport.unboarded, args: {seats: {ref: scene.balloon_seats}, person: {ref: victim.name}}}
        - all:
          - actor.name == payload.actor and actor.cold_state != 'frozen' and actor.vital.life == 'alive' and actor.current_movement_speed
            > 0
          - call: {ref: movement.has_unique_path, args: {paths: {ref: scene.bridge_paths},
              start: {ref: actor.site}, end: {ref: payload.destination}, cost: {ref: payload.base_move_cost}}}
          - call: {ref: movement.has_unique_path, args: {paths: {ref: actor.known_bridge_paths},
              start: {ref: actor.site}, end: {ref: payload.destination}, cost: {ref: payload.base_move_cost}}}
          - call: {ref: movement.endpoints_clear_of_frozen_floor, args: {floors: {ref: scene.floors},
              start: {ref: actor.site}, end: {ref: payload.destination}}}
        - actor.vital.life == 'alive' and actor.cold_state != 'frozen' and victim.name == payload.victim and actor.name
          != victim.name and victim.site == actor.site and victim.vital.life != 'dead' and (victim.cold_state ==
          'frozen' or victim.vital.endurance == 0) and actor.person_sighting is not None and actor.person_sighting.subject
          == victim.name and actor.person_sighting.site == actor.site and ritual.id == payload.ritual
      outputs:
        action: {ref: occurrence}
        last_action_ref: {ref: occurrence}
        site: {ref: payload.destination}
        known_sites:
          call: {ref: movement.remember_site, args: {known_sites: {ref: actor.known_sites}, destination: {ref: payload.destination}}}
        patient_site: {ref: payload.destination}
        ritual_status:
          if:
            when: ritual.status == 'active' and victim.name == ritual.target and victim.site == ritual.site
            then: {const: interrupted}
            else: {ref: ritual.status}
        known_residents:
          call: {ref: perception.observe_named_person, args: {known: {ref: actor.known_residents}, observer_site: {
                ref: payload.destination}, subject_name: {ref: victim.name}, subject_site: {ref: payload.destination},
              basis: {ref: occurrence}}}
- name: action.carry_pass_door
  family: action
  formals: {}
  body:
    value:
      schema: c0.value.v1
      bindings: []
      guard:
        all:
        - call: {ref: transport.unboarded, args: {seats: {ref: scene.balloon_seats}, person: {ref: actor.name}}}
        - call: {ref: transport.unboarded, args: {seats: {ref: scene.balloon_seats}, person: {ref: victim.name}}}
        - all:
          - all:
            - actor.name == payload.actor and actor.vital.life == 'alive' and actor.cold_state != 'frozen'
            - actor.site == door.front or actor.site == door.back
            - call: {ref: movement.has_declared_site, args: {sites: {ref: scene.sites}, site: {ref: door.front}}}
            - call: {ref: movement.has_declared_site, args: {sites: {ref: scene.sites}, site: {ref: door.back}}}
          - door.opened and not door.frozen and actor.current_movement_speed > 0
          - (actor.site == door.front and payload.destination == door.back) or (actor.site == door.back and payload.destination
            == door.front)
          - payload.base_move_cost == door.base_move_cost
          - call: {ref: movement.ordinary_floor_passable, args: {floors: {ref: scene.floors}, stairs: {ref: scene.stair_paths},
                unclimbable_stairs: {ref: scene.unclimbable_stairs}, start: {ref: actor.site}, destination: {ref: payload.destination}}}
        - actor.vital.life == 'alive' and actor.cold_state != 'frozen' and victim.name == payload.victim and actor.name
          != victim.name and victim.site == actor.site and victim.vital.life != 'dead' and (victim.cold_state ==
          'frozen' or victim.vital.endurance == 0) and actor.person_sighting is not None and actor.person_sighting.subject
          == victim.name and actor.person_sighting.site == actor.site and ritual.id == payload.ritual
      outputs:
        action: {ref: occurrence}
        last_action_ref: {ref: occurrence}
        site: {ref: payload.destination}
        known_sites:
          call: {ref: movement.remember_site, args: {known_sites: {ref: actor.known_sites}, destination: {ref: payload.destination}}}
        patient_site: {ref: payload.destination}
        ritual_status:
          if:
            when: ritual.status == 'active' and victim.name == ritual.target and victim.site == ritual.site
            then: {const: interrupted}
            else: {ref: ritual.status}
        known_residents:
          call: {ref: perception.observe_named_person, args: {known: {ref: actor.known_residents}, observer_site: {
                ref: payload.destination}, subject_name: {ref: victim.name}, subject_site: {ref: payload.destination},
              basis: {ref: occurrence}}}
