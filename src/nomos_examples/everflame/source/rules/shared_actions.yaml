# Adapted from Thawed Through the Everflame (CC BY-SA 4.0).
lawdefs:
- name: action.observe_resident
  family: action
  formals: {}
  body:
    value:
      schema: c0.value.v1
      bindings: []
      guard:
        require:
        - actor_identity: actor.name == payload.actor
        - awake: actor.vital.life == 'alive' and actor.cold_state != 'frozen'
        - actual_subject: victim.name == payload.victim and actor.site == victim.site
        - another_person: victim.name != actor.name
      outputs:
        action:
          ref: occurrence
        last_action_ref:
          ref: occurrence
        person_sighting:
          record:
            type: PersonSighting
            fields:
              subject:
                ref: victim.name
              site:
                ref: victim.site
              cold_state:
                ref: victim.cold_state
              life:
                ref: victim.vital.life
              observation:
                ref: occurrence
        known_residents:
          call:
            ref: perception.refresh_named_person
            args:
              known:
                ref: actor.known_residents
              observer_site:
                ref: actor.site
              subject_name:
                ref: victim.name
              subject_site:
                ref: victim.site
              basis:
                ref: occurrence
- name: action.brand_person_queen
  family: action
  formals:
    damage: int
  body:
    value:
      schema: c0.value.v1
      bindings:
      - name: hit
        stage: effect
        let:
          le:
          - 10
          - die_roll:
              seed:
                ref: scene.die_seed
              sides: 20
      - name: damaged
        stage: effect
        let:
          call:
            ref: combat.contact_vital
            args:
              vital:
                ref: victim.vital
              hit:
                ref: hit
              frozen: victim.cold_state == 'frozen'
              weak: false
              damage:
                arg: damage
              basis:
                ref: occurrence
      guard:
        require:
        - active: actor.name == payload.actor and actor.vital.life == 'alive' and actor.cold_state != 'frozen'
        - actual_iron: item.form == 'branding_iron' and item.holder == actor.name
        - observed_contact: actor.person_sighting is not None and actor.person_sighting.subject == payload.victim
            and actor.person_sighting.site == actor.site
        - current_contact: victim.name == payload.victim and victim.name != actor.name and victim.site == actor.site
            and victim.vital.life != 'dead'
        - finite_marks:
            any:
            - lt:
              - count_matching:
                  collection:
                    ref: item.brands
                  as: mark
                  where: true
              - 32
            - exists:
                collection: item.brands
                as: mark
                where: mark.person == payload.victim
      outputs:
        action:
          ref: occurrence
        last_action_ref:
          ref: occurrence
        next_seed:
          die_next_seed:
            ref: scene.die_seed
        vital:
          ref: damaged
        brands:
          if:
            when:
              all:
              - ref: hit
              - none_matching:
                  collection: item.brands
                  as: mark
                  where: mark.person == payload.victim
            then:
              append:
              - ref: item.brands
              - record:
                  type: BrandMark
                  fields:
                    person:
                      ref: payload.victim
                    elemental: null
                    contact:
                      ref: occurrence
            else:
              ref: item.brands
- name: action.locate_branded_person
  family: action
  formals: {}
  body:
    value:
      schema: c0.value.v1
      bindings: []
      guard:
        require:
        - active: actor.name == payload.actor and actor.vital.life == 'alive' and actor.cold_state != 'frozen'
        - actual_iron: item.form == 'branding_iron' and item.holder == actor.name
        - inspected_iron: actor.casting_feedback is not None and actor.casting_feedback.branding is not None and
            actor.casting_feedback.branding.iron == payload.item
        - own_mark:
            exactly_one:
              collection: actor.casting_feedback.branding.marks
              as: mark
              where: mark.person == payload.victim and mark.elemental is None and mark.contact == payload.contact
        - actual_mark:
            exactly_one:
              collection: item.brands
              as: mark
              where: mark.person == payload.victim and mark.elemental is None and mark.contact == payload.contact
      outputs:
        action:
          ref: occurrence
        last_action_ref:
          ref: occurrence
        casting_feedback:
          record:
            type: CastingFeedback
            fields:
              focus_roll:
                ref: actor.casting_feedback.focus_roll
              fireball_roll:
                ref: actor.casting_feedback.fireball_roll
              branding:
                record:
                  type: BrandKnowledge
                  fields:
                    iron:
                      ref: payload.item
                    marks:
                      ref: actor.casting_feedback.branding.marks
                    inspection:
                      ref: actor.casting_feedback.branding.inspection
                    location:
                      record:
                        type: BrandLocation
                        fields:
                          mark:
                            record:
                              type: BrandMark
                              fields:
                                person:
                                  ref: payload.victim
                                elemental: null
                                contact:
                                  ref: payload.contact
                          site:
                            if:
                              when: victim.vital.life != 'dead'
                              then:
                                ref: victim.site
                              else: null
                          observation:
                            ref: occurrence
- name: action.queen_wait
  family: action
  formals: {}
  body:
    value:
      schema: c0.value.v1
      bindings: []
      guard: actor.name == payload.actor and actor.vital.life == 'alive' and actor.cold_state != 'frozen'
      outputs:
        action:
          ref: occurrence
        last_action_ref:
          ref: occurrence
- name: action.observe_resident_tower_bear
  family: action
  formals: {}
  body:
    value:
      schema: c0.value.v1
      bindings: []
      guard:
        require:
        - actor_identity: actor.name == payload.actor
        - awake: actor.vital.life == 'alive' and actor.cold_state != 'frozen'
        - actual_subject: victim.name == payload.victim and actor.site == victim.site
        - known_subject:
            exactly_one:
              collection: actor.known_residents
              as: known
              where: known.name == victim.name and known.site == actor.site
      outputs:
        action:
          ref: occurrence
        last_action_ref:
          ref: occurrence
        person_sighting:
          record:
            type: PersonSighting
            fields:
              subject:
                ref: victim.name
              site:
                ref: victim.site
              cold_state:
                const: immune
              life:
                ref: victim.vital.life
              observation:
                ref: occurrence
        known_residents:
          call:
            ref: perception.refresh_named_person
            args:
              known:
                ref: actor.known_residents
              observer_site:
                ref: actor.site
              subject_name:
                ref: victim.name
              subject_site:
                ref: victim.site
              basis:
                ref: occurrence
- name: action.brand_person_tower_bear
  family: action
  formals:
    damage: int
  body:
    value:
      schema: c0.value.v1
      bindings:
      - name: hit
        stage: effect
        let:
          le:
          - 10
          - die_roll:
              seed:
                ref: scene.die_seed
              sides: 20
      - name: damaged
        stage: effect
        let:
          call:
            ref: combat.contact_vital
            args:
              vital:
                ref: victim.vital
              hit:
                ref: hit
              frozen: false
              weak: true
              damage:
                arg: damage
              basis:
                ref: occurrence
      guard:
        require:
        - active: actor.name == payload.actor and actor.vital.life == 'alive' and actor.cold_state != 'frozen'
        - actual_iron: item.form == 'branding_iron' and item.holder == actor.name
        - observed_contact: actor.person_sighting is not None and actor.person_sighting.subject == payload.victim
            and actor.person_sighting.site == actor.site
        - current_contact: victim.name == payload.victim and victim.name != actor.name and victim.site == actor.site
            and victim.vital.life != 'dead'
        - finite_marks:
            any:
            - lt:
              - count_matching:
                  collection:
                    ref: item.brands
                  as: mark
                  where: true
              - 32
            - exists:
                collection: item.brands
                as: mark
                where: mark.person == payload.victim
      outputs:
        action:
          ref: occurrence
        last_action_ref:
          ref: occurrence
        next_seed:
          die_next_seed:
            ref: scene.die_seed
        vital:
          ref: damaged
        brands:
          if:
            when:
              all:
              - ref: hit
              - none_matching:
                  collection: item.brands
                  as: mark
                  where: mark.person == payload.victim
            then:
              append:
              - ref: item.brands
              - record:
                  type: BrandMark
                  fields:
                    person:
                      ref: payload.victim
                    elemental: null
                    contact:
                      ref: occurrence
            else:
              ref: item.brands
        awake: victim.awake and damaged.life == 'alive'
- name: action.observe_routes
  family: action
  formals: {}
  body:
    value:
      schema: c0.value.v1
      bindings: []
      guard: actor.name == payload.actor and actor.cold_state != 'frozen' and actor.vital.life == 'alive'
      outputs:
        action:
          ref: occurrence
        last_action_ref:
          ref: occurrence
        known_bridge_paths:
          collect_matching:
            collection:
              ref: scene.bridge_paths
            as: path
            where:
              any:
              - path.start == actor.site
              - exists:
                  collection: actor.known_bridge_paths
                  as: known
                  where: known.start == path.start and known.end == path.end and known.base_move_cost == path.base_move_cost
            value:
              ref: path
        known_paths:
          collect_matching:
            collection:
              ref: scene.paths
            as: path
            where:
              any:
              - path.start == actor.site
              - exists:
                  collection: actor.known_paths
                  as: known
                  where: known.start == path.start and known.end == path.end and known.base_move_cost == path.base_move_cost
            value:
              ref: path
        known_crossings:
          collect_matching:
            collection:
              ref: scene.crossings
            as: crossing
            where:
              any:
              - crossing.start == actor.site
              - exists:
                  collection: actor.known_crossings
                  as: known
                  where: known.key == crossing.key
            value:
              record:
                type: KnownCrossing
                fields:
                  key:
                    ref: crossing.key
                  start:
                    ref: crossing.start
                  intended:
                    ref: crossing.intended
                  base_move_cost:
                    ref: crossing.base_move_cost
- name: action.wait
  family: action
  formals: {}
  body:
    value:
      schema: c0.value.v1
      bindings: []
      guard:
        eq:
        - ref: actor.name
        - ref: payload.actor
      outputs:
        action:
          ref: occurrence
        last_action_ref:
          ref: occurrence
