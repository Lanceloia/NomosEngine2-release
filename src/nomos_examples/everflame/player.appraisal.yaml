# Input bindings name payload fields; no private target state is read.
inputs:
  observe_floor_adventurer: &empty {destination: null, targets: [], movement_kind: ""}
  observe_routes_adventurer: *empty
  observe_resident_adventurer: {destination: null, targets: [victim], movement_kind: ""}
  observe_hall_adventurer: *empty
  observe_chandelier_adventurer: {destination: null, targets: [chandelier], movement_kind: ""}
  reload_everflame_adventurer: *empty
  detach_reservoir_adventurer: {destination: null, targets: [reservoir], movement_kind: ""}
  thaw_floor_adventurer: {destination: null, targets: [floor_key], movement_kind: ""}
  thaw_person_adventurer: {destination: null, targets: [victim], movement_kind: ""}
  move_adventurer: &walk {destination: {kind: payload, field: destination}, targets: [], movement_kind: walk}
  move_wall_adventurer: *walk
  bridge_slow_adventurer: {destination: {kind: payload, field: destination}, targets: [], movement_kind: bridge}
  pass_door_adventurer: {destination: {kind: payload, field: destination}, targets: [], movement_kind: door}
  cross_ice_adventurer: {destination: {kind: known_crossing, field: crossing}, targets: [], movement_kind: ice}
