# Actor-local appraisal source. These are judgments, not permission or promised outcomes.
appraisal:
  schema: c0.offer_appraisal.v1
  features:
    floor: 看清地面
    routes: 了解通路
    person: 了解人物
    surroundings: 检查周围
    refill: 补充永焰
    supplies: 准备资源
    clear_path: 清理冰面
    help: 帮助居民
    explore: 进入新区域
    unknown: 探索未知
    ice: 冰面风险
    approach: 接近已知受困者
  defaults: {torch_gain: 0, torch_spend: 0, reservoir_spend: 0, reveals_reservoir: false, movement: false}
  definitions:
    inspect_floor:
      when: not candidate.was_tried and not local.floor_known
      features: {floor: 1}
      values: {}
    inspect_routes:
      when: not candidate.was_tried and not local.routes_known
      features: {routes: 1}
      values: {}
    inspect_person:
      when: not candidate.was_tried and not candidate.targets_detailed
      features: {person: 1}
      values: {}
    inspect_people:
      when: not candidate.was_tried and not local.person_detailed
      features: {person: 1, surroundings: 1}
      values: {}
    inspect_surroundings:
      when: not candidate.was_tried
      features: {surroundings: 1}
      values: {}
    replenish:
      when: local.charge is not None and local.reservoir is not None and local.charge < 5 and local.reservoir > 0
      features: {refill: 1}
      values: {torch_gain: 1, reservoir_spend: 1}
    obtain_supply:
      when: not candidate.was_tried
      features: {supplies: 1}
      values: {reveals_reservoir: true}
    clear_observed_ice:
      when: not candidate.was_tried and candidate.floor_targets and candidate.frozen_count == candidate.target_count
      features: {clear_path: 1}
      values: {torch_spend: 1}
    relieve_observed_freezing:
      when: not candidate.was_tried and candidate.has_targets and candidate.frozen_count == candidate.target_count
      features: {help: candidate.frozen_count}
      values: {torch_spend: 1}
    travel:
      when: >
        not candidate.was_tried and candidate.has_destination
        and (candidate.destination_new or candidate.approaching_need)
        and (not local.floor_frozen or candidate.icy)
      features:
        explore: 1 if candidate.destination_new else 0
        unknown: 1 if candidate.destination_unknown else 0
        ice: 1 if candidate.icy else 0
        approach: 1 if candidate.approaching_need else 0
      values: {movement: true}
  bindings:
    observe_floor_adventurer: inspect_floor
    observe_routes_adventurer: inspect_routes
    observe_resident_adventurer: inspect_person
    observe_hall_adventurer: inspect_people
    observe_chandelier_adventurer: inspect_surroundings
    reload_everflame_adventurer: replenish
    detach_reservoir_adventurer: obtain_supply
    thaw_floor_adventurer: clear_observed_ice
    thaw_person_adventurer: relieve_observed_freezing
    move_adventurer: travel
    move_wall_adventurer: travel
    bridge_slow_adventurer: travel
    pass_door_adventurer: travel
    cross_ice_adventurer: travel
  # Explicit exclusion from delegation, not exclusion from the world.
  manual:
    - explain_balloon_adventurer
    - look_tower_top_adventurer
    - balloon_push_adventurer
    - balloon_push_bridge_adventurer
    - balloon_push_ice_adventurer
    - balloon_push_door_adventurer
    - balloon_flight_adventurer
    - observe_balloon_power_adventurer
    - extract_balloon_power_adventurer
