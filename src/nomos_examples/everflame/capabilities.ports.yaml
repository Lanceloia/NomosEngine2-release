# Adapted from Thawed Through the Everflame (CC BY-SA 4.0).
schema: c0.graph_ports.v1
scene_owner: scene
offer_provider: {name: finite_value, version: '1', limit: 160}
opening_constructions:
  - symbol: prepare_magic_item
    kind: magic_item
    read: []
    fields: [form, label]
    construct: []
candidate_inputs:
  - symbol: escort_reply_audience
    action: escort_reply
    read: [actor.site, recipient.site, recipient.vital.life, recipient.cold_state, scene.escort_reply_log, scene.escort_reply_log.entries]
    fields: {}
  - symbol: queen_escort_reply_audience
    action: queen_escort_reply
    read: [actor.site, recipient.site, recipient.vital.life, recipient.cold_state, scene.escort_reply_log, scene.escort_reply_log.entries]
    fields: {}
  - symbol: fox_local_scent_available
    action: fox_sniff
    read: [scene.scent_steps, scene.palace_event_draws, actor.site, actor.scent_sighting, actor.scent_sighting.step.deposited]
    fields: {ScentStep: [motion, deposited], ActorMotion: [start], PalaceWindowDraw: [kind]}
  - symbol: magic_alpha_show_window
    action: show_magic_alpha
    read: [scene.magic_research, scene.magic_research.selected, scene.magic_research.selected.individual, scene.magic_research.basis, scene.magic_display, scene.magic_display.window, payload.item]
    fields: {}
  - symbol: magic_alpha_withdraw_current
    action: withdraw_magic_alpha
    read: [scene.magic_display, scene.magic_display.holder, actor.name]
    fields: {}
  - symbol: magic_ground_observation_window
    action: observe_ground_magic
    read: [scene.magic_research, scene.magic_research.selected, scene.magic_research.selected.individual, scene.magic_research.basis, actor.resources.study, actor.resources.study.window, actor.resources.study.study, actor.resources.study.display, actor.resources.study.custody_basis, item.released_ref, payload.item]
    fields: {}
  - symbol: magic_ground_study_window
    action: study_ground_magic
    read: [scene.magic_research, scene.magic_research.basis, scene.magic_research.selected, scene.magic_research.selected.individual, actor.resources.study, actor.resources.study.window, actor.resources.study.custody_basis, item.released_ref, payload.item]
    fields: {}
  - symbol: magic_observe_self_current
    action: observe_my_magic
    read: [scene.magic_display, scene.magic_display.item, scene.magic_display.action, scene.magic_display.window, scene.magic_research, scene.magic_research.basis, actor.resources.display, actor.resources.display.action, actor.site, actor.name, actor.vital.life, actor.cold_state, item.holder, payload.item, scene.magic_display.site, item.taken_ref, scene.magic_display.custody_basis]
    fields: {}
  - symbol: magic_study_self_current
    action: study_my_magic
    read: [scene.magic_display, scene.magic_display.item, scene.magic_display.action, scene.magic_display.window, scene.magic_research, scene.magic_research.basis, actor.resources.display, actor.resources.display.action, actor.site, actor.name, actor.vital.life, actor.cold_state, item.holder, payload.item, scene.magic_display.site, item.taken_ref, scene.magic_display.custody_basis]
    fields: {}
  - symbol: magic_show_window
    action: show_magic
    read: [scene.magic_research, scene.magic_research.selected, scene.magic_research.selected.individual, scene.magic_research.basis, scene.magic_display, scene.magic_display.window, payload.item]
    fields: {}
  - symbol: magic_withdraw_current
    action: withdraw_magic
    read: [scene.magic_display, scene.magic_display.holder, actor.name]
    fields: {}
  - symbol: magic_observe_current
    action: observe_magic
    read: [scene.magic_display, scene.magic_display.item, scene.magic_display.action, scene.magic_display.window, scene.magic_research, scene.magic_research.basis, actor.resources.display, actor.resources.display.action, actor.site, holder.name, holder.site, holder.vital.life, holder.cold_state, item.holder, payload.item, scene.magic_display.site, item.taken_ref, scene.magic_display.custody_basis]
    fields: {}
  - symbol: magic_study_current
    action: study_magic
    read: [scene.magic_display, scene.magic_display.item, scene.magic_display.action, scene.magic_display.window, scene.magic_research, scene.magic_research.basis, actor.resources.display, actor.resources.display.action, actor.site, holder.name, holder.site, holder.vital.life, holder.cold_state, item.holder, payload.item, scene.magic_display.site, item.taken_ref, scene.magic_display.custody_basis]
    fields: {}
  - symbol: magic_observe_alpha_current
    action: observe_alpha_magic
    read: [scene.magic_display, scene.magic_display.item, scene.magic_display.action, scene.magic_display.window, scene.magic_research, scene.magic_research.basis, actor.resources.display, actor.resources.display.action, actor.site, holder.name, holder.site, holder.vital.life, holder.awake, item.holder, payload.item, scene.magic_display.site, item.taken_ref, scene.magic_display.custody_basis]
    fields: {}
  - symbol: magic_study_alpha_current
    action: study_alpha_magic
    read: [scene.magic_display, scene.magic_display.item, scene.magic_display.action, scene.magic_display.window, scene.magic_research, scene.magic_research.basis, actor.resources.display, actor.resources.display.action, actor.site, holder.name, holder.site, holder.vital.life, holder.awake, item.holder, payload.item, scene.magic_display.site, item.taken_ref, scene.magic_display.custody_basis]
    fields: {}
  - symbol: brand_elemental_contact
    action: brand_elemental
    read: [actor.site, victim.site, victim.vital.life]
    fields: {}
  - symbol: alpha_report_recipient_here
    action: report_alpha
    read: [actor.site, recipient.site]
    fields: {}
  - symbol: alpha_trade_recipient_here
    action: resolve_alpha
    read: [actor.name, actor.site, recipient.site, recipient.vital.life, recipient.cold_state, item.holder]
    fields: {}
  - symbol: queen_current_presence
    action: observe_resident_queen
    read: [actor.site, victim.site]
    fields: {}
  - symbol: resident_current_presence
    action: observe_resident
    read: [actor.site, victim.site]
    fields: {}
  - symbol: torch_conversation_current
    action: offer_torch
    read: [actor.site, recipient.site, recipient.vital.life, recipient.cold_state]
    fields: {}
  - symbol: queen_unpaid_survivors
    action: queen_pay_reward
    read: [actor.name, actor.site, actor.reward_account.verified, recipient.site, recipient.vital.life, recipient.cold_state, box.holder, box.locked, ritual.name, ritual.site, ritual.vital.life, ritual.rescue_state, ritual.rescue_ref, first.name, first.site, first.vital.life, first.rescue_state, first.rescue_ref, second.name, second.site, second.vital.life, second.rescue_state, second.rescue_ref, wall.name, wall.site, wall.vital.life, wall.rescue_state, wall.rescue_ref, prison_one.name, prison_one.site, prison_one.vital.life, prison_one.rescue_state, prison_one.rescue_ref, prison_two.name, prison_two.site, prison_two.vital.life, prison_two.rescue_state, prison_two.rescue_ref]
    fields: {VerifiedSurvivor: [name, payment]}
  - symbol: queen_new_survivors
    action: queen_verify_survivors
    read: [actor.site, actor.reward_account.verified, ritual.name, ritual.site, ritual.vital.life, ritual.rescue_state, ritual.rescue_ref, first.name, first.site, first.vital.life, first.rescue_state, first.rescue_ref, second.name, second.site, second.vital.life, second.rescue_state, second.rescue_ref, wall.name, wall.site, wall.vital.life, wall.rescue_state, wall.rescue_ref, prison_one.name, prison_one.site, prison_one.vital.life, prison_one.rescue_state, prison_one.rescue_ref, prison_two.name, prison_two.site, prison_two.vital.life, prison_two.rescue_state, prison_two.rescue_ref]
    fields: {VerifiedSurvivor: [name]}
  - symbol: queen_local_ground
    action: queen_move
    read: [scene.balloon_seats, scene.floors, scene.stair_paths, scene.unclimbable_stairs, actor.name, actor.site, payload.destination]
    fields: {BalloonSeat: [passenger], FloorRegion: [sites, frozen], Path: [start, end]}
  - symbol: queen_cross_unboarded
    action: queen_cross_ice
    read: [scene.balloon_seats, actor.name]
    fields: {BalloonSeat: [passenger]}
  - symbol: queen_bridge_ground
    action: queen_bridge_slow
    read: [scene.balloon_seats, scene.floors, actor.name, actor.site, payload.destination]
    fields: {BalloonSeat: [passenger], FloorRegion: [sites, frozen]}
  - symbol: queen_door_unboarded
    action: queen_pass_door
    read: [scene.balloon_seats, actor.name]
    fields: {BalloonSeat: [passenger]}
  - symbol: queen_balloon_control
    action: balloon_control_queen
    read: [scene.balloon_seats, actor.name, payload.balloon, payload.operation, balloon.inflated]
    fields: {BalloonSeat: [vehicle, passenger]}
  - symbol: alpha_recipient_here
    action: propose_alpha
    read: [actor.site, recipient.site]
    fields: {}
  - symbol: elemental_route
    action: elemental_advance
    read: [scene.paths, scene.floors, scene.stair_paths, scene.unclimbable_stairs, actor.site, actor.known_destination]
    fields: {Path: [start, end, base_move_cost], FloorRegion: [sites, frozen]}
  - symbol: elemental_breath_aim
    action: elemental_breath
    read: [scene.breath_zones, actor.site, actor.target_sighting, actor.target_sighting.origin, actor.target_sighting.site, subject.site, payload.area]
    fields: {FireballZone: [origin, aim]}
  - symbol: fireball_aim
    action: fireball
    read: [scene.fireball_zones, actor.site, payload.area]
    fields: {FireballZone: [origin, aim]}
  - symbol: guide_light_here
    action: wait_near_guide
    read: [actor.site, guide.site, guide.name, torch.holder, torch.charges]
    fields: {}
  - symbol: guard_local_ground
    action: guard_move
    read: [scene.floors, scene.stair_paths, scene.unclimbable_stairs, actor.site, payload.destination]
    fields: {FloorRegion: [sites, frozen], Path: [start, end]}
  - symbol: bear_local_ground
    action: bear_move
    read: [scene.floors, scene.stair_paths, scene.unclimbable_stairs, actor.site, payload.destination]
    fields: {FloorRegion: [sites, frozen], Path: [start, end]}
  - symbol: prison_attempt_ground
    action: try_prison_line
    read: [scene.floors, scene.stair_paths, scene.unclimbable_stairs, actor.site, payload.destination]
    fields: {FloorRegion: [sites, frozen], Path: [start, end]}
  - symbol: person_local_ground
    action: move
    read: [scene.floors, scene.stair_paths, scene.unclimbable_stairs, actor.site, payload.destination]
    fields: {FloorRegion: [sites, frozen], Path: [start, end]}
  - symbol: bridge_local_ground
    action: bridge_slow
    read: [scene.floors, actor.site, actor.rescue_state, payload.destination]
    fields: {FloorRegion: [sites, frozen]}
  - symbol: light_approach_ground
    action: approach_bokold_light
    read: [scene.floors, scene.stair_paths, scene.unclimbable_stairs, actor.site, payload.destination]
    fields: {FloorRegion: [sites, frozen], Path: [start, end]}
participant_groups:
- name: reward_survivors
  members:
  - first
  - prison_one
  - prison_two
  - ritual
  - second
  - wall
  selector: closed_domain
  state: Person
  read:
  - name
  - site
  - vital.life
  - rescue_state
  - rescue_ref
  effects: {}
actions:
  - symbol: escort_reply
    actor: ritual_resident
    payload: EscortReplyAttempt
    envelope: ActionEnvelope
    actor_identity_field: name
    payload_actor_field: actor
    participants: &escort_reply_participants
    - {name: recipient, selector: closed_domain, state: Person, payload_field: recipient, write: false}
    effects:
      scene: {escort_reply_log: reply_log}
      actor: [conversations, last_action_ref]
      recipient: []
    envelope_fields: [action]
    schedule: null
    value:
      read:
      - actor.name
      - actor.site
      - actor.vital.life
      - actor.cold_state
      - actor.current_movement_speed
      - actor.escort_heard_ref
      - actor.escort_utterance_ref
      - actor.escort_speaker
      - actor.escort_destination
      - actor.conversations
      - actor.conversations.escort_replied_invitations
      - actor.prison_access.line
      - actor.prison_access.line.guardian.site
      - actor.prison_access.line.guardian.present
      - recipient.name
      - recipient.site
      - recipient.vital.life
      - recipient.cold_state
      - payload.actor
      - payload.recipient
      - payload.status
      - scene.escort_reply_log
      - scene.escort_reply_log.entries
      fields: {}
      write_paths: [actor.conversations, actor.conversations.escort_reply, actor.conversations.escort_replied_invitations, actor.last_action_ref, scene.escort_reply_log]
      construct: [EscortReply, EscortReplyLog]
      collections: {}
  - symbol: queen_escort_reply
    actor: emma
    payload: EscortReplyAttempt
    envelope: ActionEnvelope
    actor_identity_field: name
    payload_actor_field: actor
    participants: *escort_reply_participants
    effects:
      scene: {escort_reply_log: reply_log}
      actor: [escort_reply, escort_replied_invitations, last_action_ref]
      recipient: []
    envelope_fields: [action]
    schedule: null
    value:
      read: [actor.name, actor.site, actor.vital.life, actor.cold_state, actor.current_movement_speed, actor.attending, actor.escort_heard_ref, actor.escort_utterance_ref, actor.escort_speaker, actor.escort_destination, actor.escort_replied_invitations, recipient.name, recipient.site, recipient.vital.life, recipient.cold_state, payload.actor, payload.recipient, payload.status, scene.escort_reply_log, scene.escort_reply_log.entries]
      fields: {}
      write_paths: [actor.escort_reply, actor.escort_replied_invitations, actor.last_action_ref, scene.escort_reply_log]
      construct: [EscortReply, EscortReplyLog]
      collections: {}
  - symbol: queen_verify_survivors
    actor: emma
    payload: VerifySurvivorsAttempt
    envelope: ActionEnvelope
    actor_identity_field: name
    payload_actor_field: actor
    participants: []
    effects: {scene: [], actor: [reward_account, last_action_ref]}
    envelope_fields:
    - action
    schedule: null
    value:
      read:
      - actor.name
      - actor.site
      - actor.vital.life
      - actor.cold_state
      - actor.rescue_state
      - actor.rescue_ref
      - actor.reward_account.verified
      - payload.actor
      - payload.ritual
      - payload.first
      - payload.second
      - payload.wall
      - payload.prison_one
      - payload.prison_two
      fields:
        VerifiedSurvivor:
        - name
        - site
        - observation
        - payment
        RewardReceipt:
        - resident
        - recipient
        - box
        - verification
        - action
        - gold
      write_paths:
      - actor.reward_account
      - actor.last_action_ref
      construct:
      - RewardAccount
      - VerifiedSurvivor
      collections: {}
    participant_groups:
    - reward_survivors
  - symbol: queen_pay_reward
    actor: emma
    payload: PayRewardAttempt
    envelope: ActionEnvelope
    actor_identity_field: name
    payload_actor_field: actor
    participants:
    - name: box
      selector: individual
      state: RewardBox
      payload_field: box
      write: true
    - name: recipient
      selector: closed_domain
      state: Person
      payload_field: recipient
      write: true
    effects:
      scene: []
      actor:
      - reward_account
      - last_action_ref
      recipient: {gold: received_gold}
      box: {gold: remaining_gold, locked: relocked}
    envelope_fields:
    - action
    schedule: null
    value:
      read:
      - actor.name
      - actor.site
      - actor.vital.life
      - actor.cold_state
      - actor.rescue_state
      - actor.rescue_ref
      - actor.reward_account.verified
      - payload.actor
      - payload.recipient
      - payload.box
      - recipient.name
      - recipient.site
      - recipient.vital.life
      - recipient.cold_state
      - recipient.gold
      - box.holder
      - box.locked
      - box.gold
      fields:
        VerifiedSurvivor:
        - name
        - site
        - observation
        - payment
        RewardReceipt:
        - resident
        - recipient
        - box
        - verification
        - action
        - gold
      write_paths:
      - actor.reward_account
      - actor.last_action_ref
      - recipient.gold
      - box.gold
      - box.locked
      construct:
      - RewardAccount
      - RewardReceipt
      - VerifiedSurvivor
      collections: {}
    participant_groups:
    - reward_survivors
  - symbol: queen_observe_routes
    actor: emma
    payload: WaitAttempt
    envelope: ActionEnvelope
    actor_identity_field: name
    payload_actor_field: actor
    effects:
      scene: []
      actor:
      - route_observation
      - known_paths
      - known_crossings
      - known_bridge_paths
      - last_action_ref
    envelope_fields:
    - action
    schedule: null
    value:
      read:
      - scene.paths
      - scene.crossings
      - scene.bridge_paths
      - actor.name
      - actor.site
      - actor.cold_state
      - actor.vital.life
      - actor.known_paths
      - actor.known_crossings
      - actor.known_bridge_paths
      - payload.actor
      fields:
        Path:
        - start
        - end
        - base_move_cost
        RegionCrossing:
        - key
        - start
        - intended
        - base_move_cost
        KnownCrossing:
        - key
        - start
        - intended
        - base_move_cost
      write_paths:
      - actor.route_observation
      - actor.known_paths
      - actor.known_crossings
      - actor.known_bridge_paths
      - actor.last_action_ref
      construct:
      - RouteObservation
      - KnownCrossing
      collections: {}
  - symbol: queen_move
    actor: emma
    payload: MoveAttempt
    envelope: ActionEnvelope
    actor_identity_field: name
    payload_actor_field: actor
    effects:
      scene:
      - actor_motion
      actor:
      - site
      - known_sites
      - last_action_ref
    envelope_fields:
    - action
    schedule: null
    value:
      read:
      - scene.balloon_seats
      - scene.paths
      - scene.floors
      - scene.stair_paths
      - scene.unclimbable_stairs
      - actor.name
      - actor.site
      - actor.known_sites
      - actor.known_paths
      - actor.max_movement_speed
      - actor.current_movement_speed
      - payload.actor
      - payload.destination
      - payload.base_move_cost
      - actor.cold_state
      - actor.vital.life
      fields:
        BalloonSeat:
        - passenger
        Path:
        - start
        - end
        - base_move_cost
        KnownSite:
        - site
        FloorRegion:
        - sites
        - frozen
      write_paths:
      - scene.actor_motion
      - actor.site
      - actor.known_sites
      - actor.last_action_ref
      construct:
      - KnownSite
      - ActorMotion
      collections: {}
  - symbol: queen_cross_ice
    actor: emma
    payload: CrossAttempt
    envelope: ActionEnvelope
    actor_identity_field: name
    payload_actor_field: actor
    effects:
      scene:
        die_seed: next_seed
        actor_motion: actor_motion
      actor:
        site: site
        known_sites: known_sites
        known_crossings: known_crossings
        last_action_ref: last_action_ref
        last_cross_roll: roll
        last_cross_ref: last_cross_ref
    envelope_fields:
    - action
    schedule: null
    value:
      read:
      - scene.balloon_seats
      - scene.crossings
      - scene.floors
      - scene.die_seed
      - actor.name
      - actor.site
      - actor.known_sites
      - actor.known_crossings
      - actor.balance_bonus
      - actor.max_movement_speed
      - actor.current_movement_speed
      - payload.actor
      - payload.crossing
      - payload.base_move_cost
      fields:
        BalloonSeat:
        - passenger
        FloorRegion:
        - key
        - sites
        - frozen
        RegionCrossing:
        - key
        - start
        - intended
        - collision
        - floor_key
        - base_move_cost
        - difficulty
        - die_sides
        - success_followup
        - failure_followup
        KnownCrossing:
        - key
        - start
        - intended
        - base_move_cost
        KnownSite:
        - site
        MovementResolution:
        - site
        - succeeded
        - roll
        - next_seed
      write_paths:
      - scene.die_seed
      - actor.site
      - actor.known_sites
      - actor.known_crossings
      - actor.last_action_ref
      - actor.last_cross_roll
      - actor.last_cross_ref
      - scene.actor_motion
      construct:
      - KnownSite
      - KnownCrossing
      - MovementResolution
      - ActorMotion
      collections:
        scene.crossings: key
        scene.floors: key
  - symbol: queen_bridge_slow
    actor: emma
    payload: MoveAttempt
    envelope: ActionEnvelope
    actor_identity_field: name
    payload_actor_field: actor
    effects:
      scene:
        actor_motion: actor_motion
      actor:
      - site
      - known_sites
      - last_action_ref
    envelope_fields:
    - action
    schedule: null
    value:
      read:
      - scene.balloon_seats
      - scene.bridge_paths
      - scene.floors
      - actor.name
      - actor.site
      - actor.rescue_state
      - actor.cold_state
      - actor.vital.life
      - actor.known_bridge_paths
      - actor.known_sites
      - actor.max_movement_speed
      - actor.current_movement_speed
      - payload.actor
      - payload.destination
      - payload.base_move_cost
      fields:
        BalloonSeat:
        - passenger
        Path:
        - start
        - end
        - base_move_cost
        FloorRegion:
        - sites
        - frozen
        KnownSite:
        - site
      write_paths:
      - actor.site
      - actor.known_sites
      - actor.last_action_ref
      - scene.actor_motion
      construct:
      - KnownSite
      - ActorMotion
      collections: {}
  - symbol: queen_pass_door
    actor: emma
    payload: PassDoorAttempt
    envelope: ActionEnvelope
    actor_identity_field: name
    payload_actor_field: actor
    participants:
    - name: door
      selector: individual
      state: PassageDoor
      payload_field: door
      write: false
    effects:
      scene:
        actor_motion: actor_motion
      actor:
      - site
      - known_sites
      - last_action_ref
      door: []
    envelope_fields:
    - action
    schedule: null
    value:
      read:
      - scene.balloon_seats
      - scene.sites
      - scene.floors
      - scene.stair_paths
      - scene.unclimbable_stairs
      - actor.name
      - actor.site
      - actor.vital.life
      - actor.cold_state
      - actor.known_sites
      - actor.max_movement_speed
      - actor.current_movement_speed
      - payload.actor
      - payload.destination
      - payload.base_move_cost
      - door.front
      - door.back
      - door.frozen
      - door.opened
      - door.base_move_cost
      fields:
        BalloonSeat:
        - passenger
        KnownSite:
        - site
        FloorRegion:
        - key
        - sites
        - frozen
        Path:
        - start
        - end
      write_paths:
      - actor.site
      - actor.known_sites
      - actor.last_action_ref
      - scene.actor_motion
      construct:
      - KnownSite
      - ActorMotion
      collections: {}
  - symbol: look_tower_top
    actor: adventurer
    payload: ObservePersonAttempt
    envelope: ActionEnvelope
    actor_identity_field: name
    payload_actor_field: actor
    participants:
    - {name: victim, selector: closed_domain, state: Queen, payload_field: victim, write: false}
    effects: {scene: [], actor: [known_residents, last_action_ref], victim: []}
    envelope_fields: [action]
    schedule: null
    value:
