      - {name: mid_sites, type: {tuple: {item: {str: [1, 48]}, max: 16}}}
      - {name: far_sites, type: {tuple: {item: {str: [1, 48]}, max: 16}}}
    invariant:
      all:
        - none_matching:
            collection: {ref: state.near_sites}
            as: near_site
            where:
              any:
                - not:
                    exactly_one:
                      collection: state.near_sites
                      as: near_copy
                      where:
                        eq:
                        - ref: near_copy
                        - ref: near_site
                - none_matching:
                    collection: state.mid_sites
                    as: mid_site
                    where:
                      eq:
                      - ref: mid_site
                      - ref: near_site
        - none_matching:
            collection: {ref: state.mid_sites}
            as: mid_site
            where:
              any:
                - not:
                    exactly_one:
                      collection: state.mid_sites
                      as: mid_copy
                      where:
                        eq:
                        - ref: mid_copy
                        - ref: mid_site
                - none_matching:
                    collection: state.far_sites
                    as: far_site
                    where:
                      eq:
                      - ref: far_site
                      - ref: mid_site
        - none_matching:
            collection: {ref: state.far_sites}
            as: far_site
            where:
              not:
                exactly_one:
                  collection: state.far_sites
                  as: far_copy
                  where:
                    eq:
                    - ref: far_copy
                    - ref: far_site
