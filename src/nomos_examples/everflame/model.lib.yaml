# Adapted from Thawed Through the Everflame (CC BY-SA 4.0).
schema: c0.nominal_lib.v1
pure_definitions:
  - name: escort.reply_score
    parameters: {status: str, inclined: bool, pending: bool}
    result: int
    stage: admission
    body:
      if:
        when: pending and (status == 'unable_now' or (inclined and status == 'ready_now') or (not inclined and status == 'not_ready_now'))
        then: 11
        else: 0
  - name: escort.reply_pending
    parameters: {hearing: {optional: occurrence_ref}, invitation: {optional: occurrence_ref}, speaker: {optional: str}, destination: {optional: str}, answered: {optional: {tuple: occurrence_ref}}}
    result: bool
    stage: admission
    body:
      all:
      - hearing is not None and invitation is not None and speaker is not None and destination is not None
      - any:
        - answered is None
        - all:
          - answered is not None
          - none_matching: {collection: {ref: answered}, as: previous, where: previous == invitation}
  - name: escort.can_attempt_now
    parameters: {speed: int, site: str, blocked: bool}
    result: bool
    stage: admission
    body: speed > 0 and site != 'treasure_ice' and site != 'captive_cell' and not blocked
  - name: perception.visible_site
    parameters: {observer_site: str, subject_site: str}
    result: bool
    stage: admission
    body:
      any:
        - observer_site == subject_site
        - {call: {ref: perception.open_neighbor, args: {observer_site: {ref: observer_site}, subject_site: {ref: subject_site}}}}
  - name: perception.open_neighbor
    parameters: {observer_site: str, subject_site: str}
    result: bool
    stage: admission
    # Finite authored sightlines; passage permission is a separate rule.
    body:
      any:
        - observer_site == 'ballroom_entrance' and subject_site == 'ballroom_chandelier_reach'
        - observer_site == 'ballroom_chandelier_reach' and subject_site == 'ballroom_entrance'
        - observer_site == 'ballroom_chandelier_reach' and subject_site == 'ballroom_chandelier_far_wall'
        - observer_site == 'ballroom_chandelier_far_wall' and subject_site == 'ballroom_chandelier_reach'
        - observer_site == 'halls_ballroom_door' and subject_site == 'halls_bridge_door'
        - observer_site == 'halls_bridge_door' and subject_site == 'halls_ballroom_door'
        - observer_site == 'ritual_passage_entry' and subject_site == 'ritual_threshold'
        - observer_site == 'ritual_threshold' and subject_site == 'ritual_passage_entry'
        - observer_site == 'ritual_threshold' and subject_site == 'ritual_ring'
        - observer_site == 'ritual_ring' and subject_site == 'ritual_threshold'
        - observer_site == 'bridge_palace_landing' and subject_site == 'bridge_midspan'
        - observer_site == 'bridge_midspan' and subject_site == 'bridge_palace_landing'
        - observer_site == 'bridge_midspan' and subject_site == 'palace_exit'
        - observer_site == 'palace_exit' and subject_site == 'bridge_midspan'
  - name: conversation.decision
    parameters: {request: occurrence_ref, accepted: bool, action: occurrence_ref}
    result: GuestDecision
    stage: effect
    body:
      record:
        type: GuestDecision
        fields: {request: {ref: request}, accepted: {ref: accepted}, action: {ref: action}}
  - name: perception.update_person_in_place
    parameters: {known_people: {tuple: KnownResident}, observer_site: str, subject_name: str, subject_site: str, basis: occurrence_ref}
    result: {tuple: KnownResident}
    stage: effect
    body:
      if:
        when: observer_site == subject_site
        then:
          if:
            when: {none_matching: {collection: {ref: known_people}, as: known, where: known.name == subject_name}}
            then:
              append:
                - {ref: known_people}
                - {record: {type: KnownResident, fields: {name: {ref: subject_name}, site: {ref: subject_site}, observation: {ref: basis}}}}
            else:
              collect_matching:
                collection: {ref: known_people}
                as: known
                where: true
                value:
                  if:
                    when: known.name == subject_name
                    then: {record: {type: KnownResident, fields: {name: {ref: subject_name}, site: {ref: subject_site}, observation: {ref: basis}}}}
                    else: {ref: known}
        else: {ref: known_people}
  - name: everflame.known_self_protection
    parameters: {coverage: {tuple: Coverage}, charges: int, destination: str}
    result: str
    stage: admission
    body:
      if:
        when: charges == 0
        then: {const: exposed}
        else:
          if:
            when: {exists: {collection: {ref: coverage}, as: known_area, where: known_area.origin == destination}}
            then:
              if:
                when:
                  lt:
                    - 0
                    - {call: {ref: everflame.covered_count, args: {coverage: {ref: coverage}, origin: {ref: destination}, destination: {ref: destination}, charges: {ref: charges}}}}
                then: {const: protected}
                else: {const: exposed}
            else: {const: unknown}
  - name: treasure.chest_sighting
    parameters: {chest: individual_ref, site: str, opened: bool, gold: {optional: int}, basis: occurrence_ref}
    result: ChestSighting
    stage: effect
    body:
      record:
        type: ChestSighting
        fields: {chest: {ref: chest}, site: {ref: site}, opened: {ref: opened}, gold: {ref: gold}, basis: {ref: basis}}
  - name: transport.boarded_on
    parameters: {seats: {tuple: BalloonSeat}, person: str, vehicle: individual_ref}
    result: bool
    stage: admission
    body:
      exactly_one: {collection: seats, as: seat, where: seat.passenger == person and seat.vehicle == vehicle}
  - name: movement.has_declared_site
    parameters: {sites: {tuple: str}, site: str}
    result: bool
    stage: admission
    body:
      exactly_one: {collection: sites, as: declared, where: declared == site}
  - name: movement.has_path
    parameters: {paths: {tuple: Path}, start: str, end: str, cost: int}
    result: bool
    stage: admission
    body:
      exists:
        collection: paths
        as: path
        where: path.start == start and path.end == end and path.base_move_cost == cost
  - name: movement.knows_crossing
    parameters: {known: {tuple: KnownCrossing}, key: str, start: str, intended: str, cost: int}
    result: bool
    stage: admission
    body:
      exists:
        collection: known
        as: entry
        where: entry.key == key and entry.start == start and entry.intended == intended and entry.base_move_cost == cost
  - name: transport.vehicle_unoccupied
    parameters: {seats: {tuple: BalloonSeat}, vehicle: individual_ref}
    result: bool
    stage: admission
    body:
      none_matching: {collection: seats, as: seat, where: seat.vehicle == vehicle}
  - name: movement.endpoints_clear_of_frozen_floor
    parameters: {floors: {tuple: FloorRegion}, start: str, end: str}
    result: bool
    stage: admission
    body:
      none_matching:
        collection: floors
        as: floor
        where:
          all:
            - floor.frozen
            - exists: {collection: floor.sites, as: site, where: site == start or site == end}
  - name: movement.has_unique_path
    parameters: {paths: {tuple: Path}, start: str, end: str, cost: int}
    result: bool
    stage: admission
    body:
      exactly_one:
        collection: paths
        as: path
        where: path.start == start and path.end == end and path.base_move_cost == cost
  - name: movement.no_known_exit
    parameters: {paths: {tuple: Path}, crossings: {tuple: KnownCrossing}, bridges: {tuple: Path}, site: str}
    result: bool
    stage: admission
    body:
      all:
        - none_matching: {collection: {ref: paths}, as: path, where: path.start == site}
        - none_matching: {collection: {ref: crossings}, as: crossing, where: crossing.start == site}
        - none_matching: {collection: {ref: bridges}, as: bridge, where: bridge.start == site}
  - name: movement.remember_crossing
    parameters: {known: {tuple: KnownCrossing}, followup: {optional: RegionCrossing}}
    result: {tuple: KnownCrossing}
    stage: effect
    body:
      if:
        when: followup is not None
        then:
          if:
            when:
              none_matching: {collection: {ref: known}, as: previous, where: previous.key == followup.key}
            then:
              append:
              - {ref: known}
              - record:
                  type: KnownCrossing
                  fields: {key: {ref: followup.key}, start: {ref: followup.start}, intended: {ref: followup.intended}, base_move_cost: {ref: followup.base_move_cost}}
            else: {ref: known}
        else: {ref: known}
  - name: movement.remember_site
    parameters: {known_sites: {tuple: KnownSite}, destination: str}
    result: {tuple: KnownSite}
    stage: effect
    body:
      if:
        when:
          none_matching: {collection: {ref: known_sites}, as: known, where: known.site == destination}
        then:
          append:
          - {ref: known_sites}
          - {record: {type: KnownSite, fields: {site: {ref: destination}}}}
        else: {ref: known_sites}
  - name: reward.unpaid_survivor
    parameters: {known: {tuple: VerifiedSurvivor}, observer_site: str, name: str, site: str, life: str, rescue: str, has_rescue: bool}
    result: bool
    stage: admission
    body:
      all:
        - "observer_site == 'palace_exit' and site == observer_site and life == 'alive' and rescue == 'safe' and has_rescue"
        - exactly_one:
            collection: known
            as: previous
            where: previous.name == name and previous.payment is None
  - name: reward.new_survivor
    parameters: {known: {tuple: VerifiedSurvivor}, observer_site: str, name: str, site: str, life: str, rescue: str, has_rescue: bool}
    result: bool
    stage: admission
    body:
      all:
        - "observer_site == 'palace_exit' and site == observer_site and life == 'alive' and rescue == 'safe' and has_rescue"
        - none_matching: {collection: {ref: known}, as: previous, where: "previous.name == name"}
  - name: reward.present_survivor
    parameters:
      observer_site: str
      site: str
      life: str
      rescue: str
      has_rescue: bool
    result: bool
    stage: admission
    body: observer_site == 'palace_exit' and site == observer_site and life == 'alive'
      and rescue == 'safe' and has_rescue
  - name: transport.unboarded
    parameters: {seats: {tuple: BalloonSeat}, person: str}
    result: bool
    stage: admission
    body:
      none_matching:
        collection: {ref: seats}
        as: seat
        where: "seat.passenger == person"
  - name: combat.contact_vital
    parameters: {vital: Vital, hit: bool, frozen: bool, weak: bool, damage: int, basis: occurrence_ref}
    result: Vital
    stage: effect
    body:
      if:
        when: hit and vital.life != 'dead'
        then:
          call:
            ref: vital.damage
            args:
              vital: {ref: vital}
              amount: {add: [{ref: damage}, {if: {when: {ref: weak}, then: 1, else: 0}}]}
              frozen: {ref: frozen}
              monitored: false
              basis: {ref: basis}
        else: {ref: vital}
  - name: perception.observe_named_person
    parameters:
      known: {tuple: KnownResident}
      observer_site: str
      subject_name: str
      subject_site: str
      basis: occurrence_ref
    result: {tuple: KnownResident}
    stage: effect
    body:
      if:
        when: observer_site == subject_site
        then:
          append:
          - {collect_matching: {collection: {ref: known}, as: previous, where: "previous.name != subject_name", value: {ref: previous}}}
          - {record: {type: KnownResident, fields: {name: {ref: subject_name}, site: {ref: subject_site}, observation: {ref: basis}}}}
        else: {ref: known}
  - name: perception.refresh_named_person
    parameters:
      known: {tuple: KnownResident}
      observer_site: str
      subject_name: str
      subject_site: str
      basis: occurrence_ref
    result: {tuple: KnownResident}
    stage: effect
    body:
      let:
        name: others
        value:
          collect_matching:
            collection: {ref: known}
            as: previous
            where: previous.name != subject_name
            value: {ref: previous}
        in:
          call:
            ref: perception.observe_named_person
            args:
              known: {ref: others}
              observer_site: {ref: observer_site}
              subject_name: {ref: subject_name}
              subject_site: {ref: subject_site}
              basis: {ref: basis}
  - name: combat.fireball_vital
    parameters:
      zones:
        tuple: FireballZone
      origin: str
      aim: str
      site: str
      vital: Vital
      frozen: bool
      monitored: bool
      weak: bool
      rolled: int
      damage: int
      basis: occurrence_ref
    result: Vital
    stage: effect
    body:
      if:
        when:
          all:
          - rolled >= 10
          - vital.life != 'dead'
          - exists:
              collection: zones
              as: zone
              where:
                all:
                - zone.origin == origin
                - zone.aim == aim
                - exists:
                    collection: zone.affected_sites
                    as: affected
                    where: affected == site
        then:
          call:
            ref: vital.damage
            args:
              vital:
                ref: vital
              amount:
                add:
                - ref: damage
                - if:
                    when:
                      ref: weak
                    then: 1
                    else: 0
              frozen:
                ref: frozen
              monitored:
                ref: monitored
              basis:
                ref: basis
        else:
          ref: vital
  - name: movement.action_cost
    parameters: {base_cost: int, maximum_speed: int, current_speed: int}
    result: int
    stage: admission
    body:
      ceil_div:
        - {mul: [{ref: base_cost}, {ref: maximum_speed}]}
        - {ref: current_speed}
  - name: treasure.collection_amount
    parameters: {available: int}
    result: int
    stage: admission
    body: {ref: available}
  - name: movement.ordinary_floor_passable
    parameters: {floors: {tuple: FloorRegion}, stairs: {tuple: Path}, unclimbable_stairs: {tuple: Path}, start: str, destination: str}
    result: bool
    stage: admission
    body:
      all:
        - none_matching:
            collection: {ref: unclimbable_stairs}
            as: stair
            where: stair.start == start and stair.end == destination
        - none_matching:
            collection: {ref: floors}
            as: floor
            where:
              all:
                - floor.frozen
                - any:
                    - all:
                        - {exactly_one: {collection: floor.sites, as: start_site, where: start_site == start}}
                        - {exactly_one: {collection: floor.sites, as: end_site, where: end_site == destination}}
                    - all:
                        - {exists: {collection: stairs, as: stair, where: stair.start == start and stair.end == destination}}
                        - {exists: {collection: floor.sites, as: stair_site, where: stair_site == start or stair_site == destination}}
  - name: movement.resolve
    parameters: {frozen: bool, seed: int, route: RegionCrossing, balance_bonus: int}
    result: MovementResolution
    stage: effect
    body:
      let:
        name: rolled
        value:
          if:
            when: {ref: frozen}
            then: {die_roll: {seed: {ref: seed}, sides: {ref: route.die_sides}}}
            else: null
        in:
          let:
            name: succeeded
            value:
              if:
                when: {not_none: {ref: rolled}}
                then: {le: [{ref: route.difficulty}, {add: [{ref: rolled}, {ref: balance_bonus}]}]}
                else: true
            in:
              record:
                type: MovementResolution
                fields:
                  site: {if: {when: {ref: succeeded}, then: {ref: route.intended}, else: {ref: route.collision}}}
                  succeeded: {ref: succeeded}
                  roll: {ref: rolled}
                  next_seed: {if: {when: {ref: frozen}, then: {die_next_seed: {ref: seed}}, else: {ref: seed}}}
  - name: everflame.holder_site
    parameters:
      holder: str
      adventurer_site: str
      ritual_site: str
      huddled_one_site: str
      huddled_two_site: str
      wall_resident_site: str
      bokold_one_site: str
      bokold_two_site: str
      prison_resident_one_site: str
      prison_resident_two_site: str
    result: str
    stage: admission
    body:
      if:
        when: holder == 'adventurer'
        then: {ref: adventurer_site}
        else:
          if:
            when: holder == 'ritual_resident'
            then: {ref: ritual_site}
            else:
              if:
                when: holder == 'huddled_one'
                then: {ref: huddled_one_site}
                else:
                  if:
                    when: holder == 'huddled_two'
                    then: {ref: huddled_two_site}
                    else:
                      if:
                        when: holder == 'bokold_one'
                        then: {ref: bokold_one_site}
                        else:
                          if:
                            when: holder == 'bokold_two'
                            then: {ref: bokold_two_site}
                            else:
                              if:
                                when: holder == 'prison_resident_one'
                                then: {ref: prison_resident_one_site}
                                else:
                                  if:
                                    when: holder == 'prison_resident_two'
                                    then: {ref: prison_resident_two_site}
                                    else: {ref: wall_resident_site}
  - name: everflame.covered_count
    parameters:
      coverage: {tuple: Coverage}
      origin: str
      destination: str
      charges: int
    result: int
    stage: admission
    body:
      count_matching:
        collection: {ref: coverage}
        as: area
        where:
          all:
            - area.origin == origin
            - charges > 0
            - exists:
                collection:
                  if:
                    when: charges <= 2
                    then:
                      ref: area.near_sites
                    else:
                      if:
                        when: charges <= 4
                        then:
                          ref: area.mid_sites
                        else:
                          ref: area.far_sites
                as: covered_site
                where: covered_site == destination
  - name: rescue.cold_step
    parameters: {vital: Vital, frozen_after: bool, monitored: bool, basis: occurrence_ref}
    result: Vital
    stage: effect
    body:
      record:
        type: Vital
        fields:
          life: {ref: vital.life}
          endurance: {ref: vital.endurance}
          max_endurance: {ref: vital.max_endurance}
          change_ref: {ref: vital.change_ref}
          death_ref: {ref: vital.death_ref}
          rescue_episode:
            if:
              when: monitored and vital.life != 'dead' and (frozen_after or vital.endurance == 0)
              then:
                if:
                  when: vital.rescue_episode is not None
                  then:
                    record:
                      type: RescueEpisode
                      fields:
                        start_ref: {ref: vital.rescue_episode.start_ref}
                        elapsed_cold: {if: {when: vital.rescue_episode.elapsed_cold < 5, then: {add: [{ref: vital.rescue_episode.elapsed_cold}, 1]}, else: 5}}
                        last_cold_ref: {ref: basis}
                  else: {record: {type: RescueEpisode, fields: {start_ref: {ref: basis}, elapsed_cold: 0, last_cold_ref: null}}}
              else: null
  - name: vital.thaw
    parameters: {vital: Vital}
    result: Vital
    stage: effect
    body:
      record:
        type: Vital
        fields:
          life: {ref: vital.life}
          endurance: {ref: vital.endurance}
          max_endurance: {ref: vital.max_endurance}
          change_ref: {ref: vital.change_ref}
          death_ref: {ref: vital.death_ref}
          rescue_episode: {if: {when: vital.life == 'alive' and vital.endurance > 0, then: null, else: {ref: vital.rescue_episode}}}
  - name: vital.damage
    parameters:
      vital: Vital
      amount: int
      frozen: bool
      monitored: bool
      basis: occurrence_ref
    result: Vital
    stage: effect
    body:
      record:
        type: Vital
        fields:
          life:
            if:
              when: vital.endurance == 0
              then:
                const: dead
              else:
                if:
                  when: vital.endurance <= amount
                  then:
                    const: incapacitated
                  else:
                    const: alive
          endurance:
            if:
              when: vital.endurance <= amount
              then: 0
              else:
                sub:
                - ref: vital.endurance
                - ref: amount
          max_endurance:
            ref: vital.max_endurance
          change_ref:
            ref: basis
          death_ref:
            if:
              when: vital.endurance == 0
              then:
                ref: basis
              else: null
          rescue_episode:
            if:
              when: vital.endurance == 0
              then: null
              else:
                if:
                  when: monitored and (frozen or vital.endurance <= amount)
                  then:
                    if:
                      when: vital.rescue_episode is not None
                      then:
                        ref: vital.rescue_episode
                      else:
                        record:
                          type: RescueEpisode
                          fields:
                            start_ref:
                              ref: basis
                            elapsed_cold: 0
                            last_cold_ref: null
                  else: null
appraisal_definitions:
  - name: queen.local_wait
    formals: {}
    entries:
    - escort_reply
    - verify_survivors
    - pay_reward
    - wait
    - balloon_control
    - observe_routes
    - move
    - cross_ice
    - bridge_slow
    - pass_door
    fallback_entry: wait
    tie_order:
    - escort_reply
    - pay_reward
    - verify_survivors
    - wait
    - balloon_control
    - observe_routes
    - move
    - cross_ice
    - bridge_slow
    - pass_door
    rules:
    - entry: escort_reply
      mode: score
      value: {call: {ref: escort.reply_score, args: {status: {ref: payload.status}, inclined: true, pending: {call: {ref: escort.reply_pending, args: {hearing: {ref: actor.escort_heard_ref}, invitation: {ref: actor.escort_utterance_ref}, speaker: {ref: actor.escort_speaker}, destination: {ref: actor.escort_destination}, answered: {ref: actor.escort_replied_invitations}}}}}}}
    - {entry: verify_survivors, mode: score, value: 1}
    - {entry: pay_reward, mode: score, value: 3}
    - entry: wait
      mode: default
    - entry: observe_routes
      mode: score
      value:
        if:
          when:
            all:
            - &queen_unspent_guide "actor.rescue_state != 'safe' and actor.guide_step is not None and actor.escort_heard_ref is not None and actor.escort_utterance_ref is not None and actor.guide_step.invitation == actor.escort_utterance_ref and actor.guide_step.hearing == actor.escort_heard_ref and actor.guide_step.motion.start == actor.site and actor.guide_step.motion.name == actor.escort_speaker and (actor.guide_consumption is None or (actor.guide_consumption is not None and actor.guide_consumption.step != actor.guide_step.observation))"
            - actor.route_observation is None or (actor.route_observation is not None and actor.route_observation.site != actor.site)
          then: 1
          else: 0
    - entry: move
      mode: score
      value:
        if:
          when: &queen_follow_destination
            all:
            - *queen_unspent_guide
            - actor.route_observation is not None and actor.route_observation.site == actor.site
            - payload.destination == actor.guide_step.motion.end
          then: 3
          else: 0
    - entry: cross_ice
      mode: score
      value:
        if:
          when:
            all:
            - *queen_unspent_guide
            - actor.route_observation is not None and actor.route_observation.site == actor.site
            - exists:
                collection: actor.known_crossings
                as: crossing
                where: crossing.key == payload.crossing and crossing.start == actor.site and crossing.intended == actor.guide_step.motion.end
          then: 3
          else: 0
    - entry: bridge_slow
      mode: score
      value: {if: {when: *queen_follow_destination, then: 3, else: 0}}
    - entry: pass_door
      mode: score
      value: {if: {when: *queen_follow_destination, then: 3, else: 0}}
    - entry: balloon_control
      mode: score
      value:
        if:
          when:
            all:
            - actor.heard_balloon_explanation is not None
            - payload.balloon == actor.heard_balloon_explanation.speech.balloon
            - any:
              - payload.operation == 'board' and actor.site == actor.heard_balloon_explanation.speech.site
              - payload.operation == 'leave' and actor.site == actor.heard_balloon_explanation.speech.destination
          then: 5
          else: 0
  - name: tower.local_bargain
    formals: {delivery_score: int, refusal_score: int, display_score: int}
    entries: [watch, propose, clear, deliver, withdraw, show_magic, withdraw_magic]
    fallback_entry: watch
    tie_order: [watch, propose, clear, withdraw, deliver, show_magic, withdraw_magic]
    rules:
    - {entry: watch, mode: default}
    - {entry: show_magic, mode: score, value: {arg: display_score}}
    - {entry: withdraw_magic, mode: score, value: 0}
    - entry: propose
      mode: score
      value:
        if:
