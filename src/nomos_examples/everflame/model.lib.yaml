  - name: bokold.ritualist
    formals: {}
    entries: &id002 [ritual_advance, retreat, observe_light, approach_light, wait]
    fallback_entry: wait
    tie_order: *id002
    rules:
    - entry: ritual_advance
      mode: score
      value: {const: 3}
    - entry: retreat
      mode: score
      value: {const: 1}
    - {entry: observe_light, mode: ignore}
    - {entry: approach_light, mode: ignore}
    - {entry: wait, mode: default}
  - name: bokold.retreater
    formals: {}
    entries: &id003 [retreat, ritual_advance, observe_light, approach_light, wait]
    fallback_entry: wait
    tie_order: *id003
    rules:
    - entry: retreat
      mode: score
      value: {const: 3}
    - entry: ritual_advance
      mode: score
      value: {const: 1}
    - {entry: observe_light, mode: ignore}
    - {entry: approach_light, mode: ignore}
    - {entry: wait, mode: default}
  - name: bokold.seek_light
    formals: {}
    entries: &id004 [approach_light, wait, observe_light, ritual_advance, retreat]
    fallback_entry: wait
    tie_order: *id004
    rules:
    - entry: approach_light
      mode: score
      value: {const: 5}
    - entry: observe_light
      mode: score
      value:
        if:
          when:
            any:
            - is_none: {ref: actor.light_observation_ref}
            - not:
                eq:
                - {ref: actor.last_action_ref}
                - {ref: actor.light_observation_ref}
          then: {const: 4}
          else: {const: 0}
    - {entry: ritual_advance, mode: ignore}
    - {entry: retreat, mode: ignore}
    - {entry: wait, mode: default}
  - name: fox.local_follow
    formals: {}
    entries: &id005 [fox_sniff, fox_observe_routes, fox_move, fox_cross_ice, fox_pass_door, fox_wait, fox_bridge_slow,
      fox_bridge_rush, accept_tame]
    fallback_entry: fox_wait
    tie_order: *id005
    rules:
    - {entry: fox_wait, mode: default}
    - entry: fox_sniff
      mode: score
      value: {const: 2}
    - entry: fox_observe_routes
      mode: score
      value:
        if:
          when:
            call:
              ref: movement.no_known_exit
              args: {paths: {ref: actor.known_paths}, crossings: {ref: actor.known_crossings}, bridges: {ref: actor.known_bridge_paths}, site: {ref: actor.site}}
          then: 1
          else: 0
    - entry: fox_move
      mode: score
      value:
        if: {when: actor.following_destination is not None and payload.destination == actor.following_destination,
          then: 3, else: 0}
    - entry: fox_cross_ice
      mode: score
      value:
        if:
          when:
            exactly_one:
              collection: {ref: actor.known_crossings}
              as: path
              where: path.key == payload.crossing and path.intended == actor.following_destination
          then: 3
          else: 0
    - entry: fox_pass_door
      mode: score
      value:
        if: {when: actor.following_destination is not None and payload.destination == actor.following_destination,
          then: 3, else: 0}
    - entry: fox_bridge_slow
      mode: score
      value:
        if: {when: actor.following_destination is not None and payload.destination == actor.following_destination,
          then: 3, else: 0}
    - {entry: fox_bridge_rush, mode: score, value: 0}
    - {entry: accept_tame, mode: score, value: 4}
  - name: stable.local_wait
    formals: {}
    entries: &id006 [stable_observe_routes, stable_move, stable_cross_ice, stable_pass_door, stable_wait]
    fallback_entry: stable_wait
    tie_order: *id006
    rules:
    - {entry: stable_wait, mode: default}
    - entry: stable_observe_routes
      mode: score
      value:
        if:
