              args: {paths: {ref: actor.known_paths}, crossings: {ref: actor.known_crossings}, bridges: {ref: actor.known_bridge_paths}, site: {ref: actor.site}}
          then: 1
          else: 0
    - {entry: stable_move, mode: score, value: 0}
    - {entry: stable_cross_ice, mode: score, value: 0}
    - {entry: stable_pass_door, mode: score, value: 0}
