# Public goals, not a capsule or a simulation of future K0 state.
schema: m1.public_planning.v1
goals:
  interrupt:
    label: 寻找中断仪式的机会
    selector: {sites: [ritual_ring]}
    when: progress.ritualDisrupted == 0 and knowledge.ritual_active
    gains: {ritualDisrupted: 1}
    feature: interrupt
    preferences: {cautious_investigator: 0, helpful_rescuer: 0, decisive_explorer: 0}
  help:
    label: 接近已知受困者
    selector: {observation: {kind: person, state: frozen}}
    when: true
    gains: {peopleThawed: 1, knownChargeSpent: 1}
    feature: help
    preferences: {cautious_investigator: 0, helpful_rescuer: 0, decisive_explorer: 0}
  depart:
    label: 寻找离宫的机会
    selector: {sites: [palace_exit]}
    when: true
    gains: {departed: 1}
    feature: depart
    preferences: {cautious_investigator: 0, helpful_rescuer: 0, decisive_explorer: 0}
  explore:
    label: 探查尚未抵达的区域
    selector: {frontier: {exclude_sites: [bridge_palace_landing, bridge_midspan, palace_exit]}}
    when: progress.visitedPlaces < 5 and not knowledge.ritual_dangerous
    gains: {visitedPlaces: 1}
    feature: explore
    preferences: {cautious_investigator: 50, helpful_rescuer: 0, decisive_explorer: 0}
  find_exit:
    label: 沿已知桥路寻找外岸
    selector: {frontier: {only_sites: [bridge_palace_landing, bridge_midspan, palace_exit]}}
    when: true
    gains: {visitedPlaces: 1}
    feature: explore
    preferences: {cautious_investigator: 20, helpful_rescuer: 20, decisive_explorer: 20}
