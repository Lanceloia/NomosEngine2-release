boards:
  personnel:
    title: 人员与生产工位
    source: {projection: public_boards}
    owner: player
    reserve: reserve
    unit: 人员
    icon: user
    motion: conserved
    groups:
      island: {title: 田地, key: key, label: crop, quantity: workers, labels: {'null': 采石场}}
      city: {title: 城市生产设施, key: key, label: kind, quantity: workers}
    pools:
      ship: {title: 殖民船, source: {context: catalog.colonist_ship}}
      supply: {title: 公共人员供给, source: {context: catalog.colonist_supply}}
seats:
  marks:
    - {source: {projection: current_stage}, field: acting, label: 当前行动者, icon: flag, tone: attention}
actions:
  prepare: {title: 按三人规则开局, icon: flag, description: 配发起始金币、公开种植园和人员船。初始田地尚无人员。}
  choose_role:
    title: 选择角色
    surface: choices
    description: 领取角色牌上的金币，从你开始让全体依序行动。市长安排人员；建筑师建厂；工匠生产；商人卖货；拓殖者增加田地。
    preview: {领取积累金币: role.reward}
    inputs:
      role: {label: 本轮采用哪种角色}
      bonus: {label: 市长特权, options: {'true': 从公共供给额外领取一名人员, 'false': 放弃额外人员}, fixed_label: 本次无需选择额外人员}
  settle:
    title: 取得田地或采石场
    description: 新田地占一个岛屿格，需在市长阶段安排人员。玉米直接生产，其他作物需要同货种生产建筑。采石场安排人员后降低建造费用。
    inputs: {tile: {label: 选择地块}}
    preview: {取得作物: tile.crop, 岛屿剩余空格: '11-size(player.island)'}
  assign_workers:
    title: 安排人员
    surface: {board: personnel}
    description: 把人员分到田地与建筑。靛蓝等货种需要两边都有人员；玉米只需要田地。可安置的人员须安置。若产量为零，可在之后的市长阶段补充人员并重新配置。
    inputs:
      layout:
        label: 本人的全部工位
        allocation: {targets: 'worker_sites(player,buildings)', key: key, label: label, capacity: capacity, total: player.colonists, minimum: 'minimum(player.colonists,allocation_capacity(worker_sites(player,buildings)))'}
        suggest: 'current_allocation(player)'
        suggest_label: 恢复当前配置
    preview: {当前供给下本配置的产量: 'production_after_allocation(player,buildings,layout,supply)'}
  build:
    title: 建造生产设施
    surface: choices
    description: 建好后工位为空，在市长阶段安排人员才能生产。建筑师选择者少付一金，已启用的采石场再减价。
    inputs: {building: {label: 选择建筑}}
    preview: {本次实际费用: 'build_price(player,building,player==at(order,selector_index))', 支付后金币: 'player.money-build_price(player,building,player==at(order,selector_index))', 最大生产工位: building.workers, 产出货种: building.production}
  produce:
    title: 生产商品
    description: 按已配置的田地与生产建筑领取实际可用商品。公共供给不足时产量相应减少。
    preview: {本次领取: 'production(player,buildings,supply)'}
  sell:
    title: 卖出一桶商品
    description: 交易所最多四桶，同货种通常只收一桶。商人选择者额外获得一金。
    inputs: {kind: {label: 卖出哪种商品}}
    preview: {本次收入: 'sale_price(goods,kind,player==at(order,selector_index))', 交易后金币: 'player.money+sale_price(goods,kind,player==at(order,selector_index))'}
  decline: {title: 本次不行动, description: 保留当前资源，让下一席取得角色行动机会。}
  extra_good:
    title: 领取工匠额外商品
    description: 全体生产完毕后，选择一种本人本阶段实际生产过且仍有公共供给的货种，额外领取一桶。
    inputs: {kind: {label: 额外领取哪种商品}}
  decline_extra: {title: 放弃额外商品, description: 结束工匠阶段，转向下一个角色选择。}
timeline:
  - {source: {context: catalog.history}, title: 角色行动, mode: append, icon: flag}
  - {source: {context: catalog.round}, title: 新一轮, mode: change, icon: flag}
  - {source: {self: colonists}, title: 你收到的人员, mode: change, icon: users}
  - {source: {self: money}, title: 你的金币, mode: change, icon: coins}
  - {source: {self: stock}, title: 你的商品, mode: change, icon: diamond}
