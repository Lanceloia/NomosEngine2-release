schema: nomos.tabletop.presentation
title: 波多黎各 · 经济阶段
description: >
  从田地到商品：先建生产设施，在市长阶段安排人员，再用工匠生产、商人卖货挣钱。
  选择一个角色会让全体依序行动，选择者有特权。你控制一席，其余由电脑决策。
  目标是建立自己的生产与交易链，发展岛屿的经济。
result_label: 经济阶段收束 · 最终个人板
rules:
  title: 波多黎各 · 本桌规则与流程
  sections:
    - title: 本桌目标与收束
      text: >
        建立田地、生产建筑与交易的经济链。你控制一席，其他席位由电脑行动。
        本桌采用三人开局，开放拓殖、市长、建筑师、工匠和商人；勘探者随开局角色配置提供。
        人员供给不足以补船，或有人填满城市后，在本轮结束展示全体个人板。
        船运、紫色特殊建筑和最终胜利分属于后续完整对局内容；本桌以经济阶段展示收束。
    - title: 一轮怎样进行
      text: >
        总督先选角色，领取牌上积累的金币，并取得该角色特权。
        从选择者开始，所有人依席位顺序各行动一次；然后下一席选择尚未选过的角色。
        每人选过一个角色后，本轮结束。未选角色增加一金，总督移至下一席。
    - title: 拓殖与市长
      text: >
        拓殖阶段取得一块公开田地，选择者也可取采石场。岛屿最多十二格。
        市长阶段从殖民船依序领取人员，选择者可额外从公共供给领取一人。
        重新安排自己的全部人员：每块田地一个工位，建筑容量见牌面。
        能安置的人员须安置，其余留在圣胡安。已配置人员的采石场可降低建造费用。
    - title: 建造与生产
      text: >
        建筑师阶段可建一座当前买得起的生产设施，也可放弃。
        建筑具有原价和生产工位，本次实际费用取决于特权与已启用的采石场。
        建筑师选择者少付一金，已启用的采石场进一步减价。
        新建筑工位为空，需要在市长阶段安排人员。
        工匠阶段，玉米由有人员的田地直接生产；其他货种需要同货种田地和生产建筑同时有人。
        产量还受公共商品供给限制。全体生产后，工匠选择者可再领取一桶本人本阶段生产过且仍有供给的商品。
    - title: 交易与放弃
      text: >
        商人阶段可卖一桶商品，交易所最多四桶，已有货种通常不再收取。
        选择商人者卖货时多得一金。
        交易阶段结束时，已满的交易所清空。普通角色行动可放弃，机会转给下一席。
    - title: 完整原版规则
      text: >
        下方链接是 Rio Grande 发布的经典英文规则书，包含船长、特殊建筑和胜利计分。
        本桌的可执行范围以以上说明为准，阅读原版可了解后续完整对局的玩法。
  sources:
    - {title: 经典版官方规则书（英文 PDF）, url: 'https://www.riograndegames.com/wp-content/uploads/2013/02/Puerto-Rico-Rules.pdf'}
