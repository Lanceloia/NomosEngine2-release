components:
  PlayerRef: {kind: badge, icon: user}
  Role:
    kind: badge
    items:
      settler: {label: 拓殖者, icon: flag, description: '全体取得田地；你也可选择采石场。'}
      mayor: {label: 市长, icon: users, description: '全体领取并重新安排人员；你可额外领取一人。'}
      builder: {label: 建筑师, icon: crown, description: '全体可建一座设施；你少付一金。'}
      craftsman: {label: 工匠, icon: diamond, description: '全体生产商品；你可再领取一桶。'}
      trader: {label: 商人, icon: coins, description: '全体可卖一桶商品；你卖出时多得一金。'}
      captain: {label: 船长, icon: flag}
      prospector: {label: 勘探者, icon: coins, description: '你额外领取一金，随即转到下一席选角色。'}
  Goods:
    kind: resources
    fields:
      corn: {label: 玉米, color: '#b58321', symbol: circle}
      indigo: {label: 靛蓝, color: '#3d75b3', symbol: diamond}
      sugar: {label: 糖, color: '#998f7f', symbol: square}
      tobacco: {label: 烟草, color: '#8a6345', symbol: triangle}
      coffee: {label: 咖啡, color: '#684352', symbol: hexagon}
  Good: {kind: resource_choice, resources: Goods}
  Allocation: {kind: allocation, fields: {rows: rows, target: target, quantity: count, reserve: reserve}}
  RoleSlot: {kind: record, fields: {kind: {label: 角色}, reward: {label: 选择时领取金币}}}
  TileCard: {kind: record, fields: {key: {label: 编号}, crop: {label: 作物}}}
  Land: {kind: table, columns: {key: 编号, crop: 作物, workers: 人员}}
  Building: {kind: table, columns: {key: 编号, kind: 建筑, workers: 人员}}
  BuildingSpec: {kind: record, fields: {label: {label: 建筑}, cost: {label: 原价}, workers: {label: 生产工位}, production: {label: 产出货种}}}
  PublicBoard: {kind: record, fields: {player: {label: 玩家}, money: {label: 金币}, colonists: {label: 总人员}, reserve: {label: 待命人员}, island: {label: 田地}, city: {label: 建筑}, stock: {label: 商品}}}
  Stage: {kind: record, fields: {round: {label: 轮次}, governor: {label: 总督}, chooser: {label: 选择角色者}, selector: {label: 本阶段特权}, acting: {label: 当前行动者}, role: {label: 当前角色}}}
  MoveRecord: {kind: table, columns: {round: 轮次, player: 玩家, role: 角色, kind: 行动}}
