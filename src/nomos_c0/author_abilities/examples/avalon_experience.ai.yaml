      suspects: {reports: PlayerReports}
      pair: {reports: CandidateGroups}
      discussion: {reports: TeamSpeeches}
      claims: {reports: IdentitySpeeches}
      census: {reports: PopulationReports}
      results: {reports: QuestHistory}
      alternatives: {reports: TeamSuggestions}
      expressions: {reports: DiscussionStatements}
      ballot_receipts: {reports: ApprovalHistory}
    explain:
      information:
        当前主观看法: {type: PlayerJudgment, value: cognition(mind)}
        本局本人身份: {type: RoleReports, value: reports(identity)}
        已有任务记录: {type: QuestHistory, value: quest_history}
        已听见的建议: {type: TeamSpeeches, value: reports(discussion)}
        当前任务阈值与否决局势: {type: DiscussionGoals, value: 'discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census))'}
        当前建议核验: {type: ArgumentReviews, value: 'current_reviews(reports(discussion), reports(results), reports(census), team, epoch)'}
        已听见的替代队伍: {type: TeamSuggestions, value: reports(alternatives)}
      motive:
        当前任务: {type: Mission, value: mission}
    candidates:
      - definition: ProposePlan
        screen: '-leader_distance(order, at(order, leader_index), target_leader) - rejection_limit'
        diversify: target_leader
        choices: {rejection_limit: 'filter(RejectionLimits([1, 2, 3, 4]), limit => limit > rejections)'}
        explain:
          judgment:
            等待目标队长的轮转步数: {type: Count, value: 'leader_distance(order, at(order, leader_index), target_leader)'}
            本人对等待计划的评价: {type: ExperienceScore, value: 'plan_prospect(LeaderPlan(leader=target_leader, rejection_limit=rejection_limit), discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census))), discussion_context(mission, at(order, leader_index), rejections, phase, team, approval_history, discussion_kind, speech_serial))'}
      - definition: DecidePlan
        screen: target.turn
        diversify: participation
        explain:
          judgment:
            所回应的计划: {type: MaybeDiscussionStatement, value: 'quoted_statement(reports(expressions), target)'}
            当前计划状态: {type: PlanStatus, value: 'plan_status(reports(expressions), target, discussion_context(mission, at(order, leader_index), rejections, phase, team, approval_history, discussion_kind, speech_serial))'}
            已表达参加的人物: {type: Players, value: 'plan_supporters(reports(expressions), target, mission)'}
            本人对参加或退出的评价: {type: ExperienceScore, value: 'plan_participation_value(reports(expressions), target, participation, discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census))), discussion_context(mission, at(order, leader_index), rejections, phase, team, approval_history, discussion_kind, speech_serial))'}
      - definition: RetractStatement
        screen: target.turn
        choices: {target: 'withdrawal_targets(reports(expressions), discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census))), discussion_context(mission, at(order, leader_index), rejections, phase, team, approval_history, discussion_kind, speech_serial), size(team))'}
        explain:
          judgment:
            撤回的原始表达: {type: MaybeDiscussionStatement, value: 'quoted_statement(reports(expressions), target)'}
      - definition: CompareTeams
        screen: >
          consider_comparison(preferred, alternative, grounds,
          discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history,
          cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census))),
          expression_fresh(comparison_content(preferred, alternative, grounds, mission), reports(expressions), person, mission))
        diversify: preferred
        choices:
          alternative: 'union(PlayerSets([team]), noncurrent_heard_options(team, reports(alternatives), epoch))'
          grounds: 'comparison_ground_sets(quest_history, preferred, reports(discussion), epoch, person) if alternative == team or preferred in noncurrent_heard_options(team, reports(alternatives), epoch) else ArgumentSets([])'
        explain:
          judgment:
            相对方案价值: {type: ExperienceScore, value: 'discussion_preference(preferred, discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census)))) - discussion_preference(alternative, discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census))))'}
      - definition: StateCondition
        screen: >
          consider_condition(conditions, satisfied, otherwise,
          discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history,
          cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census))),
          size(team), expression_fresh(condition_content(conditions, satisfied, otherwise, mission), reports(expressions), person, mission))
        diversify: otherwise
        inputs: {satisfied: 'Stance.oppose if otherwise == Stance.support else Stance.support'}
        choices:
          conditions: 'candidate_conditions(quest_history, team, person, order, reports(alternatives), epoch)'
          otherwise: 'condition_otherwise_options(conditions, order, person)'
        explain:
          motive:
            条件明确排除本人: {type: Bool, value: 'person in condition_members(conditions, order, False)'}
          judgment:
            符合条件的有限假设队伍: {type: PlayerSets, value: 'position_examples(conditions, order, size(team), True)'}
            条件成立时的本人评价: {type: ExperienceScore, value: 'condition_value(position_examples(conditions, order, size(team), True), satisfied, discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census))))'}
      - definition: RespondStatement
        screen: 'target.turn + 3 * size(grounds) + (1 if attitude == ResponseAttitude.undecided else 2)'
        diversify: attitude
        choices:
          grounds: 'reply_ground_sets(attitude, quest_history, team, reports(discussion), epoch, person, reports(census))'
          target: 'grounded_reply_targets(reports(expressions), mission, person, grounds, attitude, team, discussion_kind)'
        explain:
          judgment:
            回应的原始表达: {type: MaybeDiscussionStatement, value: 'quoted_statement(reports(expressions), target)'}
            回应引用的公开依据: {type: TeamArguments, value: grounds}
            本人对表达的回应评价: {type: ExperienceScore, value: 'reply_value_local(quoted_statement(reports(expressions), target), attitude, discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census))), size(team))'}
      - definition: RedirectDiscussion
        screen: '0'
        explain:
          motive:
            私下掩护价值: {type: ExperienceScore, value: 'redirect_value(topic, reports(identity), known_team_risk(team, person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history))'}
      - definition: StateOpinion
        screen: 'consider_assertion(assertion, team)'
        diversify: stance
        choices: {assertion: 'candidate_public_assertions(order, team, public_cast, person, reports(pair), reports(results))'}
        explain:
          judgment:
            公开说法与本地证据的关系: {type: IdentityVerdict, value: 'public_assertion_verdict(assertion, discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census))))'}
            当前公开观点核验: {type: PublicOpinionReviews, value: 'public_opinion_reviews(reports(expressions), discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census))))'}
      - definition: Speak
        screen: size(clauses)
        diversify: size(clauses)
        choices: {clauses: 'candidate_compositions(team, reports(alternatives), reports(discussion), reports(expressions), quest_history, epoch, discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census))))'}
        explain:
          judgment:
            一次发言中的各项内容: {type: DiscussionContents, value: clauses}
            本人对整句的评价: {type: ExperienceScore, value: 'compound_value(clauses, discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census))), size(team), reports(expressions))'}
      - definition: AskQuestion
        screen: 'consider_question(subject, recipient, team)'
        diversify: purpose
        choices:
          purpose: 'QuestionPurposes([QuestionPurpose.explain_choice, QuestionPurpose.explain_basis, QuestionPurpose.clarify])'
          subject: 'candidate_question_subjects(recipient, purpose, reports(claims), reports(discussion), reports(alternatives), reports(expressions), reports(ballot_receipts), epoch, mission, discussion_kind)'
      - definition: AnswerQuestion
        screen: 'question.turn + consider_answer(reply)'
        diversify: question
        choices: {reply: 'candidate_public_answers(question_assertion(quoted_statement(reports(expressions), question), reports(expressions), reports(ballot_receipts)))'}
        explain:
          judgment:
            实际收到的问题: {type: MaybeDiscussionStatement, value: 'quoted_statement(reports(expressions), question)'}
      - definition: ProposeTeam
        screen: 'proposal_value(members, discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census))), epoch, reports(results), reports(claims))'
        # Keep a representative safe and risky team before later personality appraisal.
        diversify: 'candidate_risk(members, person, reports(identity), reports(peers), reports(suspects), reports(pair), cognition(mind)) > 30'
        explain:
          judgment:
            经验匹配情境: {type: TeamExperienceContext, value: 'team_experience(members, person, observer_experience(person, order, reports(identity), cognition(mind), reports(results), reports(discussion), reports(ballot_receipts)))'}
            候选队伍风险: {type: ExperienceScore, value: 'candidate_risk(members, person, reports(identity), reports(peers), reports(suspects), reports(pair), cognition(mind))'}
            已有线索确认包含邪恶成员: {type: Bool, value: 'known_team_risk(members, person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history)'}
            队伍邪恶人数范围: {type: EvilInterval, value: 'team_evil_interval(members, person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, reports(census))'}
            任务所需失败票数: {type: Count, value: 'task_failure_threshold(mission, size(order), population)'}
            任务破坏能力判断: {type: BallotGoalBasis, value: 'task_capacity_basis(team_evil_interval(members, person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, reports(census)), task_failure_threshold(mission, size(order), population))'}
            推荐者表决的当前利益评价: {type: PersonGoalReviews, value: 'recommendation_goal_reviews(ballot_goal_context(discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census))), reports(ballot_receipts), reports(census), population), members, epoch)'}
      - definition: ApproveTeam
        screen: '0'
        explain:
          judgment:
            经验匹配情境: {type: TeamExperienceContext, value: 'team_experience(team, at(order, leader_index), observer_experience(person, order, reports(identity), cognition(mind), reports(results), reports(discussion), reports(ballot_receipts)))'}
            当前队伍风险: {type: ExperienceScore, value: 'candidate_risk(team, person, reports(identity), reports(peers), reports(suspects), reports(pair), cognition(mind))'}
            已有线索确认包含邪恶成员: {type: Bool, value: 'known_team_risk(team, person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history)'}
            再否决就会输局: {type: Bool, value: 'rejections >= 4'}
            队伍邪恶人数范围: {type: EvilInterval, value: 'team_evil_interval(team, person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, reports(census))'}
            任务所需失败票数: {type: Count, value: 'task_failure_threshold(mission, size(order), population)'}
            任务破坏能力判断: {type: BallotGoalBasis, value: 'task_capacity_basis(team_evil_interval(team, person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, reports(census)), task_failure_threshold(mission, size(order), population))'}
      - definition: AdviseTeam
        screen: 'consider_argument(rationale)'
        diversify: 'advice_search_group(support_team, rationale)'
        explain:
          motive:
            希望影响的听众: {type: Players, value: 'intended_listeners(person, reports(census), reports(peers), reports(suspects))'}
            希望促成的选择: {type: CommunicationAim, value: 'CommunicationAim.recruit_support if support_team else CommunicationAim.recruit_rejection'}
          judgment:
            本人对队伍的判断: {type: ExperienceScore, value: 'discussion_preference(team, discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census))))'}
            本人表决偏好: {type: ExperienceScore, value: 'vote_preference(support_team, team, discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census))), reports(discussion), epoch, reports(results))'}
            本次主张符合本人倾向: {type: Bool, value: 'expression_preference(support_team, team, discussion_perspective(person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, cognition(mind), order, discussion_goals(mission, rejections, task_failure_threshold(mission, size(order), population), reports(census)))) > 0'}
            本次表达有新内容: {type: Bool, value: 'fresh_advice(person, rationale, support_team, reports(discussion), team, epoch)'}
            尚未同意此立场的预期听众数: {type: ExperienceScore, value: 'audience_gap(intended_listeners(person, reports(census), reports(peers), reports(suspects)), reports(discussion), team, epoch, support_team)'}
            公开表达的立场: {type: Bool, value: support_team}
            回应本人受到的质疑: {type: ExperienceScore, value: 'reply_value(rationale, reports(discussion), epoch, person)'}
            这项理由的核验: {type: ArgumentVerdict, value: 'argument_verdict(rationale, team, support_team, reports(results), reports(census))'}
            引用的本人身份说法: {type: IdentitySpeeches, value: 'cited_claims(rationale, reports(claims))'}
            身份说法评价: {type: ExperienceScore, value: 'identity_argument_value(rationale, reports(claims), cognition(mind))'}
            对该身份说法的当前看法: {type: IdentityJudgments, value: 'cited_identity_judgments(rationale, reports(claims), cognition(mind))'}
            已有线索确认包含邪恶成员: {type: Bool, value: 'known_team_risk(team, person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history)'}
            再否决就会输局: {type: Bool, value: 'rejections >= 4'}
            队伍邪恶人数范围: {type: EvilInterval, value: 'team_evil_interval(team, person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, reports(census))'}
      - definition: SuggestTeam
        screen: 'consider_team(members, person, reports(identity), reports(peers), reports(suspects), quest_history) + (consider_argument(rationale) if rationale is not None else 0)'
        diversify: members
        choices:
          rationale: alternative_arguments(quest_history, members, team, reports(discussion), epoch, person, reports(claims), phase == Phase.response, public_cast, reports(results), reports(census))
        explain:
          motive:
            希望影响的听众: {type: Players, value: 'intended_listeners(person, reports(census), reports(peers), reports(suspects))'}
            希望促成的选择: {type: CommunicationAim, value: CommunicationAim.offer_alternative}
          judgment:
            推荐队伍: {type: Players, value: members}
            附带的推荐理由: {type: MaybeTeamArgument, value: rationale}
            本次建议包含新的本人观点: {type: Bool, value: 'fresh_alternative(members, reports(alternatives), epoch, person, rationale)'}
            推荐队伍风险: {type: ExperienceScore, value: 'candidate_risk(members, person, reports(identity), reports(peers), reports(suspects), reports(pair), cognition(mind))'}
            队伍邪恶人数范围: {type: EvilInterval, value: 'team_evil_interval(members, person, reports(identity), reports(peers), reports(suspects), reports(pair), quest_history, reports(census))'}
      - definition: ClaimIdentity
        screen: '1 if claimed_role == Role.merlin else 0'
        explain:
          motive:
            希望影响的听众: {type: Players, value: 'intended_listeners(person, reports(census), reports(peers), reports(suspects))'}
            希望促成的选择: {type: CommunicationAim, value: CommunicationAim.project_identity}
          judgment:
            本人尚未作过这个身份声明: {type: Bool, value: 'fresh_identity(person, claimed_role, reports(claims))'}
      - {definition: PassSpeech, screen: '0'}
      - {definition: MissionCard, screen: '0'}
      - definition: Assassinate
        screen: '0'
        explain:
          judgment:
            目标梅林假设: {type: IdentityJudgment, value: 'judged_identity(cognition(mind), target, Role.merlin)'}
            当前公开观点的软影响: {type: ExperienceScore, value: 'public_role_signal(cognition(mind), target, Role.merlin, mission, person)'}
    semantics: ExperientialAvalon
    consideration: {per_ability: 6}
    participation:
      personality: {credibility: 1, information: 1}
      goals: {benefit: 1, coordination: 1, concealment: 1, effort: 1, evidence: 1}
    tie: canonical
    wait: no_candidate
control:
  table:
    kind: Player
    definition: ExperientialPlayer
    views: {mind: player_understanding, identity: own_role, peers: evil_peers, suspects: merlin_suspects, pair: percival_candidates, discussion: advise_team.said, claims: claim_identity.said, census: population, results: reveal_quest.result, alternatives: suggest_team.said, expressions: publish_discussion.said, ballot_receipts: reveal_approval.result}
