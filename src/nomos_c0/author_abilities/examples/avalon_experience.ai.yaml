# Local beliefs and empirical preferences. No private role solver or seat lookup.
schema: nomos.author.ai
imports: [avalon_judgment.ai.yaml, avalon_deliberation.ai.yaml, avalon_planning.ai.yaml, avalon_ballot_goals.ai.yaml, avalon_dialogue.ai.yaml, avalon_compound.ai.yaml, avalon_expression_feedback.ai.yaml, avalon_consideration.ai.yaml, avalon_experience_context.ai.yaml]
queries:
  success_core_argument:
    parameters: {argument: TeamArgument}
    returns: Bool
    expression: match(argument, SuccessCore() => True, Judgment() => False, TestTeam() => False, FailureOverlap() => False, TrustSpeaker() => False, EvilExhausted() => False, ClaimAssessment() => False, ClaimConflict() => False)
  current_role:
    parameters: {own: RoleReports}
    returns: Role
    expression: at(own, size(own) - 1).role
  familiar_enemy:
    parameters: {person: PlayerRef, self: PlayerRef, own: RoleReports, peers: PlayerReports, suspects: PlayerReports}
    returns: Bool
    expression: exists(peers, group => person in group) or exists(suspects, group => person in group) or (person == self and evil_role(current_role(own)))
  enemy_count:
    parameters: {members: Players, self: PlayerRef, own: RoleReports, peers: PlayerReports, suspects: PlayerReports}
    returns: ExperienceScore
    expression: sum_by(members, p => 1 if familiar_enemy(p, self, own, peers, suspects) else 0)
  overlap_count:
    parameters: {left: Players, right: Players}
    returns: ExperienceScore
    expression: sum_by(left, p => 1 if p in right else 0)
  outside_failure_capacity:
    parameters: {original: Players, members: Players, self: PlayerRef, own: RoleReports}
    returns: ExperienceScore
    # An already-known good self cannot explain a failure outside this team.
    expression: sum_by(difference(original, members), p => 0 if p == self and not evil_role(current_role(own)) else 1)
  evidence_peak:
    parameters: {selected: MaybeEvidenceCount}
    returns: ExperienceScore
    expression: selected if selected is not None else 0
  stronger_evidence:
    parameters: {left: ExperienceScore, right: ExperienceScore}
    returns: ExperienceScore
    expression: left if left > right else right
  historical_minimum:
    parameters: {members: Players, self: PlayerRef, own: RoleReports, history: QuestHistory}
    returns: ExperienceScore
    expression: >
      evidence_peak(max_by(map(history, q => q.fails - outside_failure_capacity(q.team, members, self, own)
      if q.fails > outside_failure_capacity(q.team, members, self, own) else 0), n => n))
  team_evil_minimum:
    parameters: {members: Players, self: PlayerRef, own: RoleReports, peers: PlayerReports, suspects: PlayerReports, pairs: CandidateGroups, history: QuestHistory}
    returns: ExperienceScore
    # Take the strongest individual bound; overlapping histories are never added.
    expression: >
      stronger_evidence(enemy_count(members, self, own, peers, suspects),
      stronger_evidence(1 if exists(pairs, g => forall(g.subjects, p => p in members) and exists(g.labels, r => evil_role(r))) else 0,
      historical_minimum(members, self, own, history)))
  limited_interval:
    parameters: {minimum: ExperienceScore, maximum: ExperienceScore, capacity: ExperienceScore}
    returns: EvilInterval
    expression: EvilInterval(minimum=minimum, maximum=maximum if maximum < capacity else capacity)
  team_evil_interval:
    parameters: {members: Players, self: PlayerRef, own: RoleReports, peers: PlayerReports, suspects: PlayerReports, pairs: CandidateGroups, history: QuestHistory, census: PopulationReports}
    returns: EvilInterval
    # Public population bounds the complement; an unknown count never means zero.
    expression: >
      limited_interval(team_evil_minimum(members, self, own, peers, suspects, pairs, history),
      sum_by(at(census, size(census) - 1).cast, r => 1 if evil_role(r) else 0) -
      team_evil_minimum(difference(at(census, size(census) - 1).roster, members), self, own, peers, suspects, pairs, history),
      size(members) - (1 if self in members and not evil_role(current_role(own)) else 0))
      if size(census) > 0 else
      EvilInterval(minimum=team_evil_minimum(members, self, own, peers, suspects, pairs, history),
      maximum=size(members) - (1 if self in members and not evil_role(current_role(own)) else 0))
  known_team_clean:
    parameters: {members: Players, self: PlayerRef, own: RoleReports, peers: PlayerReports, suspects: PlayerReports, pairs: CandidateGroups, history: QuestHistory, census: PopulationReports}
    returns: Bool
    expression: team_evil_interval(members, self, own, peers, suspects, pairs, history, census).maximum == 0
  known_team_risk:
    parameters: {members: Players, self: PlayerRef, own: RoleReports, peers: PlayerReports, suspects: PlayerReports, pairs: CandidateGroups, history: QuestHistory}
    returns: Bool
    # This establishes an evil member, not a guaranteed future failure card.
    expression: team_evil_minimum(members, self, own, peers, suspects, pairs, history) > 0
  known_good_members:
    parameters: {members: Players, self: PlayerRef, own: RoleReports, mind: PlayerJudgment}
    returns: Players
    # Only acquired guarantees exclude suspicion; public claims never establish roles.
    expression: >
      filter(members, p => (p == self and not evil_role(current_role(own))) or
      (mind.complete and mind.local.complete and mind.local.status == JudgmentAnalysisStatus.complete and
      forall(Roles([Role.assassin, Role.minion, Role.morgana, Role.mordred]), r =>
      exists(mind.local.bounds, b => b.members == Players([p]) and b.category == r and b.maximum == 0))))
  candidate_risk:
    parameters: {members: Players, self: PlayerRef, own: RoleReports, peers: PlayerReports, suspects: PlayerReports, pairs: CandidateGroups, mind: PlayerJudgment}
    returns: ExperienceScore
    expression: 100 * enemy_count(members, self, own, peers, suspects) + sum_by(pairs, g => 100 if forall(g.subjects, p => p in members) and size(g.subjects) > 1 else 0) + judged_team_risk(mind, members, known_good_members(members, self, own, mind))
  team_preference:
    parameters: {members: Players, self: PlayerRef, own: RoleReports, peers: PlayerReports, suspects: PlayerReports, pairs: CandidateGroups, history: QuestHistory, mind: PlayerJudgment}
    returns: ExperienceScore
    # A weak impression for unresolved tasks; leader affinity is evaluated separately.
    expression: (50 * enemy_count(members, self, own, peers, suspects) - 10 if exists(history, q => q.failed) or enemy_count(members, self, own, peers, suspects) > 0 else 20) if evil_role(current_role(own)) else 35 - candidate_risk(members, self, own, peers, suspects, pairs, mind) + (3 if self in members else 0)
  cited_results:
    parameters: {argument: TeamArgument, results: QuestHistory}
    returns: QuestHistory
    expression: >
      match(argument, Judgment() => QuestHistory([]), TestTeam() => QuestHistory([]),
      FailureOverlap() => QuestHistory([]), SuccessCore(r) => filter(results, q => q.mission == r.mission and q.epoch == r.epoch), TrustSpeaker() => QuestHistory([]), ClaimAssessment() => QuestHistory([]), ClaimConflict() => QuestHistory([]),
      EvilExhausted(r) => filter(results, q => q.mission == r.mission and q.epoch == r.epoch))
  public_evil_count:
    parameters: {census: PopulationReports}
    returns: MaybeEvidenceCount
    expression: sum_by(at(census, size(census) - 1).cast, r => 1 if evil_role(r) else 0) if size(census) > 0 else None
  check_exclusion:
    parameters: {premises: QuestHistory, census: PopulationReports, members: Players, approve: Bool}
    returns: ArgumentVerdict
    expression: >
      (ArgumentVerdict.verified if approve and at(premises, 0).fails > 0 and
      at(premises, 0).fails == sum_by(at(census, size(census) - 1).cast, r => 1 if evil_role(r) else 0) and
      forall(members, p => p in at(census, size(census) - 1).roster) and
      not exists(at(premises, 0).team, p => p in members) else ArgumentVerdict.insufficient)
      if size(premises) == 1 and size(census) > 0 else ArgumentVerdict.missing_evidence
  argument_verdict:
    parameters: {argument: TeamArgument, members: Players, approve: Bool, results: QuestHistory, census: PopulationReports}
    returns: ArgumentVerdict
    expression: >
      match(argument, Judgment() => ArgumentVerdict.opinion, TestTeam() => ArgumentVerdict.opinion, SuccessCore() => ArgumentVerdict.opinion,
      FailureOverlap() => ArgumentVerdict.opinion, TrustSpeaker() => ArgumentVerdict.opinion, ClaimAssessment() => ArgumentVerdict.opinion, ClaimConflict() => ArgumentVerdict.opinion,
      EvilExhausted() => check_exclusion(cited_results(argument, results), census, members, approve))
  argument_review:
    parameters: {speech: TeamSpeech, results: QuestHistory, census: PopulationReports}
    returns: ArgumentReview
    expression: >
      ArgumentReview(speaker=speech.speaker, epoch=speech.epoch, team=speech.team, rationale=speech.rationale,
      verdict=argument_verdict(speech.rationale, speech.team, speech.approve, results, census),
      premises=cited_results(speech.rationale, results), public_evil_count=public_evil_count(census))
  current_reviews:
    parameters: {heard: TeamSpeeches, results: QuestHistory, census: PopulationReports, members: Players, epoch: Epoch}
    returns: ArgumentReviews
    expression: map(filter(heard, s => s.epoch == epoch and s.team == members), s => argument_review(s, results, census))
  opinion_argument:
    parameters: {argument: TeamArgument}
    returns: Bool
    expression: match(argument, Judgment() => True, TestTeam() => True, FailureOverlap() => True, SuccessCore() => True, TrustSpeaker() => False, EvilExhausted() => False, ClaimAssessment() => True, ClaimConflict() => True)
  heard_signal:
    parameters: {mind: PlayerJudgment, heard: TeamSpeeches, members: Players, epoch: Epoch, self: PlayerRef, results: QuestHistory, census: PopulationReports}
    returns: ExperienceScore
    # Repeated references and echoes do not multiply a public exclusion proof.
    expression: >
      sum_by(mind.beliefs, b => judged_opinion(mind, b.proposition, members, epoch, self)) +
      (2 if exists(heard, s => s.epoch == epoch and s.team == members and s.speaker != self and
      argument_verdict(s.rationale, members, s.approve, results, census) == ArgumentVerdict.verified) else 0)
  vote_preference:
    parameters: {approve: Bool, members: Players, perspective: DiscussionPerspective, heard: TeamSpeeches, epoch: Epoch, results: QuestHistory}
    returns: ExperienceScore
    expression: (discussion_preference(members, perspective) + (heard_signal(perspective.mind, heard, members, epoch, perspective.person, results, perspective.goals.census) if perspective.goals.rejections < 4 else 0)) * (1 if approve else -1)
  argument_value:
    parameters: {argument: TeamArgument, members: Players, support: Bool, results: QuestHistory, census: PopulationReports}
    returns: ExperienceScore
    expression: >
      match(argument, Judgment() => 0, TestTeam() => 0, FailureOverlap() => 0, TrustSpeaker() => 0, ClaimAssessment() => 0, ClaimConflict() => 0,
      SuccessCore(r) => 1 if support and exists(results, q => q.mission == r.mission and q.epoch == r.epoch and q.fails == 0 and forall(q.team, p => p in members)) else 0,
      EvilExhausted() => 3 if argument_verdict(argument, members, support, results, census) == ArgumentVerdict.verified else -2)
  cited_claims:
    parameters: {argument: TeamArgument, claims: IdentitySpeeches}
    returns: IdentitySpeeches
    expression: >
      match(argument, Judgment() => IdentitySpeeches([]), TestTeam() => IdentitySpeeches([]),
      FailureOverlap() => IdentitySpeeches([]), SuccessCore() => IdentitySpeeches([]), TrustSpeaker() => IdentitySpeeches([]), EvilExhausted() => IdentitySpeeches([]),
      ClaimAssessment(r) => filter(claims, c => c.speaker == r.speaker and c.epoch == r.claim_epoch and c.role == r.claimed_role),
      ClaimConflict(r) => filter(claims, c => c == r.first or c == r.second))
  claim_assessment:
    parameters: {claims: IdentitySpeeches, credible: Bool, mind: PlayerJudgment}
    returns: ExperienceScore
    # Evaluate the quoted hypothesis against the listener's current acquired bounds.
    expression: >
      constrained_claim_value(judged_identity(mind, at(claims, 0).speaker, at(claims, 0).role), credible)
      if size(claims) == 1 else 0
  identity_argument_value:
    parameters: {argument: TeamArgument, claims: IdentitySpeeches, mind: PlayerJudgment}
    returns: ExperienceScore
    expression: >
      match(argument, Judgment() => 0, TestTeam() => 0, FailureOverlap() => 0, SuccessCore() => 0, TrustSpeaker() => 0, EvilExhausted() => 0,
      ClaimAssessment(r) => claim_assessment(cited_claims(argument, claims), r.credible, mind),
      ClaimConflict() => 0)
  determined_claim:
    parameters: {claims: IdentitySpeeches, mind: PlayerJudgment}
    returns: Bool
    expression: exists(claims, c => identity_verdict(mind, identity_bound(mind, c.speaker, c.role)) == IdentityVerdict.established or identity_verdict(mind, identity_bound(mind, c.speaker, c.role)) == IdentityVerdict.excluded) if size(claims) == 1 else False
  identity_argument_known:
    parameters: {argument: TeamArgument, claims: IdentitySpeeches, mind: PlayerJudgment}
    returns: Bool
    expression: match(argument, ClaimAssessment() => determined_claim(cited_claims(argument, claims), mind), Judgment() => False, TestTeam() => False, FailureOverlap() => False, SuccessCore() => False, TrustSpeaker() => False, EvilExhausted() => False, ClaimConflict() => False)
  cited_identity_judgments:
    parameters: {argument: TeamArgument, claims: IdentitySpeeches, mind: PlayerJudgment}
    returns: IdentityJudgments
    expression: map(cited_claims(argument, claims), c => judged_identity(mind, c.speaker, c.role))
  suggestion_signal:
    parameters: {mind: PlayerJudgment, members: Players, epoch: Epoch, self: PlayerRef, results: QuestHistory, census: PopulationReports, claims: IdentitySpeeches}
    returns: ExperienceScore
    expression: >
      sum_by(mind.beliefs, b => judged_alternative(mind, b.proposition, members, epoch, self, results, census, claims))
  suggestion_argument_value:
    parameters: {argument: MaybeTeamArgument, members: Players, results: QuestHistory, census: PopulationReports, claims: IdentitySpeeches, mind: PlayerJudgment}
    returns: ExperienceScore
    expression: >
      argument_value(argument, members, True, results, census) + identity_argument_value(argument, claims, mind)
      if argument is not None else 0
  intended_listeners:
    parameters: {self: PlayerRef, census: PopulationReports, peers: PlayerReports, suspects: PlayerReports}
    returns: Players
    # An intended audience is a subjective target, not a prediction of agreement.
    expression: filter(at(census, size(census) - 1).roster, p => p != self and not exists(peers, g => p in g) and not exists(suspects, g => p in g)) if size(census) > 0 else Players([])
  reply_value:
    parameters: {argument: TeamArgument, heard: TeamSpeeches, epoch: Epoch, self: PlayerRef}
    returns: ExperienceScore
    # Maintain a public claim after actual criticism; this does not affirm its truth.
    expression: >
      match(argument, ClaimAssessment(r) => 4 if r.speaker == self and r.credible and
      exists(heard, s => s.epoch == epoch and s.speaker != self and
      match(s.rationale, ClaimAssessment(c) => c.speaker == self and c.claim_epoch == r.claim_epoch and not c.credible,
      Judgment() => False, TestTeam() => False, FailureOverlap() => False, SuccessCore() => False, TrustSpeaker() => False, EvilExhausted() => False, ClaimConflict() => False)) else 0,
      Judgment() => 0, TestTeam() => 0, FailureOverlap() => 0, SuccessCore() => 0, TrustSpeaker() => 0, EvilExhausted() => 0, ClaimConflict() => 0)
  listener_needs_stance:
    parameters: {listener: PlayerRef, heard: TeamSpeeches, members: Players, epoch: Epoch, support: Bool}
    returns: Bool
    expression: latest_stance_differs(filter(heard, s => s.speaker == listener and s.epoch == epoch and s.team == members), support)
  latest_stance_differs:
    parameters: {heard: TeamSpeeches, support: Bool}
    returns: Bool
    expression: at(heard, size(heard) - 1).approve != support if size(heard) > 0 else True
  audience_gap:
    parameters: {listeners: Players, heard: TeamSpeeches, members: Players, epoch: Epoch, support: Bool}
    returns: ExperienceScore
    # Missing or opposing public stances are opportunities, not predicted conversions.
    expression: sum_by(listeners, p => 1 if listener_needs_stance(p, heard, members, epoch, support) else 0)
  audience_snapshot:
    parameters: {listeners: Players, heard: TeamSpeeches, members: Players, epoch: Epoch, support: Bool}
    returns: AudienceSnapshot
    expression: >
      AudienceSnapshot(listeners=listeners,
      aligned=filter(listeners, p => not listener_needs_stance(p, heard, members, epoch, support)),
      opposed=filter(listeners, p => not listener_needs_stance(p, heard, members, epoch, not support)))
  audience_reception:
    parameters: {before: AudienceSnapshot, support: Bool, ballot: ApprovalRecord}
    returns: ExperienceScore
    # Later public alignment is an observed association, not persuasion causality.
    expression: >
      sum_by(before.listeners, p =>
      (0 if p in before.aligned else 2 if p in before.opposed else 1)
      if (p in ballot.approve) == support else
      (-2 if p in before.aligned else 0 if p in before.opposed else -1))
  audience_has_unvoiced:
    parameters: {before: AudienceSnapshot}
    returns: Bool
    expression: size(union(before.aligned, before.opposed)) < size(before.listeners)
  fresh_advice:
    parameters: {self: PlayerRef, argument: TeamArgument, support: Bool, heard: TeamSpeeches, members: Players, epoch: Epoch}
    returns: Bool
    # Cosmetic reason changes do not make the same personal stance new.
    expression: >
      match(argument,
      ClaimConflict() => not exists(heard, s => s.speaker == self and s.rationale == argument and s.team == members and s.approve == support),
      ClaimAssessment(r) => changed_claim_opinion(filter(heard, s => s.speaker == self and comments_identity(s.rationale, r.speaker, r.claimed_role, r.claim_epoch)), argument) or
      (r.speaker == self and r.credible and reply_value(argument, heard, epoch, self) > 0 and
      not exists(heard, s => s.speaker == self and s.epoch == epoch and s.rationale == argument)),
      EvilExhausted() => not exists(heard, s => s.epoch == epoch and s.team == members and s.approve == support and s.rationale == argument),
      Judgment() => not exists(heard, s => s.speaker == self and s.epoch == epoch and s.team == members and s.approve == support),
      TestTeam() => not exists(heard, s => s.speaker == self and s.epoch == epoch and s.team == members and s.approve == support),
      FailureOverlap() => not exists(heard, s => s.speaker == self and s.epoch == epoch and s.team == members and s.approve == support),
      SuccessCore() => not exists(heard, s => s.speaker == self and s.epoch == epoch and s.team == members and s.approve == support and s.rationale == argument),
      TrustSpeaker() => not exists(heard, s => s.speaker == self and s.epoch == epoch and s.team == members and s.approve == support))
  changed_claim_opinion:
    parameters: {previous: TeamSpeeches, argument: TeamArgument}
    returns: Bool
    expression: at(previous, size(previous) - 1).rationale != argument if size(previous) > 0 else True
  coordination_value:
    parameters: {fresh: Bool, gap: ExperienceScore, preference: ExperienceScore}
    returns: ExperienceScore
    expression: (gap if preference > 0 else -gap if preference < 0 else 0) if fresh else 0
  goal_direction:
    parameters: {preference: ExperienceScore}
    returns: GoalDirection
    expression: 1 if preference > 0 else -1 if preference < 0 else 0
  expression_preference:
    parameters: {support: Bool, members: Players, perspective: DiscussionPerspective}
    returns: ExperienceScore
    # Intended direction comes from the local board judgment, not audience approval.
    expression: discussion_preference(members, perspective) * (1 if support else -1)
  advice_information:
    parameters: {fresh: Bool, gap: ExperienceScore, argument: TeamArgument, members: Players, support: Bool, results: QuestHistory, census: PopulationReports}
    returns: ExperienceScore
    expression: >
      (3 if argument_verdict(argument, members, support, results, census) == ArgumentVerdict.verified else
      match(argument, ClaimAssessment() => 2, ClaimConflict() => 2, Judgment() => (1 if gap > 0 else 0), TestTeam() => (1 if gap > 0 else 0),
      FailureOverlap() => (1 if gap > 0 else 0), SuccessCore() => (1 if gap > 0 else 0), TrustSpeaker() => 0, EvilExhausted() => 0)) if fresh else 0
  fresh_alternative:
    parameters: {members: Players, suggestions: TeamSuggestions, epoch: Epoch, self: PlayerRef, rationale: MaybeTeamArgument}
    returns: Bool
    expression: changed_alternative(filter(suggestions, s => s.epoch == epoch and s.speaker == self), members, rationale)
  changed_alternative:
    parameters: {previous: TeamSuggestions, members: Players, rationale: MaybeTeamArgument}
    returns: Bool
    expression: at(previous, size(previous) - 1).members != members or at(previous, size(previous) - 1).rationale != rationale if size(previous) > 0 else True
  alternative_arguments:
    parameters: {history: QuestHistory, members: Players, current: Players, heard: TeamSpeeches, epoch: Epoch, self: PlayerRef, claims: IdentitySpeeches, responding: Bool, cast: Roles, results: QuestHistory, census: PopulationReports}
    returns: MaybeTeamArguments
    # Keep distinct relevant intentions, without multiplying unrelated identity commentary by teams.
    expression: >
      filter(suggestion_arguments(history, members, heard, epoch, self,
      filter(claims, c => not exists(claims, n => n.speaker == c.speaker and n.epoch > c.epoch)), responding, cast),
      a => relevant_alternative_argument(a, members, current, results, census))
  relevant_alternative_argument:
    parameters: {argument: MaybeTeamArgument, members: Players, current: Players, results: QuestHistory, census: PopulationReports}
    returns: Bool
    expression: >
      match(argument, Judgment() => False, TestTeam() => True, SuccessCore() => True, FailureOverlap() => False,
      TrustSpeaker() => True, EvilExhausted() => argument_verdict(argument, members, True, results, census) == ArgumentVerdict.verified,
      ClaimAssessment(r) => r.speaker in difference(members, current) if r.credible else r.speaker in difference(current, members),
      ClaimConflict(r) => (r.first.speaker in members) != (r.second.speaker in members)) if argument is not None else True
  alternative_value:
    parameters: {fresh: Bool, listeners: Players, rejections: Count, current_preference: ExperienceScore, gain: ExperienceScore}
    returns: ExperienceScore
    # A contingent opportunity to replace a rejected team, not the team's task utility.
    expression: (4 if gain >= 75 else 3 if gain >= 50 else 2 if gain >= 25 else 1) if fresh and size(listeners) > 0 and rejections < 4 and current_preference < 0 and gain > 0 else 0
  fresh_identity:
    parameters: {self: PlayerRef, claim: Role, claims: IdentitySpeeches}
    returns: Bool
    expression: not exists(claims, s => s.speaker == self and s.role == claim)
  identity_projection_value:
    parameters: {fresh: Bool, self: PlayerRef, own: RoleReports, claim: Role, claims: IdentitySpeeches, listeners: Players}
    returns: ExperienceScore
    # Cover and decoy motives are subjective; a public claim never certifies a role.
    expression: >
      ((-6 if current_role(own) == Role.merlin else
      (3 if evil_role(current_role(own)) or exists(claims, s => s.speaker != self and s.role == Role.merlin) else 0))
      if claim == Role.merlin else
      (2 if current_role(own) == Role.merlin or current_role(own) == Role.assassin else 0)
      if claim == Role.servant else -2) if fresh and size(listeners) > 0 else 0
  merlin_signal:
    parameters: {target: PlayerRef, self: PlayerRef, own: RoleReports, peers: PlayerReports, suspects: PlayerReports, votes: ApprovalHistory, mind: PlayerJudgment}
    returns: ExperienceScore
    expression: judged_merlin_claim(mind, target) + sum_by(votes, v => ((8 if target in v.reject else -2) if enemy_count(v.team, self, own, peers, suspects) > 0 else (2 if target in v.approve else 0)))
semantics:
  ExperientialAvalon:
    features: [failure_threshold, failure_overlap_none, failure_overlap_less_than_half, failure_overlap_at_least_half, failure_overlap_full, zero_fail_retention_none, zero_fail_retention_less_than_half, zero_fail_retention_at_least_half, zero_fail_retention_full, team_direct_alignment_aligned, team_direct_alignment_divergent, team_direct_alignment_mixed, leader_direct_alignment_aligned, leader_direct_alignment_divergent, leader_direct_alignment_mixed, proposal, vote, speech, claim, mission, assassination, support, oppose, danger, good, evil, clean, tainted, capacity_safe, capacity_risk, final_rejection, grounded, claim_discussion, claim_trust, alternative, yield_floor, novel, pressured, success_core, testing, audience_unvoiced, audience_opposed, goal_aligned, goal_opposed, comparison, conditional, response, redirection, planning, plan_participation, withdrawal, coordinating, public_opinion, questioning, answering, compound, dialogue_window, dialogue_shape, dialogue_position, dialogue_subject, dialogue_intent, dialogue_reply_form]
    outcomes: [benefit, reception, coordination, concealment, credibility, information, effort, evidence]
    # These are subjective preferences over already checked candidate features,
    # not world facts or hidden-role inference.
    appraisal:
      caution: {avoid: [danger]}
      curiosity: {seek: [novel, testing]}
      evidence_sensitivity: {seek: [grounded]}
    # Utility transfers only within the same goal alignment and certainty context.
    applicability:
      benefit: [failure_threshold, proposal, vote, speech, claim, mission, assassination, support, oppose, good, evil, clean, tainted, capacity_safe, capacity_risk, final_rejection, alternative, claim_discussion, claim_trust, yield_floor, novel, pressured, audience_unvoiced, audience_opposed, comparison, conditional, response, redirection, planning, plan_participation, withdrawal, coordinating, public_opinion, questioning, answering, compound]
      credibility: [failure_threshold, proposal, vote, speech, claim, mission, assassination, support, oppose, clean, tainted, capacity_safe, capacity_risk, final_rejection, grounded, alternative, claim_discussion, claim_trust, yield_floor, novel, pressured, success_core, testing, comparison, conditional, response, redirection, planning, plan_participation, withdrawal, coordinating, public_opinion, questioning, answering, compound]
      reception: [speech, support, oppose, good, evil, clean, tainted, capacity_safe, capacity_risk, final_rejection, claim_discussion, alternative, novel, audience_unvoiced, audience_opposed, comparison, conditional, response, redirection, planning, plan_participation, withdrawal, coordinating, public_opinion, questioning, answering, compound, dialogue_window, dialogue_shape, dialogue_position, dialogue_subject, dialogue_intent, dialogue_reply_form]
      information: [speech, public_opinion, questioning, answering, compound, comparison, conditional, response, redirection, planning, plan_participation, withdrawal, novel, dialogue_window, dialogue_shape, dialogue_position, dialogue_subject, dialogue_intent, dialogue_reply_form]
      coordination: [speech, support, oppose, good, evil, clean, tainted, capacity_safe, capacity_risk, final_rejection, claim_discussion, alternative, novel, pressured, audience_unvoiced, audience_opposed, goal_aligned, goal_opposed, comparison, conditional, response, redirection, planning, plan_participation, withdrawal, coordinating, public_opinion, questioning, answering, compound]
    feedback:
      ReviewDialogue:
        definition: [Speak, CompareTeams, StateCondition, RespondStatement, RedirectDiscussion, ProposePlan, DecidePlan, RetractStatement, StateOpinion, AskQuestion, AnswerQuestion]
        receipts:
          replies:
            channel: publish_discussion.said
            collect: {type: DiscussionStatements, item: heard_reply, until: ending}
            related:
              key: heard_reply.key
              link: feedback_target(heard_reply.content, True)
              roots: map(utterance, s => s.key)
              depth: 2
            where: feedback_related(heard_reply, utterance, listeners, replies)
          ending: {terminal: finish, boundary: true}
        when: size(utterance) > 0
        outcomes:
          reception: utterance_reception(utterance, listeners, replies)
          information: utterance_information(utterance, listeners, replies)
      ReviewProposal:
        definition: ProposeTeam
        receipts:
          outcome: {channel: reveal_quest.result, match: {epoch: outcome.epoch, group: outcome.team}}
        outcomes: {benefit: '48 if outcome.failed == evil_role(perspective) else -48'}
      ReviewVote:
        definition: ApproveTeam
        receipts:
          outcome: {channel: reveal_quest.result, match: {epoch: outcome.epoch, group: outcome.team}}
        outcomes:
          benefit: '48 if approve == (outcome.failed == evil_role(perspective)) else -48'
          credibility: '16 if approve != outcome.failed else -16'
      ReviewSpeech:
        definition: AdviseTeam
        receipts:
          outcome: {channel: reveal_quest.result, match: {epoch: outcome.epoch, group: outcome.team}}
        when: first_expression and task_rationale
        # Task agreement is weak retrospective consistency, not persuasion success.
        outcomes: {credibility: '3 if support_team != outcome.failed else -3'}
      ReviewAudience:
        definition: AdviseTeam
        receipts:
          ballot: {channel: reveal_approval.result, match: {epoch: ballot.epoch, group: ballot.team}}
        when: first_expression and task_rationale and size(audience.listeners) > 0
        outcomes:
          reception: audience_reception(audience, support_team, ballot)
          coordination: expression_direction * audience_reception(audience, support_team, ballot)
      ReviewMission:
        definition: MissionCard
        receipts:
          outcome: {channel: reveal_quest.result, match: {epoch: outcome.epoch, group: outcome.team}}
        outcomes: {benefit: '48 if outcome.failed == evil_role(perspective) else -48'}
      ReviewSuggestion:
        definition: SuggestTeam
        receipts:
          outcome: {channel: reveal_quest.result, match: {epoch: outcome.epoch, group: outcome.team}}
        when: first_expression
        outcomes: {credibility: '3 if not outcome.failed else -3'}
