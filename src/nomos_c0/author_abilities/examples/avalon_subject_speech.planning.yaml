# Both expression families compete in one search, using the original AI appraiser.
schema: nomos.author.opportunity_planning
name: SubjectSpeech
actor: {person: PlayerRef}
local:
  type: SpeechLocal
  views:
    roster_view: {projection: Players, channel: roster}
    window_view: {projection: DiscussionContext, channel: speech_window}
    past_quests: {reports: QuestHistory, channel: reveal_quest.result}
  value: >
    SpeechLocal(self=person, players=projected(roster_view), window=projected(window_view),
      history=reports(past_quests),
      ready=can_speak(projected(window_view).phase, projected(window_view).serial, person.speech_epoch)
        and projected(window_view).kind == DiscussionKind.proposal)
guidance:
  recall: [past_quests]
  exploration: 3
  actions:
    compare_teams:
      inputs:
        preferred:
          member: candidate
          priority: >
            sum_by(reports(past_quests), q =>
              (1 if q.fails == 0 else -1) if candidate in q.team else 0)
actions:
  compare_teams:
    inputs:
      preferred:
        type: Players
        choose: {subset: local.players, min: size(local.window.members), max: size(local.window.members)}
      alternative:
        type: Players
        choose: {subset: local.window.members, min: size(local.window.members), max: size(local.window.members)}
        constraint: preferred != alternative
      grounds:
        type: TeamArguments
        choose:
          subset: speech_arguments(local.history, preferred, TeamSpeeches([]), local.window.serial, local.self, True)
          min: 1
          max: 1
    where: local.ready
  state_condition:
    inputs:
      conditions:
        type: TeamConditions
        construct:
          set:
            min: 1
            max: 1
            item:
              cases:
                Contains:
                  fields:
                    members: {subset: local.players, min: 1, max: 1}
                Excludes:
                  fields:
                    members: {subset: local.players, min: 1, max: 1}
      satisfied: {type: Stance, choose: 'Stances([Stance.support, Stance.oppose])'}
      otherwise:
        type: Stance
        choose: 'filter(Stances([Stance.support, Stance.oppose, Stance.undecided]), s => s != satisfied)'
    where: local.ready
