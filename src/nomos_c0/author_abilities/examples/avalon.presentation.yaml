schema: nomos.tabletop.presentation
title: 阿瓦隆
result_label: 获胜阵营
description: 善良方争取三次任务成功并保护梅林；邪恶方破坏任务、连续否决队伍或找出梅林。
rules:
  title: 阿瓦隆 · 本局规则与流程
  sections:
    - title: 阵营与胜利
      text: '善良方争取三次任务成功，并躲过刺客的指认。邪恶方让三次任务失败，或连续五次否决队伍，或在最后指认梅林。梅林、帕西瓦尔、忠臣属于善良方；莫甘娜、刺客、爪牙、莫德雷德属于邪恶方。角色数量由本局配置决定。'
    - title: 组队与表决
      text: '队长选择本轮规定人数的队伍，也可选择自己。启用公开发言时，先讨论一轮，再回应一轮；每轮每人可选择一次表达或主动让过，每次提队可自称身份一次。可以信任或质疑已听见的自称；被评论者可在回应轮维护自己的说法。两轮结束后全体秘密表决，严格过半赞成才出发；否决后轮换队长。各轮组队人数与完成情况见顶部任务总览。'
    - title: 任务与刺杀
      text: '队员各交一张任务牌。善良方只能成功，邪恶方可成功或破坏。五、六人局每轮一张失败牌即失败；七人及以上的第四轮是保护轮，至少两张失败牌才失败。任务总览按本局配置显示人数与门槛。三次成功后，刺客选择一名目标；命中梅林则邪恶方胜利。'
    - title: 你掌握的信息
      text: '邪恶成员认识邪恶同伴；梅林认识邪恶人物，莫德雷德例外。帕西瓦尔知道梅林与莫甘娜这组候选，但不知道谁是谁。自己的身份、已知线索和本轮队伍分别显示；他人的秘密牌在集体结算前保密。'
  sources:
    - {title: 阿瓦隆原版规则书（英文 PDF）, url: 'https://avalon.fun/pdfs/rules.pdf'}
