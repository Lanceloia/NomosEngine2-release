actions:
  propose:
    surface: seats
    icon: users
    title: 组建远征队
    description: 选择本轮出发的人物，然后确认队伍。你也可以选择自己。
    inputs: {members: {label: 远征队成员}}
  approve:
    surface: buttons
    icon: check
    title: 表决这支队伍
    description: 全员选择后，公开表决结果；严格过半赞成才能出发。
    preview: {本轮队伍: team}
    inputs: {approve: {label: 你的表决, options: {'true': 赞成, 'false': 反对}, icons: {'true': check, 'false': x}}}
  quest:
    surface: inline
    icon: flag
    title: 提交任务牌
    description: 全队提交后，公布任务结果与失败牌数。
    inputs: {sabotage: {label: 你的任务牌, options: {'true': 破坏任务, 'false': 完成任务}, icons: {'true': sword, 'false': shield}}}
  assassinate:
    surface: seats
    icon: sword
    title: 指认梅林
    description: 善良方已完成三次任务。找出梅林，为邪恶方赢得最后的胜利。
    inputs: {target: {label: 你认为谁是梅林}}
