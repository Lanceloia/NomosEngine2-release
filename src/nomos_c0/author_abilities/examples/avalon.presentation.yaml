components:
  QuestStep:
    kind: table
    columns:
      mission: 任务
      members: 组队人数
      threshold: 失败所需票数
      protected: {label: 保护轮, values: {'true': 是, 'false': '—'}}
      status: {label: 进展, values: {pending: 待进行, current: 正在进行, succeeded: 成功, failed: 失败, unplayed: 未进行}}
      fails: 已揭示失败票
  FinalResult: {kind: record, fields: {winner: {label: 获胜阵营}, reason: {label: 结束原因}, identities: {label: 身份揭晓}, accusation: {label: 刺客指认, omit_empty: true}}}
  FinalIdentity: {kind: table, columns: {player: 玩家, role: 身份}}
  ApprovalRecord:
    kind: table
    columns: {mission: 任务, epoch: 本局提队, leader: 队长, team: 队伍, approve: 赞成, reject: 反对, passed: {label: 结果, values: {'true': 通过, 'false': 否决}}}
  QuestRecord:
    kind: table
    columns: {mission: 任务, epoch: 本局提队, team: 队伍, fails: 失败牌数, failed: {label: 结果, values: {'true': 失败, 'false': 成功}}}
  PlayerRef: {kind: badge, icon: user}
  Role:
    kind: badge
    items:
      merlin: {icon: crown, color: '#497d9b', label: 梅林 · 善良方, description: '利用你掌握的邪恶线索帮助任务成功，同时隐藏身份以躲过刺客。'}
      percival: {icon: eye, color: '#497d9b', label: 帕西瓦尔 · 善良方, description: '你看见的候选中有梅林与莫甘娜。结合提议与任务结果辨认，并帮助保护梅林。'}
      servant: {icon: shield, color: '#397862', label: 忠臣 · 善良方, description: '结合公开提队、表决与任务结果寻找可靠队伍，协助完成三次任务并保护梅林。'}
      morgana: {icon: moon, color: '#a24f70', label: 莫甘娜 · 邪恶方, description: '你会与梅林共同出现在帕西瓦尔的候选中。可以利用发言影响判断，协助邪恶方获胜。'}
      assassin: {icon: sword, color: '#a24f70', label: 刺客 · 邪恶方, description: '与邪恶同伴协作。即使善良方完成三次任务，你仍可通过指认梅林赢下对局。'}
      minion: {icon: user, color: '#a24f70', label: 爪牙 · 邪恶方}
      mordred: {icon: crown, color: '#a24f70', label: 莫德雷德 · 邪恶方}
