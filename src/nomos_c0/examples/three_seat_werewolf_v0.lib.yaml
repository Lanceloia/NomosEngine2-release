# Reusable record, owner, and LawDef declarations for the Werewolf test world.
schema: c0.nominal_lib.v1
type_aliases:
  ParticipantName: {str: [1, 64]}
  RoundNumber: {int: [1, 1000000]}
  Role: {enum: [wolf, seer, witch, villager]}
  OptionalParticipant: {optional: ParticipantName}
  BallotHistory: {tuple: {item: Vote, max: 128}}
pure_definitions:
  - name: town.remaining_count
    parameters:
      players: {tuple: Player}
      roles: {tuple: Assignment}
      excluded: {optional: str}
      wolf_side: bool
    result: int
    stage: admission
    body:
      count_matching:
        collection:
          query:
            from: {collection: players, as: survivor, key: id}
            join: {collection: roles, as: assignment, key: id}
            where:
              all:
                - survivor.alive
                - survivor.id != excluded
                - if:
                    when: wolf_side
                    then: assignment.role == 'wolf'
                    else: assignment.role != 'wolf'
        as: survivor
        where: true
  - name: town.living_role_count
    parameters:
      players: {tuple: Player}
      roles: {tuple: Assignment}
      role: str
    result: int
    stage: admission
    body:
      count_matching:
        collection:
          query:
            from: {collection: players, as: living, key: id}
            join: {collection: roles, as: assignment, key: id}
            where: living.alive and assignment.role == role
        as: living
        where: true
  - name: town.has_living_role
    parameters:
      players: {tuple: Player}
      roles: {tuple: Assignment}
      role: str
    result: bool
    stage: admission
    body:
      exists:
        collection:
          query:
            from: {collection: players, as: living, key: id}
            join: {collection: roles, as: assignment, key: id}
            where: living.alive and assignment.role == role
        as: living
        where: true
records:
  - name: Player
    fields:
      - name: id
        type: ParticipantName
      - name: alive
        type: bool
    invariant: null
  - name: Assignment
    fields:
      - name: id
        type: ParticipantName
      - name: role
        type: Role
    invariant: null
  - name: Vote
    fields:
      - name: round
        type: RoundNumber
      - name: voter
        type: ParticipantName
      - name: target
        type: ParticipantName
      - name: action
        type: occurrence_ref
    invariant: null
  - name: OwnVote
    fields:
      - name: round
        type: RoundNumber
      - name: target
        type: ParticipantName
      - name: action
        type: occurrence_ref
    invariant: null
  - name: Observation
    fields:
      - name: round
        type: RoundNumber
      - name: target
        type: ParticipantName
      - name: faction
        type: {enum: [wolf, town]}
      - name: action
        type: occurrence_ref
    invariant: null
  - name: Scene
    fields:
      - name: phase
        type: {enum: [day, night, finished]}
      - name: round
        type: RoundNumber
      - name: players
        type: {tuple: {item: Player, max: 64}}
      - name: roles
        type: {tuple: {item: Assignment, max: 64}}
      - name: ballots
        type: BallotHistory
      - name: wolf_ballots
        type: BallotHistory
      - name: winner
        type: {enum: [none, wolf, town]}
      - name: pending_attack
        type: OptionalParticipant
      - name: selection_done
        type: bool
      - name: witch_done
        type: bool
      - name: witch_saved
        type: bool
      - name: seer_done
        type: bool
      - name: last_death
        type: OptionalParticipant
    invariant: null
  - name: AttackChoice
    fields:
      - name: round
        type: RoundNumber
      - name: target
        type: ParticipantName
      - name: action
        type: occurrence_ref
    invariant: null
  - name: NightChoice
    fields:
      - name: round
        type: RoundNumber
      - name: kind
        type: {enum: [inspect, pass]}
      - name: action
        type: occurrence_ref
    invariant: null
  - name: WitchNotice
    fields:
      - name: round
        type: RoundNumber
      - name: target
        type: OptionalParticipant
      - name: selection
        type: occurrence_ref
      - name: notice
        type: occurrence_ref
    invariant: null
  - name: WitchChoice
    fields:
      - name: round
        type: RoundNumber
      - name: saved
        type: bool
      - name: target
        type: OptionalParticipant
      - name: selection
        type: occurrence_ref
      - name: notice
        type: occurrence_ref
      - name: action
        type: occurrence_ref
    invariant: null
  - name: Actor
    fields:
      - name: name
        type: ParticipantName
      - name: own_role
        type: Role
      - name: votes
        type: {tuple: {item: OwnVote, max: 128}}
      - name: observations
        type: {tuple: {item: Observation, max: 128}}
      - name: choices
        type: {tuple: {item: NightChoice, max: 128}}
      - name: attacks
        type: {tuple: {item: AttackChoice, max: 128}}
      - name: witch_notice
        type:
          optional: WitchNotice
      - name: witch_choices
        type: {tuple: {item: WitchChoice, max: 128}}
      - name: healing_available
        type: bool
    invariant: null
  - name: VoteAttempt
    fields:
      - name: actor
        type: ParticipantName
      - name: target
        type: ParticipantName
    invariant: null
  - name: Envelope
    fields:
      - name: action
        type: occurrence_ref
      - name: target
        type: ParticipantName
    invariant: null
  - name: PassAttempt
    fields:
      - name: actor
        type: ParticipantName
    invariant: null
  - name: PassEnvelope
    fields:
      - name: action
        type: occurrence_ref
    invariant: null
  - name: WitchAttempt
    fields:
      - name: actor
        type: ParticipantName
      - name: save
        type: bool
    invariant: null
owners:
  - symbol: scene
    key: c0.three-seat.scene
    version: three-seat-scene-v1
    state: Scene
    identity_field: null
    write: replace_one
    seat_read:
      - phase
      - round
      - players
      - winner
      - last_death
  - template: participant
    key_prefix: c0.werewolf.actor.
    version: werewolf-actor-v1
    state: Actor
    identity_field: name
    write: replace_one
    seat_read:
      - name
      - own_role
      - votes
      - observations
      - choices
      - attacks
      - witch_notice
      - witch_notice.round
      - witch_notice.target
      - witch_choices
      - healing_available
lawdefs:
  - name: action.vote
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings:
          - name: voter_state
            collection: scene.players
            as: candidate
            where: candidate.id == payload.actor
            required: true
          - name: target_state
            collection: scene.players
            as: candidate
            where: candidate.id == payload.target
            required: true
        guard:
          all:
            - scene.phase == 'day'
            - scene.winner == 'none'
            - actor.name == payload.actor
            - voter_state.alive
            - target_state.alive
            - none_matching:
                collection: scene.ballots
                as: prior
                where: prior.round == scene.round and prior.voter == payload.actor
        outputs:
          ballots:
            append:
              - scene.ballots
              - record:
                  type: Vote
                  fields:
                    round: scene.round
                    voter: payload.actor
                    target: payload.target
                    action: occurrence
          votes:
            append:
              - actor.votes
              - record:
                  type: OwnVote
                  fields:
                    round: scene.round
                    target: payload.target
                    action: occurrence
          action: occurrence
          target: payload.target
  - name: event.resolve_day
    family: direct_event
    formals: {}
    body:
      law:
        schema: c0.value.v1
        bindings:
          - name: leader
            collection: scene.players
            as: candidate
            where:
              all:
                - candidate.alive
                - let:
                    name: support
                    value: count(ballot for ballot in scene.ballots if ballot.round == scene.round and ballot.target == candidate.id)
                    in: support * 2 > count(player for player in scene.players if player.alive)
            required: false
          - name: remaining_wolves
            stage: effect
            let:
              call:
                ref: town.remaining_count
                args:
                  players: scene.players
                  roles: scene.roles
                  excluded: leader.id if leader is not None else None
                  wolf_side: {const: true}
          - name: remaining_town
            stage: effect
            let:
              call:
                ref: town.remaining_count
                args:
                  players: scene.players
                  roles: scene.roles
                  excluded: leader.id if leader is not None else None
                  wolf_side: {const: false}
        guard:
          all:
            - scene.phase == 'day'
            - >-
              count(ballot for ballot in scene.ballots if ballot.round == scene.round)
              == count(player for player in scene.players if player.alive)
        outputs:
          players:
            if:
              when: leader is not None
              then:
                replace_unique:
                  collection: scene.players
                  old: leader
                  new:
                    copy:
                      from: leader
                      changes:
                        alive: {const: false}
                  key: id
              else: scene.players
          phase:
            if:
              when: leader is not None and (remaining_wolves == 0 or remaining_town == 0)
              then: {const: finished}
              else: {const: night}
          winner:
            if:
              when: leader is not None and remaining_wolves == 0
              then: {const: town}
              else:
                "'wolf' if leader is not None and remaining_town == 0 else 'none'"
          last_death: leader.id if leader is not None else scene.last_death
  - name: action.attack
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings:
          - name: self_state
            collection: scene.players
            as: candidate
            where: candidate.id == payload.actor
            required: true
          - name: target_state
            collection: scene.players
            as: candidate
            where: candidate.id == payload.target
            required: true
        guard:
          all:
            - scene.phase == 'night'
            - scene.winner == 'none'
            - actor.name == payload.actor
            - self_state.alive
            - target_state.alive
            - payload.actor != payload.target
            - actor.own_role == 'wolf'
            - not scene.selection_done
            - none_matching:
                collection: scene.wolf_ballots
                as: prior
                where: prior.round == scene.round and prior.voter == payload.actor
        outputs:
          wolf_ballots:
            append:
              - scene.wolf_ballots
              - record:
                  type: Vote
                  fields:
                    round: scene.round
                    voter: payload.actor
                    target: payload.target
                    action: occurrence
          action: occurrence
          target: payload.target
          attacks:
            append:
              - actor.attacks
              - record:
                  type: AttackChoice
                  fields:
                    round: scene.round
                    target: payload.target
                    action: occurrence
  - name: action.divine
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings:
          - name: self_state
            collection: scene.players
            as: candidate
            where: candidate.id == payload.actor
            required: true
          - name: target_state
            collection: scene.players
            as: candidate
            where: candidate.id == payload.target
            required: true
          - name: target_role
            collection: scene.roles
            key: id
            value: payload.target
            required: true
        guard:
          all:
            - scene.phase == 'night'
            - scene.winner == 'none'
            - actor.name == payload.actor
            - self_state.alive
            - target_state.alive
            - payload.actor != payload.target
            - actor.own_role == 'seer'
            - not scene.seer_done
        outputs:
          seer_done: {const: true}
          observations:
            append:
              - actor.observations
              - record:
                  type: Observation
                  fields:
                    round: scene.round
                    target: payload.target
                    faction: "'wolf' if target_role.role == 'wolf' else 'town'"
                    action: occurrence
          action: occurrence
          target: payload.target
          choices:
            append:
              - actor.choices
              - record:
                  type: NightChoice
                  fields:
                    round: scene.round
                    kind: {const: inspect}
                    action: occurrence
  - name: event.select_unanimous
    family: direct_event
    formals: {}
    body:
      law:
        schema: c0.value.v1
        bindings:
          - name: chosen
            collection: scene.players
            as: candidate
            where:
              all:
                - candidate.alive
                - exists:
                    collection: scene.wolf_ballots
                    as: ballot
                    where: ballot.round == scene.round and ballot.target == candidate.id
                - none_matching:
                    collection: scene.wolf_ballots
                    as: ballot
                    where: ballot.round == scene.round and ballot.target != candidate.id
            required: false
        guard:
          all:
            - scene.phase == 'night'
            - not scene.selection_done
            - eq:
                - count_matching:
                    collection: scene.wolf_ballots
                    as: ballot
                    where: ballot.round == scene.round
                - call:
                    ref: town.living_role_count
                    args:
                      players: scene.players
                      roles: scene.roles
                      role: {const: wolf}
            - any:
                - scene.seer_done
                - not:
                    call:
                      ref: town.has_living_role
                      args:
                        players: scene.players
                        roles: scene.roles
                        role: {const: seer}
        outputs:
          pending_attack: chosen.id if chosen is not None else None
          selection_done: {const: true}
  - name: event.select_majority
    family: direct_event
    formals: {}
    body:
      law:
        schema: c0.value.v1
        bindings:
          - name: chosen
            collection: scene.players
            as: candidate
            where:
              all:
                - candidate.alive
                - let:
                    name: support
                    value: count(ballot for ballot in scene.wolf_ballots if ballot.round == scene.round and ballot.target == candidate.id)
                    in: support * 2 > count(ballot for ballot in scene.wolf_ballots if ballot.round == scene.round)
            required: false
        guard:
          all:
            - scene.phase == 'night'
            - not scene.selection_done
            - eq:
                - count_matching:
                    collection: scene.wolf_ballots
                    as: ballot
                    where: ballot.round == scene.round
                - call:
                    ref: town.living_role_count
                    args:
                      players: scene.players
                      roles: scene.roles
                      role: {const: wolf}
            - any:
                - scene.seer_done
                - not:
                    call:
                      ref: town.has_living_role
                      args:
                        players: scene.players
                        roles: scene.roles
                        role: {const: seer}
        outputs:
          pending_attack: chosen.id if chosen is not None else None
          selection_done: {const: true}
  - name: event.resolve_night
    family: direct_event
    formals: {}
    body:
      law:
        schema: c0.value.v1
        bindings:
          - name: target_state
            collection: scene.players
            as: candidate
            where: candidate.id == scene.pending_attack and not scene.witch_saved
            required: false
          - name: remaining_wolves
            stage: effect
            let:
              call:
                ref: town.remaining_count
                args:
                  players: scene.players
                  roles: scene.roles
                  excluded: target_state.id if target_state is not None else None
                  wolf_side: {const: true}
          - name: remaining_town
            stage: effect
            let:
              call:
                ref: town.remaining_count
                args:
                  players: scene.players
                  roles: scene.roles
                  excluded: target_state.id if target_state is not None else None
                  wolf_side: {const: false}
        guard:
          all:
            - scene.phase == 'night'
            - scene.selection_done
            - any:
                - scene.witch_done
                - not:
                    call:
                      ref: town.has_living_role
                      args:
                        players: scene.players
                        roles: scene.roles
                        role: {const: witch}
        outputs:
          players:
            if:
              when: target_state is not None
              then:
                replace_unique:
                  collection: scene.players
                  old: target_state
                  new:
                    copy:
                      from: target_state
                      changes:
                        alive: {const: false}
                  key: id
              else: scene.players
          phase:
            >-
              'finished' if target_state is not None
              and (remaining_wolves == 0 or remaining_town == 0) else 'day'
          round: scene.round + 1
          winner:
            if:
              when: target_state is not None and remaining_wolves == 0
              then: {const: town}
              else:
                "'wolf' if target_state is not None and remaining_town == 0 else 'none'"
          last_death: target_state.id if target_state is not None else None
          pending_attack: {const: null}
          seer_done: {const: false}
          selection_done: {const: false}
          witch_done: {const: false}
          witch_saved: {const: false}
  - name: event.witch_notice
    family: direct_actor_event
    formals: {}
    body:
      law:
        schema: c0.value.v1
        bindings:
          - name: self_state
            collection: scene.players
            as: candidate
            where: candidate.id == actor.name
            required: true
        guard:
          all:
            - scene.phase == 'night'
            - scene.selection_done
            - actor.own_role == 'witch'
            - self_state.alive
        outputs:
          witch_notice:
            record:
              type: WitchNotice
              fields:
                round: scene.round
                target: scene.pending_attack
                selection: trigger.occurrence
                notice: occurrence
  - name: action.witch_intervene
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings:
          - name: self_state
            collection: scene.players
            as: candidate
            where: candidate.id == payload.actor
            required: true
        guard:
          require:
            - night: scene.phase == 'night'
            - target_selected: scene.selection_done
            - not_yet_chosen: not scene.witch_done
            - game_open: scene.winner == 'none'
            - actor_matches: actor.name == payload.actor
            - witch_role: actor.own_role == 'witch'
            - alive: self_state.alive
            - notice_received: actor.witch_notice is not None
            - current_notice: actor.witch_notice.round == scene.round
            - notified_target: actor.witch_notice.target == scene.pending_attack
            - save_choice:
                if:
                  when: payload.save
                  then:
                    require:
                      - victim_exists: scene.pending_attack is not None
                  else: true
        effects:
          - use_healing:
              when: payload.save
              consume: actor.healing_available
        outputs:
          witch_done: {const: true}
          witch_saved: payload.save
          witch_choices:
            append:
              - actor.witch_choices
              - record:
                  type: WitchChoice
                  fields:
                    round: scene.round
                    saved: payload.save
                    target: actor.witch_notice.target
                    selection: actor.witch_notice.selection
                    notice: actor.witch_notice.notice
                    action: occurrence
          action: occurrence
  - name: action.pass
    family: action
    formals: {}
    body:
      value:
        schema: c0.value.v1
        bindings:
          - name: self_state
            collection: scene.players
            as: candidate
            where: candidate.id == payload.actor
            required: true
        guard:
          all:
            - scene.phase == 'night'
            - scene.winner == 'none'
            - actor.name == payload.actor
            - actor.own_role == 'seer'
            - self_state.alive
            - not scene.seer_done
        outputs:
          seer_done: {const: true}
          choices:
            append:
              - actor.choices
              - record:
                  type: NightChoice
                  fields:
                    round: scene.round
                    kind: {const: pass}
                    action: occurrence
          action: occurrence
# Each family is declared once; C0 instantiates it for the closed Actor domain.
