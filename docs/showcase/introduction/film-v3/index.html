<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NomosEngine2 · 游戏原型的设计与验证</title>
<style>
@font-face{font-family:FilmChinese;src:url('font/chinese.woff') format('woff');font-display:block}
*{box-sizing:border-box}body{margin:0;background:#111214;color:#f3f4f5;font-family:FilmChinese,'Microsoft YaHei',sans-serif;letter-spacing:0}
main{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) 88px}
#picture{display:grid;place-items:center;overflow:hidden;min-height:0}
#stage{position:relative;width:min(100%,calc((100dvh - 88px)*16/9));aspect-ratio:16/9}
canvas{display:block;width:100%;height:100%}#subtitle{position:absolute;left:7%;right:7%;bottom:5%;text-align:center;font-size:25px;line-height:1.45;pointer-events:none;max-height:76px}
footer{padding:12px 24px;border-top:1px solid #33383d;display:grid;grid-template-columns:auto auto minmax(160px,1fr) 110px;gap:12px;align-items:center}
button,select{font:inherit;font-size:15px;background:#22272b;color:#f3f4f5;border:1px solid #555e69;border-radius:4px;padding:8px 12px;cursor:pointer}
button:hover,select:hover{background:#30373c}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #7cdac7;outline-offset:3px}
#transport{display:flex;gap:8px}#seek{width:100%;accent-color:#7cdac7}#time{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
#status{font-size:13px;color:#bbc2ca;grid-column:1/5}select{max-width:255px}
@media(max-width:1000px){footer{padding:8px 12px;gap:8px}select{max-width:190px}}
body.export main{display:block;height:100dvh}body.export #picture{height:100dvh}body.export #stage{width:min(100%,calc(100dvh*16/9))}body.export footer,body.export #subtitle{display:none}
</style>
<main>
<section id="picture" aria-label="游戏原型、工具职责、规则实验与冰宫真实交互">
<div id="stage"><canvas id="canvas" width="1440" height="810" aria-label="项目介绍动画"></canvas><div id="subtitle" aria-live="off"></div></div>
</section>
<footer>
<div id="transport"><button id="play" title="播放或暂停">播放</button><button id="restart" title="从头播放">重播</button></div>
<select id="chapter" aria-label="选择镜头段落"></select>
<input id="seek" type="range" min="0" value="0" step="0.01" aria-label="播放进度"><span id="time"></span>
<span id="status">第5版讲稿 · 最新 M1 实录</span>
</footer>
</main>
<audio id="audio" preload="auto" src="narration.mp3"></audio>
<script src="timeline.js"></script><script src="m1/media.js"></script><script src="film.js"></script>
</html>
